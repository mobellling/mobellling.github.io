里静了一下。",0],[8343,"“什么缺一个？”王策问。",0],[8345,"“五分钟内，完成最后的指标。”广播，“或者……”",0],[8347,"“所有人受罚。”",0],[8349,"成汐的心跳慢了半拍。",0],[8351,"大家面面相觑，沉默不语。没人愿意去死。",0],[8353,"五分钟，四分钟，三分钟，两分钟……",0],[8355,"时间一点点流逝，恐惧笼罩着整个教室。",0],[8357,"“它不会真的弄死所有人吧？”有人小声嘀咕。",0],[8359,"“肖中，你在磨蹭什么！”成汐心中埋怨。",0],[8361,"正当成汐想站出来自己完成“指标”时，一个声音从背后响起。",0],[8363,"“我来。”",0],[8365,"一个声音说。",0],[8367,"所有人都转过头。",0],[8369,"泽研站起来。",0],[8371,"她的脸上没有眼泪。她从于韵死的那一刻起就没有再哭过。",0],[8373,"“我来。”她又说了一遍。",0],[8375,"“泽研……”成汐想解释。",0],[8377,"“你别劝我。”泽研说，“我不是难过。我是算过了。”",0],[8379,"她走到“口”字中间，站了一会儿，然后转过身。",0],[8381,"“我这个人，没什么用。”她说，“我成绩不好，我家里也没钱，我考不上大学。我活着，就是多一个人分名额。”",0],[8383,"“不是这样的。”成汐说。",0],[8385,"“就是这么算的。”泽研说，“你们刚才不是都算过了吗。”",0],[8387,"她看向卢依田。",0],[8389,"卢依田低着头，没有说话。",0],[8391,"“我不怪你们。”泽研说，“我只是觉得，我不想再听下一个名字了。”",0],[8393,"她走到那块地砖前面。",0],[8395,"“成汐。”",0],[8397,"“嗯。”",0],[8399,"泽研笑了一下。",0],[8401,"然后她站上去。",0],[8403,"灯光闪了一下。",0],[8405,"地砖空了。",0],[8407,"屏幕上：",0],[8409,"剩余人数：10。",0],[8411,"四点五十分，屏幕暗下去。",0],[8413,"教室里剩下10个人。",0],[8415,"成汐坐在讲台边上，看着窗外那片黑。",0],[8417,"她想起一件事。",0],[8419,"张岚去哪了？",0],[8421,"还有七十分钟，天就要亮了。",0],[8423,"它答应过，撑到清晨，就给名额。",0],[8425,"可是它从来没有说过，名额有几个。",0],[8427,"她拿出自己记下的名单。",0],[8429,"成汐。丹丹。李景。泽研。赵克。卢依田。张岚。",0],[8431,"看到“李景”的时候，她停住了。",0],[8433,"她试着想李景。",0],[8435,"想不起来。",0],[8437,"她只记得一沓纸，纸上是同一句话：妈，你别哭。",0],[8439,"“赵克”……",0],[8441,"也想不起来。",0],[8443,"她什么也不记得。",0],[8445,"她的手很凉。",0],[8447,"如果把这些名字都忘了，那这些人就真的没了。",0],[8449,"她站起来。",0],[8451,"“还有七十分钟。”她说，“都别睡。”",0]]},{"t":"插曲 · 肖中","k":"inter","m":"none","d":"","f":0,"p":[[8455,"我认识成汐，是高一开学第一天。",0],[8457,"那天班主任让自我介绍，一个一个站起来。轮到她，她站起来，说：“我叫成汐，成功的成，潮汐的汐。”",0],[8459,"全班没人说话。",0],[8461,"我当时坐在最后一排，心里想，这个人真厉害。",0],[8463,"后来我发现她一点都不厉害。",0],[8465,"她只是比别人多做一点。",0],[8467,"别人不愿意收的作业，她收。别人不愿意擦的黑板，她擦。别人忘了的值日，她替。运动会没人报的项目，她报。",0],[8469,"她跑八百米，跑最后一名，跑完之后蹲在跑道边上吐。",0],[8471,"我给她递了一瓶水。",0],[8473,"她抬头看我，说“谢谢”。",0],[8475,"那是我们说的第一句话。",0],[8477,"高一冬天，我发现她每天早自习之前都去买牛奶。",0],[8479,"两瓶。一瓶原味，一瓶草莓。",0],[8481,"她自己的那瓶原味，从来不喝。她放在桌角，放到中午，再放回书包。",0],[8483,"草莓那瓶，她给陈丹丹。",0],[8485,"陈丹丹那时候胃不好，早上不吃东西。成汐就把牛奶焐在怀里，焐热了才给她。",0],[8487,"我见过一次。",0],[8489,"那天很冷，教室的暖气不热。成汐把牛奶塞进校服里，贴着肚子，缩着肩膀，一边背单词一边等。",0],[8491,"等了二十分钟。",0],[8493,"她把牛奶拿出来，摸了一下，觉得差不多了，才递给丹丹。",0],[8495,"丹丹接过去，说“谢了”，插上吸管就喝。",0],[8497,"她没有说别的。",0],[8499,"成汐也没有。",0],[8501,"那天我在最后一排，看着这一幕，心里想了一件事。",0],[8503,"我想，如果我是她，我会希望有人说一句“你也喝”。",0],[8505,"可没人说。",0],[8507,"她自己也不说。",0],[8509,"从那天起，我开始给她换水。",0],[8511,"每天晚自习之前，七点钟，她去办公室交考勤表。我就在那个时候，把她的保温杯拿到走廊尽头的水房，倒掉剩水，灌满热水，再放回原位。",0],[8513,"杯口朝左。",0],[8515,"她放杯子的时候杯口朝左。我一开始不知道，放错了一次，第二天她拿杯子的时候愣了一下，看了看杯口，没说什么。",0],[8517,"从那以后我就记住了。",0],[8519,"杯口朝左，把手朝里。",0],[8521,"我做了三年。",0],[8523,"她一直以为是值日生顺手，以为是教室暖和。",0],[8525,"她没问过。",0],[8527,"我也没说。",0],[8529,"我不敢说。",0],[8531,"我这个人，嘴笨。不是不会说话，是话到嘴边就变了味。",0],[8533,"我想说“你今天好看”，说出口的是“你头发上有粉笔灰”。",0],[8535,"我想说“你别太累”，说出口的是“作业收齐了吗”。",0],[8537,"我想说“我喜欢你”，说出口的是“班长”。",0],[8539,"叫了三年。",0],[8541,"叫顺了口。",0],[8543,"有时候我在心里练习。",0],[8545,"“成汐。”",0],[8547,"“成汐，你等一下。”",0],[8549,"“成汐，我有话跟你说。”",0],[8551,"练了很多遍。",0],[8553,"真正见到她，还是“班长”。",0],[8555,"我爸是跑长途的。一年在家待两个月。",0],[8557,"我妈是护士，上夜班。",0],[8559,"我从小一个人在家。一个人做饭，一个人吃，一个人写作业，一个人睡。",0],[8561,"我不怕社交。",0],[8563,"我只是不太会跟人说话。",0],[8565,"我说话的时候，总觉得自己在打扰别人。",0],[8567,"后来我遇见成汐。",0],[8569,"她不一样。",0],[8571,"她跟人说话的时候，会看着你的眼睛。她听你说话的时候，会等你说完。她不会打断你，不会笑你，不会说“这有什么好说的”。",0],[8573,"她只是听着。",0],[8575,"我有时候故意找她说话。",0],[8577,"“班长，作业收齐了吗？”",0],[8579,"“收齐了。”",0],[8581,"“班长，值日表贴一下。”",0],[8583,"“贴了。”",0],[8585,"“班长，后门别锁。”",0],[8587,"“知道了。”",0],[8589,"三句话，说完了。",0],[8591,"我走开，心里能高兴半天。",0],[8593,"赵克看出来了。",0],[8595,"有一次他在楼道里喊：“肖中，你天天跟着班长，是不是喜欢她啊。”",0],[8597,"我脸红了。",0],[8599,"我说：“你少放屁。”",0],[8601,"他说：“你脸红什么。”",0],[8603,"我说：“我热。”",0],[8605,"后来全班都知道了。",0],[8607,"他们不说，但是他们知道。",0],[8609,"成汐知道吗？",0],[8611,"我不知道。",0],[8613,"我猜她知道。",0],[8615,"因为有一回晚自习散场，我骑车跟在她后面。到了第二个红绿灯，她停下来。",0],[8617,"她没有回头。",0],[8619,"她站在那儿，站了很久。",0],[8621,"红灯变绿，绿灯变红，又变绿。",0],[8623,"她站了三轮。",0],[8625,"我躲在后面，不敢动。",0],[8627,"第三轮绿灯的时候，她走了。",0],[8629,"走了几步，她回过头，看了一眼。",0],[8631,"我赶紧低头，假装系鞋带。",0],[8633,"她站了一会儿，走了。",0],[8635,"那天晚上我回到家，躺在床上，想了一夜。",0],[8637,"我想，她是不是在等我。",0],[8639,"我又想，不可能。",0],[8641,"她那么优秀，我算什么东西。",0],[8643,"我数学考九十几分，英语一塌糊涂，我连一句完整的话都说不利索。",0],[8645,"我配不上她。",0],[8647,"这个念头，我想了三年。",0],[8649,"后来我才知道，配不配这种事，是我自己想的。",0],[8651,"她从来没想过。",0],[8653,"她只是每天早上六点四十到学校，买两瓶牛奶。她只是每天晚上七点去交考勤表。她只是站在第二个红绿灯那儿，站三轮。",0],[8655,"她只是在等我先开口。",0],[8657,"而我一直在等一个合适的时机。",0],[8659,"合适的时机一直没来。",0],[8661,"后来我想，等高考完吧。",0],[8663,"高考完，我就在第二个红绿灯那儿叫住她。",0],[8665,"想说的话我在心里背过很多遍。",0],[8667,"开头永远是“班长”两个字。",0],[8669,"后面的部分，一直没想好。",0],[8671,"我想，如果我早一点开口，会不会不一样。",0],[8673,"大概不会。",0],[8675,"因为有些事，不是开口就能改的。",0],[8677,"但我还是想。",0],[8679,"我想，如果她出来了，我第一句话该说什么。",0],[8681,"我想了很多句。",0],[8683,"最后我想，我就说：",0],[8685,"“成汐。”",0],[8687,"“你叫成汐。成功的成，潮汐的汐。”",0],[8689,"“你每天早上六点四十，在校门口的小卖部买两瓶牛奶。”",0],[8691,"“你保温杯里的水，是我给你换的。”",0],[8693,"“我换了三年。”",0],[8695,"“我以后还……”",0],[8697,"也许我没有以后了吧……",0]]},{"t":"第十四章 · 后院","k":"main","m":"clock","d":"","f":0,"p":[[8705,"五点十分，我跑到了后院。",0],[8707,"这个院子在学校北校区，门上挂着一块铁牌，写着“闲人免进”。",0],[8709,"后半夜，校长带我来过一次。就是那一次，他把这串钥匙给了我。最长的一把，开井盖。",0],[8711,"现在校长不知道去哪儿了。",0],[8713,"门锁开着。我踹了一脚。",0],[8715,"门框裂了，门开了。",0],[8717,"里面很黑。我打开手电。",0],[8719,"院子不大，杂草丛生。我在学校待了快三年，还不知道有这个院子存在。",0],[8721,"怀里的本子硌着肋骨。我把它往上托了托。",0],[8723,"那是徐老师的本子。六年，三十个名字。她交给我的时候说，烧了，就没了。不烧，它就一直吃。",0],[8725,"我说，那就先不烧。",0],[8727,"她看了我一眼。她说，肖中，井边不管发生什么，别回头。",0],[8729,"我说，好。",0],[8731,"然后我跑到这儿来了。",0],[8733,"手电的光落在院子当中。",0],[8735,"老槐树。",0],[8737,"树底下，那口井。",0],[8739,"井盖开着，翻在一边。井口压着一张纸条。",0],[8741,"我把纸条拿起来，看见一行字：",0],[8743,"“天亮之前，必须把它关回去。”",0],[8745,"那是校长留的。他写完这个，就跑了。",0],[8747,"“你在看什么？”",0],[8749,"一个声音说。",0],[8751,"我猛地转身。",0],[8753,"没有人。",0],[8755,"“我问你在看什么。”",0],[8757,"那个声音又说了一遍。",0],[8759,"它很近。",0],[8761,"近得像贴着我的耳朵。",0],[8763,"“我在找你。”我说。",0],[8765,"我说完这句话，自己都愣了一下。",0],[8767,"它没有名字，没有身体，没有行踪。",0],[8769,"“你来给我献祭？还是来封印我，就像几年前那老头儿一样？”它问。",0],[8771,"“老头儿封了我三十多年。”它说，“他用两个字压着我。他年年写，年年描。现在字磨没了，他就管不着我了。”",0],[8773,"我的手心全是汗。",0],[8775,"“我知道所有人的事。”它说，“我在这栋楼底下待了三十七年。我听见所有的事。”",0],[8777,"它停了停。",0],[8779,"“我听见有人半夜哭。我听见有人在厕所里打电话。我听见有人说，我不想活了。我听见有人一边数钱一边说，就五个，划算。”",0],[8781,"“我还听见，每天晚上七点，走廊尽头那个水房，有人给一个保温杯灌热水。”",0],[8783,"我的手一抖，手电的光圈晃了一下。",0],[8785,"“它喝的时候，不知道是你换的。”它说，“你做了三年。它一口都不知道。”",0],[8787,"“别说了。”",0],[8789,"“为什么？”它说，“这些都是真的。真话才疼。”",0],[8791,"“你到底想干什么？”",0],[8793,"“我饿。”它说。",0],[8795,"“你刚吃了十一个。”",0],[8797,"“十一个不够。”它说，“一个名字，管一年。十个名字，我才不往外挤。十一个，我才把门让开。你们校长今年没给我送，我就自己拿。”",0],[8799,"“你们喂了我六年。”它说，“凭什么今年不喂？”",0],[8801,"“今年没人欠你。”",0],[8803,"“欠。”它说，“都欠。老师欠，校长欠，那个坐在讲台边上的小姑娘，也欠。”",0],[8805,"“她不欠。”",0],[8807,"“她欠我一个名字。”它说，“她想给。想给，就是欠着。”",0],[8809,"我盯着井口。",0],[8811,"“它没有身体。”我说。",0],[8813,"“什么？”",0],[8815,"“他们说的。”我说，“你没有身体，只能附在东西上。你不能跑，不能追。你只要一个名字。”",0],[8817,"“对。”",0],[8819,"“给了名字，你就安分二十年。”",0],[8821,"“对。”",0],[8823,"“不给呢？”",0],[8825,"“那我就等。”它说，“等一个路过的。等一个低头看井的。等一个喊我名字的。”",0],[8827,"“你想要个名字。”我说，“你想要个名字，想了三十七年。”",0],[8829,"它不说话了。",0],[8831,"风声停了一秒。",0],[8833,"“你明白吗？”它问。",0],[8835,"“明白。”",0],[8837,"“你不明白。”它说，“你没有试过没有名字。你喊一声‘喂’，没有人知道你在喊谁。你在一个地方待了三十七年，没有一个人叫过你。你想回家，你不知道家在哪个方向。你只知道一个名字能带你回去，可是你把名字弄丢了。”",0],[8839,"“我想要个名字。”它说，“给我一个名字，我就回去。把盖子合上，焊死，谁都别来喊我。”",0],[8841,"“那我给你一个。”",0],[8843,"“你给不了。”它说，“你不知道。”",0],[8845,"它的声音忽然又近了，近得像贴着我的耳朵，“天一亮，门一开，我就吃完了。那个小姑娘，她不肯给名字。不肯给，我就一点一点地拆。拆到天亮，她就自己递给我了。”",0],[8847,"“你不会等到的。”我说。",0],[8849,"“为什么？”",0],[8851,"“因为有人在等她。”我说，“在外面。”",0],[8853,"它没有说话。",0],[8855,"五点十五分。",0],[8857,"我转身往外走。手电的光扫过井口，我忍住了，没有回头。",0],[8859,"别回头。徐老师说的。",0],[8861,"跑到门口的时候，它在我身后说了一句话。",0],[8863,"“喂。”",0],[8865,"我停住。",0],[8867,"“你叫什么？”",0],[8869,"“肖中。”",0],[8871,"“肖中。”它念了一遍。",0],[8873,"那两个字它念得很慢，像在嘴里嚼了嚼，咽下去了。",0],[8875,"我后脖颈一麻。",0],[8877,"然后它说：“我记住你了。”",0],[8879,"“我记性也很好。”我说。",0],[8881,"然后我跑了。",0]]},{"t":"第十五章 · 张岚","k":"main","m":"clock","d":"","f":0,"p":[[8885,"五点二十分，屏幕暗下去。",0],[8887,"教室里剩下十个人。",0],[8889,"成汐没有回座位。",0],[8891,"她走到最后一排，靠墙的位置。",0],[8893,"张岚坐在那儿，两只手放在桌面上，背挺得很直，像在等一节课开始。",0],[8895,"“张岚。”",0],[8897,"张岚抬起头。",0],[8899,"“我能坐这儿吗？”成汐指了指她旁边的空椅子。",0],[8901,"“能。”",0],[8903,"成汐坐下。",0],[8905,"她们并排坐着，面朝讲台。",0],[8907,"前面是十二张空桌子，还围成一个“口”字。",0],[8909,"“张岚。”成汐说，“我问你一件事。”",0],[8911,"“嗯。”",0],[8913,"“你是什么时候死的？”",0],[8915,"张岚没有惊讶。",0],[8917,"她只是低下头，看着自己的手。",0],[8919,"“高一。”她说，“上学期。十一月。”",0],[8921,"成汐的手指在膝盖上收紧了。",0],[8923,"“怎么死的？”",0],[8925," 泪。",0],[9537,"从口袋里摸出何雨还给她的那两页纸，抚平，放在讲台上。",0],[9539,"“何雨。”她说，“两页纸，还你了。”",0],[9541,"六点零五分。",0],[9543,"教室里的灯，灭了一盏。",0],[9545,"是第三排靠窗的那一盏。",0],[9547,"成汐没有动。",0],[9549,"它开始吃她了。",0],[9551,"一点一点地拆。",0],[9553,"先拆的是何雨。",0],[9555,"何雨的样子，从她脑子里一点一点地淡了下去。",0],[9557,"像一张被水泡过的照片。",0],[9559,"“何雨。”她说。",0],[9561,"她记得这个名字。",0],[9563,"她想不起来这个名字长什么样了。",0],[9565,"她低下头，把圆珠笔拿出来。",0],[9567,"名单有一串名字。",0],[9569,"她把“何雨”两个字补上去。",0],[9571,"它吃她的，她写她的。",0],[9573,"看谁快。",0],[9575,"六点零八分。",0],[9577,"第二盏灯灭了。",0],[9579,"这一盏灭的时候，成汐忘了一个人。",0],[9581,"她想不起来是谁。",0],[9583,"她数名单的名字。",0],[9585,"她把每个名字都描了一遍。",0],[9587,"六点十二分。",0],[9589,"第三盏灯灭了。",0],[9591,"成汐的脑子空了一下。",0],[9593,"像有人从她脑子里拿走了一本书。",0],[9595,"她扶着讲台，没有倒。",0],[9597,"“我记得。”她说。",0],[9599,"她看着黑板。",0],[9601,"黑板上，她把昨晚死去的同学的名字一个一个写下来。",0],[9603,"姜和。于韵。尹天高。郑一鸣。何雨。孙澜。赵克。李景。傅小满。杨枭。泽研。",0],[9605,"写到第五个的时候，她停了一下。",0],[9607,"何雨。",0],[9609,"她想不起来何雨是谁。",0],[9611,"她低下头，看了看名单。",0],[9613,"何雨。",0],[9615,"她把黑板上的名字描了一遍。",0],[9617,"“我记得姜和转笔老掉。”",0],[9619,"“我记得于韵怕黑。”",0],[9621,"“我记得赵克他爸给他买韭菜鸡蛋包子。”",0],[9623,"“我记得李景给他妈写了二十三封信。”",0],[9625,"“我记得孙澜她妈在服装厂。”",0],[9627,"“我记得泽研欠于韵一顿火锅。”",0],[9629,"“我记得。”",0],[9631,"“你一样都拿不走。”",0],[9633,"六点十四分。",0],[9635,"广播响了。",0],[9637,"“班长。”",0],[9639,"“早上好。”",0],[9641,"“第一节课。”",0],[9643,"“你叫什么？”",0],[9645,"成汐抬起头。",0],[9647,"“我不说。”",0],[9649,"“说了，你就可以走了。”",0],[9651,"“我不说。”",0],[9653,"过了很久，广播说：“不说？”",0],[9655,"成汐说，“我不给。”",0],[9657,"灯开始闪。",0],[9659,"不是灭。",0],[9661,"是闪。",0],[9663,"然后教室里只剩下讲台上方那一盏灯。",0],[9665,"她站在光圈里。",0],[9667,"“为什么。”广播问。",0],[9669,"成汐想了想。",0],[9671,"“因为有人在等我。”",0],[9673,"广播安静了。",0],[9675,"教室里只剩下那一盏灯。",0],[9677,"成汐站在灯下。",0],[9679,"她不知道自己叫什么。",0],[9681,"她不知道黑板上的名字是谁。",0],[9683,"她只知道一件事。",0],[9685,"有人在等她。",0],[9687,"这就够了。",0],[9689,"然后，她听见了一个声音。",0],[9691,"很远，又像是从楼里每一个角落同时响起来。",0],[9693,"是一个男生的声音。",0],[9695,"他在叫一个名字。",0],[9697,"两个字。",0],[9699,"很轻。",0],[9701,"像有人隔着一层水，叫一个人回家。",0],[9703,"那个声音落下的一瞬间，整座学校的灯，同时亮了起来。",0],[9705,"所有的灯。",0],[9707,"每一间教室，每一条走廊。",0],[9709,"灯全亮了。",0],[9711,"亮得刺眼。",0],[9713,"然后，她听见广播里，有一个很轻很轻的声音，应了一声。",0],[9715,"“到。”",0],[9717,"再然后，是那一声温和的、上了一个通宵课的：",0],[9719,"“下课。”",0]]},{"t":"插曲 · 姜和","k":"inter","m":"clock","d":"","f":1,"p":[[9723,"我叫姜和。",0],[9725,"姜是姜丝的姜，和是和尚的和。",0],[9727,"我爸给我起这个名字的时候，大概是希望我这辈子和和气气。他这个人没什么文化，起名字全靠翻字典，翻到哪个算哪个。",0],[9729,"他三年前死了。车祸。在深圳，一辆泥头车，拐弯的时候没看见他。",0],[9731,"我妈在深圳，一年回来一次。她每次回来都给我带东西，鞋，衣服，电子表。她不知道我穿多大码，买的鞋总是小一码。",0],[9733,"我穿了三年小一码的鞋。",0],[9735,"我的脚趾头现在有点变形。",0],[9737,"高二那年冬天，我爷走了。",0],[9739,"不是亲爷，是外公。我管他叫爷。他姓于，叫于敬堂。我妈姓于，我跟着我爸姓姜。",0],[9741,"走之前那阵子，他已经有点糊涂了。有时候认得我，有时候认不得。",0],[9743,"认不得我的时候多。",0],[9745,"有一天我去看他，他忽然认得我。他把我叫到床边，从枕头底下摸出一块铜牌，塞给我。",0],[9747,"“戴着。”他说。",0],[9749,"“这什么？”",0],[9751,"“别问。”",0],[9753,"“值钱吗？”",0],[9755,"“不值钱。”他说，“你别弄丢了。”",0],[9757,"“弄丢了怎么样？”",0],[9759,"他看着我，看了很久。",0],[9761,"“弄丢了，”他说，“你就别回来了。”",0],[9763,"我那时候以为他在开玩笑。",0],[9765,"我爷这个人，一辈子不怎么说话。他住在学校后头的老房子里，院子里有一口井。那口井用一块石板盖着，石板上压着一块砖。",0],[9767,"我小时候问他，井里有什么。",0],[9769,"他说，有水。",0],[9771,"我说，我想看看。",0],[9773,"他说，不许看。",0],[9775,"我问他为什么。",0],[9777,"他说，看了要还。",0],[9779,"我那时候不懂。",0],[9781,"现在懂了。",0],[9783,"高一那年冬天，我开始做梦。",0],[9785,"梦里都是水。",0],[9787,"不是河，不是海，是井。井水很黑，很静，一点波纹都没有。我站在井边往下看，看见井底有一个人。",0],[9789,"那个人抬起头，看着我。",0],[9791,"他的脸是模糊的。",0],[9793,"我每次都想看清，每次都看不清。",0],[9795,"醒来以后，我浑身是汗。",0],[9797,"我去医院看过。医生说是压力大，开了点药。",0],[9799,"后来我发现自己开始忘事。",0],[9801,"不是忘带作业那种忘。是忘人。",0],[9803,"我先忘了我爸的脸。",0],[9805,"我记得他这个人。我记得他抽烟，记得他走路的时候左肩比右肩低，记得他打我那一巴掌打在我左脸上。",0],[9807,"我不记得他长什么样。",0],[9809,"我翻相册，翻到他的照片，看很久。",0],[9811,"照片上是一个男人，四十来岁，瘦，站在一个工地前面，笑得很拘谨。",0],[9813,"我知道那是我爸。",0],[9815,"我看着他，心里什么都没有。",0],[9817,"像看一张别人的照片。",0],[9819,"再后来，我忘了我妈的声音。",0],[9821,"她打电话来，我听着，觉得那个声音很陌生。",0],[9823,"“和和，你吃饭了没有？”",0],[9825,"“吃了。”",0],[9827,"“你冷不冷？”",0],[9829,"“不冷。”",0],[9831,"“你钱够不够？”",0],[9833,"“够。”",0],[9835,"她说什么，我都答。",0],[9837,"答完我就挂了。",0],[9839,"挂了以后，我坐在床上，想她刚才说了什么。",0],[9841,"我想不起来。",0],[9843,"我开始害怕。",0],[9845,"我不知道自己在怕什么。我就是怕。我怕得睡不着，怕得半夜起来，坐在窗台上抽烟。",0],[9847,"我成绩掉得很快。",0],[9849,"从年级一百多名，掉到三百多名，掉到五百多名。",0],[9851,"徐老师找我谈过话。",0],[9853,"“姜和，你最近怎么回事？”",0],[9855,"“没事。”",0],[9857,"“你以前不是这样的。”",0],[9859,"“人都会变。”",0],[9861,"她看着我，看了很久。",0],[9863,"“你有事就跟我说。”",0],[9865,"“好。”",0],[9867,"我没说。",0],[9869,"我说了，她也不会信。",0],[9871,"后来我就不说了。",0],[9873,"我开始讲话。",0],[9875,"上课讲，下课讲，晚自习讲。我讲笑话，我接老师的话，我在楼道里唱歌，我把笔转掉，我大声骂人。",0],[9877,"我成了班里最吵的那个人。",0],[9879,"因为一个人只要够吵，别人就会看他。",0],[9881,"别人看他，他就还在。",0],[9883,"这是我琢磨出来的道理。",0],[9885,"赵克是我同桌。他是那种真不在乎的人，我是装的。我们俩坐一块儿，一天到晚胡说八道。",0],[9887,"他有时候问我：“你怎么这么贫？”",0],[9889,"我说：“我这是性格开朗。”",0],[9891,"他说：“你开朗个屁。你上课的时候不说话，眼睛是直的。”",0],[9893,"我愣了一下。",0],[9895,"“什么时候？”",0],[9897,"“就你不说话的时候。”他说，“你坐在那儿，眼睛看着前面，像在看什么。”",0],[9899,"我没接话。",0],[9901,"那天晚上，我又做梦。",0],[9903,"梦里我站在井边，井底那个人抬起头。",0],[9905,"这一次，我看清了他的脸。",0],[9907,"是我自己的脸。",0],[9909,"高三开学，我爷的那块铜牌开始发烫。",0],[9911,"不是一直烫。是有时候烫，有时候不烫。",0],[9913,"我把它贴身戴着，烫的时候，胸口那一小块皮肤会红。",0],[9915,"我跟赵克说过一次。",0],[9917,"“我这块牌子会发热。”",0],[9919,"“你那是捂的。”",0],[9921,"“不是。”",0],[9923,"“那就是假的。”他说，“地摊货，五块钱三个。”",0],[9925,"我没再说。",0],[9927,"九点五十八分，我死了。",0],[9929,"我知道我死了。因为我看见我自己坐在门口。",0],[9931,"我看见我的身体靠着门板，头歪着，眼睛睁着。",0],[9933,"我看见班里的人围过来，看见赵克蹲下去，看见他摸我的肩膀，看见他往后跌。",0],[9935,"我想说话。",0],[9937,"我说不出来。",0],[9939,"我那时候在一个很奇怪的地方。",0],[9941,"那地方没有边。你往前走，走不到头；你往后退，也退不回去。你看见的东西都是真的，可你摸不到。",0],[9943,"像隔着一层水。",0],[9945,"我在那儿待了两年。",0],[9947,"不是外面的两年。是里面的两年。",0],[9949,"里面没有时间。可它会算。它每天都在算，像一台机器。",0],[9951,"它算的时候，会念一个名字。",0],[9953,"那个名字很短，两个字。",0],[9955,"它念得很轻，像人睡着了磨牙。",0],[9957,"我一开始听不懂。",0],[9959,"后来我听懂了。",0],[9961,"我听懂以后，就再也忘不掉了。",0],[9963,"我在里面见过很多人。",0],[9965,"不是活人。",0],[9967,"是它吃剩下的。",0],[9969,"有一个男孩，穿着九十年代的校服，坐在一张椅子上，一动不动。我跟他说话，他不理我。",0],[9971,"有一个女人，很年轻，抱着一个包，一直在哭。她哭了很久，哭到最后，脸就没有了。",0],[9973,"还有几个，只剩一个轮廓。",0],[9975,"他们都在一个地方。",0],[9977,"那个地方，是一间教室。",0],[9979,"三十一张桌子，三十一把椅子。",0],[9981,"我坐在最后一张。",0],[9983,"我坐了很久。",0],[9985,"久到我把所有人的名字都想了一遍。",0],[9987,"我想起赵克，想起他借钱不还，想起他说“你开朗个屁”。",0],[9989,"我想起陈丹丹，想起她抄我数学作业，抄得一模一样，连错的地方都一样。",0],[9991,"我想起班长。",0],[9993,"班长叫成汐。",0],[9995,"她给我记过十二次检讨。她记得每一次，我记得她记得。",0],[9997,"有一次我替赵克顶罪，她问我为什么。",0],[9999,"我说他爸要知道了能打死他。",0],[10001,"她问，你爸知道了不打你？",0],[10003,"我说，我爸在深圳，他打不着。",0],[10005,"她就把名字写成了我。",0],[10007,"那天她低头写字的时候，我看见她的笔尖顿了一下。",0],[10009,"她在犹豫。",0],[10011,"她犹豫了两秒，还是写了。",0],[10013,"我当时想，这个班长，还行。",0],[10015,"后来我在里面，每天晚上都想这些事。",0],[10017,"我想一遍，那些人就清楚一点。",0],[10019,"可我越清楚，我就越薄。",0],[10021,"像一张纸，你反复地在上面写字，写到最后，纸就破了。",0]]},{"t":"附录 · 于敬堂手记（节选）","k":"inter","m":"date","d":"","f":0,"p":[[10025,"（此手记为肖中自后院槐树底下铁盒中取出，读毕埋回。）",0],[10027,"一九八五年，三月。",0],[10029,"县里要在村东盖中学。推土机推到老槐树底下，推不动。司机下来看，说是树根。",0],[10031,"挖开，是井。",0],[10033,"井口压着铜匣。匣上刻字，字不可识。工头说填了。我说不能填。",0],[10035,"他们问我为什么。",0],[10037,"我说，这底下有东西。",0],[10039,"他们笑。",0],[10041,"一九八五年，四月。",0],[10043,"我翻了族谱。族谱上记着一件事：光绪二十三年，村里有个孩子掉进这口井，没捞上来。",0],[10045,"那孩子姓于，乳名拴住。",0],[10047,"他娘在井边叫了三年。每天傍晚叫一遍。叫到第三年，嗓子坏了，叫不出声了。",0],[10049,"后来他娘也死了。",0],[10051,"再后来，就没人叫了。",0],[10053,"一九八五年，五月。",0],[10055,"匣子上的字，我认出来了。",0],[10057,"两个字。",0],[10059,"我把字描了一遍。",0],[10061,"描完，井底下的声音停了。",0],[10063,"一九八六年，冬至。",0],[10065,"第一次守夜。",0],[10067,"丑时，井里有动静。不是水声。像有人在井壁上走。",0],[10069,"我坐在树底下，没回头。",0],[10071,"天亮，声音停了。",0],[10073,"一九八九年。",0],[10075,"匣子裂了第一道缝。我用铜焊补上。",0],[10077,"补的时候，手抖。",0],[10079,"一九九七年。",0],[10081,"学校扩建。新楼盖起来了。",0],[10083,"我去找校长。校长姓崔，年轻，戴眼镜。",0],[10085,"我把事情说了。他听完，问我：有证据吗？",0],[10087,"我说，没有。",0],[10089,"他说，那我不能停。",0],[10091,"二〇〇〇年。",0],[10093,"匣子裂了第二道缝。补不上了。",0],[10095,"我开始每年描字。描一次，能压一年。",0],[10097,"二〇〇五年。",0],[10099,"我老伴走了。",0],[10101,"走的那天，我在井边。等我回去，她已经凉了。",0],[10103,"我没见上最后一面。",0],[10105,"二〇〇六年。",0],[10107,"我发现我记不起她的脸。",0],[10109,"我记得她这个人。我记得她做饭放多少盐，记得她睡觉打呼，记得她左手的小指是弯的。",0],[10111,"我不记得她长什么样。",0],[10113,"我知道是被吃了。",0],[10115,"它吃了我一口。",0],[10117,"我不怪它。我守了它二十年，它饿。",0],[10119,"二〇一〇年。",0],[10121,"我描不动字了。手抖得厉害。",0],[10123,"我把匣子重新焊了一遍。焊得很丑。",0],[10125,"二〇一四年。",0],[10127,"学校换了个校长。还是姓崔。",0],[10129,"那年冬天，学校的成绩忽然好了。",0],[10131,"我听见了。",0],[10133,"不是听见成绩。是听见井。",0],[10135,"井底下有声音。不是它走的声音。是它吃东西的声音。",0],[10137,"它在吃。",0],[10139,"吃得很饱。",0],[10141,"我去找崔校长。",0],[10143,"他给我倒了杯茶。",0],[10145,"他说，于老先生，您守了三十年，够了。",0],[10147,"他说，这三千个孩子，比五个孩子重要。",0],[10149,"我问他，那五个孩子呢？",0],[10151,"他说，他们还活着。",0],[10153,"我坐在他办公室里，坐了很久。",0],[10155,"我想起我老伴。",0],[10157,"我想起她做的最后一顿饭。",0],[10159,"我想起来了。是面条。她卧了两个鸡蛋。",0],[10161,"我想起来的时候，眼泪掉下来。",0],[10163,"崔校长递给我一张纸巾。",0],[10165,"他说，于老先生，您年纪大了。",0],[10167,"二〇一五年。",0],[10169,"我不去学校了。",0],[10171,"我每年冬至还是去。我不描字了，我就坐在树底下。",0],[10173,"坐一夜。",0],[10175,"二〇一八年。",0],[10177,"我外孙来了。",0],[10179,"他叫姜和。他爸死了，他妈在深圳。",0],[10181,"他在我这儿住了半个月。",0],[10183,"他问我，爷，院子里那口井，为什么不打开？",0],[10185,"我说，看了要还。",0],[10187,"他说，还什么？",0],[10189,"我说，还你记得的东西。",0],[10191,"他不懂。他跑去打球了。",0],[10193,"二〇一九年。",0],[10195,"我教韵韵录音。",0],[10197,"她问我，外公，你为什么让我录？",0],[10199,"我说，因为我快忘了。",0],[10201,"她说，你不会忘的。",0],[10203,"我说，我会。",0],[10205,"二〇二〇年，冬天。",0],[10207,"我把铜牌给了姜和。",0],[10209,"我知道我做错了。",0],[10211,"我应该给韵韵。她懂事，她记得住，她不会弄丢。",0],[10213,"可是她太懂事了。她要是知道了，她会去。",0],[10215,"她去了，就回不来。",0],[10217,"姜和不一样。他不懂。他不懂，就不会去。",0],[10219,"他不懂，就能活。",0],[10221,"我这一辈子，就自私了这一回。",0],[10223,"二〇二〇年，十一月。",0],[10225,"我梦见我老伴。",0],[10227,"她站在井边，背对着我。",0],[10229,"我叫她。",0],[10231,"她回过头。",0],[10233,"我看不清她的脸。",0],[10235,"我醒了。",0],[10237,"我坐在床上，想了很久。",0],[10239,"我想起她的名字。",0],[10241,"我想起来了。",0],[10243,"我想起来了。",0],[10245,"二〇二〇年，十二月。",0],[10247,"我忘了。",0],[10249,"我又忘了。",0],[10251,"我把它写在纸上。写了十遍。",0],[10253,"写完，我看那张纸。",0],[10255,"纸上的字，我一个都不认得。",0],[10257,"二〇二〇年，十二月，最后一天。",0],[10259,"韵韵来看我。",0],[10261,"她给我念她写的作文。",0],[10263,"她念到一半，我睡着了。",0],[10265,"我梦见那口井。",0],[10267,"井底下那个孩子，抬起头，看着我。",0],[10269,"他问我，你叫什么？",0],[10271,"我说，我叫于敬堂。",0],[10273,"他说，不是这个。",0],[10275,"我说，我就叫这个。",0],[10277,"他笑了。",0],[10279,"他说，你也不知道自己叫什么了。",0],[10281,"我醒了。",0],[10283,"韵韵坐在床边，握着我的手。",0],[10285,"她叫我，外公。",0],[10287,"我看着她。",0],[10289,"我知道她是谁。",0],[10291,"我说，韵韵，你别学爷爷。",0],[10293,"爷爷这辈子，就干了一件事。",0],[10295,"守着一口井。",0],[10297,"守到最后，连自己守的是什么都忘了。",0],[10299,"二〇二一年，一月。",0],[10301,"我记不清日子了。",0],[10303,"我知道快了。",0],[10305,"我把该说的都说了，该给的都给了。",0],[10307,"我只剩一件事没做。",0],[10309,"我要把这本子留给一个人。",0],[10311,"不是韵韵。她太会问。",0],[10313,"给一个不会问的人。",0],[10315,"给一个拿到东西，往兜里一揣，就完了的人。",0],[10317,"那样，这本子就没人看。",0],[10319,"没人看，就没人信。",0],[10321,"没人信，就没人去。",0],[10323,"没人去，就都活着。",0],[10325,"——于敬堂",0],[10327,"（手记到此为止。以下为空白页。）",0]]},{"t":"第十七章 · 井","k":"main","m":"clock","d":"","f":0,"p":[[10331,"六点整，门开了。",0],[10333,"九个人从里面走出来。",0],[10335,"他们走得很慢，一个接一个，像刚从一场大病里醒过来。有人扶着墙，有人低着头，有人走到走廊中间就蹲下去，抱着膝盖不动了。",0],[10337,"我站在走廊另一头，数。",0],[10339,"一，二，三……",0],[10341,"九。",0],[10343,"我又数了一遍。",0],[10345,"九。",0],[10347,"“还有人吗？”我问，“里面还有人吗？”",0],[10349,"没有人回答。",0],[10351,"“成汐呢？”",0],[10353,"我抓住离我最近的那个男生。是王策。",0],[10355,"“她没出来。”王策说。",0],[10357,"“她说，她留在门里。她说，井边的活儿，归你。”",0],[10359,"我的手在抖。",0],[10361,"“她把自己留下了？”",0],[10363,"“它不让她走。”王策说，“她没走。”",0],[10365,"我冲到门口。",0],[10367,"门在我面前合上了。",0],[10369,"不是慢慢合，是一下子合到底。我扑上去，手掌拍在门板上，拍到第三下，门里传来一声很轻的响，像锁舌落回原位。",0],[10371,"“成汐！”",0],[10373,"门里没有声音。",0],[10375,"走廊里有人在哭。",0],[10377,"我回头。",0],[10379,"陈丹丹蹲在地上，两只手捂着脸，哭得整个人都在抖。",0],[10381,"“你怎么了？”我走过去。",0],[10383,"“我不知道。”她说。",0],[10385,"她抬起头，满脸是泪。",0],[10387,"“我不知道我为什么哭。”",0],[10389,"“丹丹。”我说，“你认识成汐吗？”",0],[10391,"她愣了一下。",0],[10393,"“成汐？”",0],[10395,"“我们班班长。”",0],[10397,"她皱起眉，像在找一个放在手边却怎么也摸不到的东西。",0],[10399,"“我……我知道有这么个人。”她说，“我记得她每天早上给我带牛奶。我记不起来她长什么样。”",0],[10401,"我的手在抖。",0],[10403,"“你在这儿等着。”我说。",0],[10405,"“你去哪儿？”",0],[10407,"“后院。”王策说，“他得去后院。班长说了，井边的活儿归他。”",0],[10409,"我往楼下跑。",0],[10411,"跑到三楼拐角的时候，我停住了。",0],[10413,"走廊的另一头，靠墙立着一个柜子。",0],[10415,"一人多高，铁皮的，灰绿色，漆掉了一半。",0],[10417,"我在这栋楼上待了三年。这条走廊我每天走四趟。我知道每一面墙上有什么：消防栓，宣传栏，掉了角的“静”字，还有一块永远修不好的瓷砖。",0],[10419,"这里没有柜子。",0],[10421,"我走过去。",0],[10423,"柜子的门是虚掩的，缝里透出一股锈味。我伸手拉开。",0],[10425,"里面挂着一排东西。",0],[10427,"铜的，很小，一个个用细麻绳串着，挂在横杆上，像屠户挂着的肉。",0],[10429,"横杆分了好几层。最上面那层的麻绳已经发黑发脆，挂着七八个；往下，一层比一层新。",0],[10431,"每一个都是校徽的式样，老式的，边缘有一圈麦穗。",0],[10433,"每一个校徽的背面，都刻着一个名字，还有一行小字，是年份。",0],[10435,"最上面那层是一九九几年的名字。",0],[10437,"往下一层，二零零几年。",0],[10439,"再往下，二零一几年。这一层的名字多了起来。",0],[10441,"最下面一层，是今年。",0],[10443,"我从上到下数了一遍。",0],[10445,"上面的，一共十九个。",0],[10447,"最下面这一层，十二个。",0],[10449,"加起来，三十一个钩子。",0],[10451,"三十一个钩子上，都挂着东西。",0],[10453,"包括最下面那一层，最后那一个。",0],[10455,"我把它翻过来。",0],[10457,"背面刻着两个字。",0],[10459,"肖中。",0],[10461,"那个“中”字，口只刻了一半。竖是刻完了的，横折刚起了一个头。",0],[10463,"像刻到一半，被人打断了。",0],[10465,"我站在那儿，手心里全是汗。",0],[10467,"那不是钩子。",0],[10469,"那是座位。",0],[10471,"有人早就把我们的座位排好了。",0],[10473,"我的那一个，是新挂上去的。麻绳还是白的。",0],[10475,"它已经开始吃我了。",0],[10477,"就差一点。",0],[10479,"就在这时，我裤兜里那块铜牌，烫了一下。",0],[10481,"不是错觉。是真的烫，隔着裤子都能感觉到。",0],[10483,"我把它掏出来。",0],[10485,"铜牌在我手心里发红，像刚从火里夹出来。",0],[10487,"然后我听见一个声音。",0],[10489,"很近，就在我耳朵边上，像有人贴着我的耳廓在说话。",0],[10491,"是个女生的声音。很轻，很稳。",0],[10493,"“喂。”",0],[10495,"我僵住了。",0],[10497,"“喂，能听见吗。”",0],[10499,"“能。”我说，“你是谁？”",0],[10501,"那个声音沉默了一秒。",0],[10503,"“我是于韵。”",0],[10505,"我愣住了。",0],[10507,"“于韵？你不——”",0],[10509,"“我死了。”她说，“别问了，没时间。它现在正在教室里吃成汐。它吃得很慢，成汐在反抗。”",0],[10511,"“它在门里，你在门外。你进不去。”",0],[10513,"“你得把它从门里引出来。”",0],[10515,"“怎么引？”",0],[10517,"“喊它的名字。”于韵说，“它以前有名字。老于头把名字刻在匣子上，年年描，描了三十年。后来没人描了，字磨平了，它自己忘了。”",0],[10519,"“它忘了名字，就回不去。回不去，就只能在门里吃人。”",0],[10521,"“你只要喊它以前的名字，它就会应。它一应，就被放逐了。”",0],[10523,"“它叫什么？”",0],[10525,"“拴住。”于韵说。",0],[10527,"我愣了一下。",0],[10529,"“光绪二十三年，掉进井里的那个孩子。”她说，“姓于，乳名拴住。老于头的手记里写着。我小时候在外公的刻字边上，听录音机里的声音念过一万遍。”",0],[10531,"“我录了两段音。手机在你们班长那儿。要是能出去，让我妈留着，别删。”",0],[10533,"“姜和。”她忽然叫了一声。",0],[10535,"“在。”另一个声音响起来。",0],[10537,"是姜和。有点哑，尾音往上挑。",0],[10539,"“我拖住它。”姜和说，“我在它牙缝里卡了两年，它动不了我。它在往回缩，我拽着它。”",0],[10541,"“肖中，快跑。后院，槐树底下。”",0],[10543,"“匣子用你手里那块牌子开。转两圈。”",0],[10545,"“开了就喊。”",0],[10547,"“喊完，我们就不在了。”他说，“你记着我们就行。”",0],[10549,"我握着铜牌，说不出话。",0],[10551,"“跑啊！”姜和喊。",0],[10553,"我转身就往楼下跑。",0],[10555,"后院那扇门还歪着。",0],[10557,"锁扣是坏的。凌晨我踹的那一脚，把门框踹裂了，锁早就挂不住了。我侧身挤进去。",0],[10559,"槐树底下，那口井还在。",0],[10561,"可是井口变了个样。",0],[10563,"铜盖合着，上面覆了一层新土，平平的，像有人趁我不在，又把它埋了回去。",0],[10565,"我跪下去，用手扒。",0],[10567,"扒了十几公分，手指碰到铜。",0],[10569,"我把铜盖上的土扫开。",0],[10571,"盖子的边缘有一个锁孔，我把那串钥匙里最长的一把插进去，转了两圈。",0],[10573,"锁开了。",0],[10575,"我把铜盖掀开，翻到一边，砸在土上。",0],[10577,"底下是一个铜匣子的顶。",0],[10579,"匣子比我想的小，差不多一个鞋盒那么大，四边铸着云纹，锈得发绿。匣子正中开了一道槽，槽的形状，跟校徽一模一样。",0],[10581,"我把铜牌按进槽里。",0],[10583,"严丝合缝。",0],[10585,"像本来就是一块东西，被劈成了两半。",0],[10587,"“转。”于韵说。",0],[10589,"我握住铜牌，往里按了一下，转。",0],[10591,"第一圈很涩，铜与铜摩擦，发出一种很尖的响声。",0],[10593,"转到底的时候，匣子里传来一声闷响。",0],[10595,"像有什么东西，在很深的地方，翻了个身。",0],[10597,"“它想缩回去！”姜和的声音，“我拽着它！快！第二圈！”",0],[10599,"我吸了一口气，转第二圈。",0],[10601,"第二圈很轻。",0],[10603,"轻得像钥匙插进一把已经开了的锁。",0],[10605,"转到底的瞬间，匣子的盖子自己弹开了一条缝。",0],[10607,"一股凉气从里面涌出来，扑在我脸上，凉得像冰水。",0],[10609,"“喊！”于韵说。",0],[10611,"我跪在井边，张开嘴。",0],[10613,"那个名字从我喉咙里出来的时候，我自己都愣了一下。",0],[10615,"它太普通了。",0],[10617,"普通得像你在街上随便叫一声，会有三个人回头。",0],[10619,"“拴住——”",0],[10621,"我喊出来的一瞬间，手上的匣子仿佛失去了重量。",0],[10623,"三楼最东头那间教室，灯也亮了。",0],[10625,"然后所有的广播喇叭同时响了一声。",0],[10627,"不是电流声。是一种很低的、从地底下传上来的震动，震得铜盖在土里跳。",0],[10629,"接着，所有的喇叭同时开始说话。",0],[10631,"用我的声音。",0],[10633,"把那个名字，念了一遍。",0],[10635,"井底下有东西在动。",0],[10637,"不是翻身，是往上。白气从匣口冒出来，一股一股，带着一种很淡的、说不清的味道——像旧书，像潮了的墙，像很久没人住的房子。",0],[10639,"然后，整座学校里所有的喇叭，同时安静下来。",0],[10641,"安静了大概三秒。",0],[10643,"三秒之后，喇叭里传出一个声音。",0],[10645,"很轻。",0],[10647,"很轻，很平，像一个小孩子在课堂上被叫到名字，站起来，应了一声。",0],[10649,"“到。”",0],[10651,"我跪在井边，眼泪一下子掉下来。",0],[10653,"然后，所有的喇叭又响了一次。",0],[10655,"很轻。",0],[10657,"轻得像一个老师在放学前，随口说的一句话。",0],[10659,"“下课。”",0],[10661,"三个字。",0],[10663,"“成了。”姜和说。",0],[10665,"他的声音已经很远了。",0],[10667,"“姜和。”",0],[10669,"“哎。”",0],[10671,"“你还在吗？”",0],[10673,"“在。”他说，“快没了。”",0],[10675,"“我……”我说，“我怎么谢你。”",0],[10677,"“谢个屁。”他笑了一下，“你记着我就行。”",0],[10679,"“告诉陈丹丹，她数学作业老抄我的。我早就知道了。”",0],[10681,"“你以后对班长好点儿。她这个人，什么都自己扛。”",0],[10683,"然后他就不说话了。",0],[10685,"“于韵。”",0],[10687,"“在。”她的声音比姜和的更淡，“最后一句。”",0],[10689,"“你说。”",0],[10691,"“那顿火锅，”她说，“我请不了了。”",0],[10693,"“帮我跟泽研说声对不起。”",0],[10695,"然后她也不说话了。",0],[10697,"我跪在井边，手里攥着那块铜牌。",0],[10699,"铜牌一点点凉下去。",0],[10701,"匣子里的白气散尽了。",0],[10703,"我低下头。",0],[10705,"匣子里什么都没有了。",0],[10707,"只有一层薄薄的白灰。",0],[10709,"我伸手进去，摸了摸。",0],[10711,"灰是温的。",0],[10713,"我再一眨眼，铜匣子不见了。",0],[10715,"井里空空的，黑黑的，只剩下暗河的水声。",0],[10717,"它走了。",0],[10719,"连匣子一起。",0],[10721,"我跪在那儿，跪了很久。",0],[10723,"天已经大亮。",0],[10725,"槐树的影子里，有鸟在叫。",0]]},{"t":"第十八章 · 找来","k":"main","m":"clock","d":"","f":0,"p":[[10729,"从后院到教学楼，我跑得很快。楼梯，走廊，三楼，七班的门。",0],[10731,"门开着。",0],[10733,"教室里很亮。晨光从窗户照进来，落在地板上。",0],[10735,"三十一张桌子，整整齐齐。",0],[10737,"后门上方的挂钟停了。停在六点整。",0],[10739,"她坐在第三排，她自己的位置上。",0],[10741,"背挺得很直，两只手放在桌面上，眼睛睁着，看着前面。",0],[10743,"“成汐。”",0],[10745,"她没有反应。",0],[10747,"我走过去，在她面前蹲下来。",0],[10749,"她的眼睛是睁着的，可她看我的样子，像看一个陌生人。",0],[10751,"“成汐。”",0],[10753,"“你是谁？”她问。",0],[10755,"我的喉咙紧了一下。",0],[10757,"“我是肖中。”",0],[10759,"“肖中。”她重复了一遍，像在念一个不认识的词。",0],[10761,"“我是……谁？”她眼神暗淡，像是失去了什么。",0],[10763,"“你叫成汐。”我说，“成功的成，潮汐的汐。”",0],[10765,"她的眼睛动了一下。",0],[10767,"“你每天早上六点四十，在校门口的小卖部买两瓶牛奶。一瓶原味，草莓是给我的。”门口传来丹丹的声音，成汐循声望去。丹丹在门口喘着气，眼睛通红。",0],[10769,"她的嘴唇动了一下。",0],[10771,"“班长，你是我们的班长，是你救了我们大家！”王策也挤上来，冲到讲台旁边，伸手摸索什么东西。",0],[10773,"“你看，这是我们写的！”王策拿出一本写满字迹的笔记本。",0],[10775,"“班长！”“班长！”……",0],[10777,"她看着我。“我是成汐？你们说的，我记不起来了呢……”她的语异常温柔。",0],[10779,"我说：“那一道大题，答案是负二。我算成二，你给我讲了三遍。”我绞尽脑汁拼凑着我和成汐共同的回忆。",0],[10781,"她的眼睛里有什么东西慢慢地聚起来。",0],[10783,"“负二。”她说。",0],[10785,"“对。”我说，“负二。”",0],[10787,"她低下头，看着自己的手。",0],[10789,"然后她抬起手，摸了摸自己的脸。",0],[10791,"“我脸上……”她说，“有水。”",0],[10793,"“你在哭。”",0],[10795,"“我为什么哭？”",0],[10797,"“因为你回来了。”我说。",0],[10799,"她看着我，看了很久很久。",0],[10801,"然后她伸出手，抓住我的袖子。",0],[10803,"抓得很紧。",0],[10805,"“肖中。”她说。",0],[10807,"“嗯。”",0],[10809,"“我记不起了。”",0],[10811,"我坐在她旁边，把她的手握住。",0],[10813,"“没关系。”我说，“我陪你慢慢想。”",0],[10815,"她点点头。",0],[10817,"然后她松开手，看着我。",0],[10819,"“保温杯……”",0],[10821,"我愣了一下。",0],[10823,"“保温杯的水。”她眼睛忽然闪过光亮，“还有牛奶，丹丹的牛奶！”",0],[10825,"“我好像有印象……”她喃喃道，“水总是温的……”",0],[10827,"我笑着回答：“对呀，总是温的。”",0],[10829,"“肖中。”她念了一遍。",0],[10831,"她看着我，眼睛里多了几分色彩。",0],[10833,"虽然她忘记了我们所有人，但她记住了与我们有关的**事物**。",0],[10835,"她记住了“负二”，记住了“保温杯”，记住了“牛奶”……",0],[10837,"<br>",0],[10839,"八点十分，徐老师把我和成汐分别送回家。",0],[10841,"第三天，校长室。",0],[10843,"崔校长坐在办公桌后面。",0],[10845,"“事情已经处理好了。”他说，“保密协议。每人二十万。死了的，按意外处理，每人四十万。”",0],[10847,"“四十万……”我说，“二十条命。”",0],[10849,"“你今年十七。”他说，“我五十八。我告诉你一件事。这件事，你说了，没有用。没有人信。”",0],[10851,"<br>",0],[10853,"高考后，我去了柳镇。",0],[10855,"姜和的老家。",0],[10857,"灵堂搭在他家院子里。照片是从学籍系统里调出来的，一寸的证件照，放大了，有点糊。",0],[10859,"他妈妈坐在一张小板凳上。",0],[10861,"“他在学校怎么样？”她问。",0],[10863,"“他挺好的。”我说，“他上次月考，进步了十二名。”",0],[10865,"她的眼泪掉下来。",0],[10867,"“我买的鞋，小了一码。”她说，“我一直不知道。他穿了三年。”",0],[10869,"棺材在外面。",0],[10871,"里面没有东西。",0],[10873,"我从兜里掏出那块铜牌。背面是空的。",0],[10875,"我把它放进去。",0],[10877,"“你拿着。”我说。",0],[10879,"“我记着你。”",0],[10881,"从柳镇回来，我去了一趟于韵家。",0],[10883,"开门的是泽研的妈妈。两家人这些天凑在一起。",0],[10885,"“你看见泽研了吗？”她问。",0],[10887,"“看见了。”我说。",0],[10889,"“她在哪儿？”",0],[10891,"“她跟于韵在一起。”",0],[10893,"她站在门口，看着我。",0],[10895,"她的脸上慢慢出现了一种表情。",0],[10897,"不是悲伤。",0],[10899,"是明白。",0],[10901,"“我知道了。”她说。",0],[10903,"那天晚上，我在手机里打了一行字。",0],[10905,"“姜和。柳镇人。父亲三年前去世。母亲在深圳。会转笔。借过赵克二十块钱。笑起来眼睛会眯成一条缝。他最后说：你记着我就行。”",0],[10907,"“于韵。语文课代表。字写得好。作文《故乡》满分。怕黑。她录了两段音。她说：火锅她请不了了。”",0],[10909,"我怕我忘。",0],[10911,"所以我写下来。",0],[10913,"写下来，就有人记得。",0],[10915,"有人记得，他们就不算真死。",0],[10917,"之后，我约了成汐出来。",0],[10919,"她已经想起了大部分事情。但是唯独没有找回对过去的事情的感受。",0],[10921,"当时，她坐在窗边画画。",0],[10923,"画的是一个教室。一排一排的桌子。",0],[10925,"“画了几张了？”",0],[10927,"“不知道。”她说，“画不对的就撕。”",0],[10929,"“哪里不对？”",0],[10930,"就是不对。”她说，“我不知道。”",0],[10932,"我坐在她旁边。",0],[10934,"“我教你一个办法。”我说，“你画一张空桌子，写一个名字。写完了，再画下一张。”",0],[10936,"“我只记得七个。”她说。",0],[10938,"“我记得三十一个。”",0],[10940,"她愣住了。",0],[10942,"“你记得？”",0],[10944,"“我记得。”我说，“因为我每天都在想。我怕我忘了。”",0],[10946,"她看着我。",0],[10948,"“那你写。”",0],[10950,"我拿起笔。",0],[10952,"我在她的画上，找到第一张桌子。",0],[10954,"“这一张，是姜和的。”",0],[10956,"“姜和。”她跟着念。",0],[10958,"“他坐在最后一排靠门的位置。他会转笔。他转得很快，但是老掉。”",0],[10960,"“他为什么老掉？”",0],[10962,"“因为他想让人看他。”",0],[10964,"“为什么？”",0],[10966,"“因为他怕没人记得他。”",0],[10968,"她低下头，在那张桌子上，描了一遍“姜和”。",0],[10970,"描得很重。",0],[10972,"“下一张。”她说。",0],[10974,"“这一张，是于韵的。语文课代表。字写得好。她怕黑。”",0],[10976,"“她为什么怕黑？”",0],[10978,"“因为她小时候掉进过井里。”",0],[10980,"我们画了一下午。",0],[10982,"画到天黑。",0],[10984,"她画一张，我写一个名字。写到一个，她就问一句。",0],[10986,"“我为什么知道这些？”",0],[10988,"“因为你想起来了。”",0],[10990,"“不对。”她说，“是你告诉我的。我记着这些字。可是我心里……”",0],[10992,"她抬起头。",0],[10994,"“我心里什么都没有。”",0],[10996,"屋子里很安静。",0],[10998,"“肖中。”她说，“我记得喝温水。我记得牛奶。我记得负二。我全记得。可是我记不得我当时是怎么想的。我记不得我喜欢过谁，我记不得我难过的时候是什么样。”",0],[11000,"“我像一个背了别人一肚子事的人。”她说，“那些事情是我的，又不是我的。”",0],[11002,"我看着她。",0],[11004,"“没关系。”我说。",0],[11006,"“怎么没关系？”",0],[11008,"“想不起来，就重来。”我说，“你记得牛奶，我们就从牛奶开始。你明天早上六点四十，到校门口的小卖部，买两瓶牛奶。一瓶原味，一瓶草莓。草莓的给丹丹。”",0],[11010,"“嗯，丹丹……”",0],[11012,"“你最好的朋友。她胃不好。”",0],[11014,"“她为什么是我最好的朋友？”",0],[11016,"“因为你每天把牛奶焐在怀里，焐热了才给她。”",0],[11018,"她看着我。",0],[11020,"“肖中。”",0],[11022,"“嗯。”",0],[11024,"“为什么水总是温的？”",0],[11026,"“……因为……是我帮你换水……”",0],[11028,"“换了三年。”",0],[11030,"“对。”",0],[11032,"“放学路上你总是跟着我吧？”",0],[11034,"“你知道？”我心中一惊。",0],[11036,"“你是不是喜欢我？”",0],[11038,"我愣了一下。",0],[11040,"这个问题，我在心里练过三年。",0],[11042,"练了很多遍。开头永远是“班长”两个字。",0],[11044,"现在她坐在我对面，看着我，等我说。",0],[11046,"“对……”我低下头，“我喜欢你……从高一到现在。”",0],[11048,"“我到第二个红绿灯那儿站过三轮。我每次都想开口。我每次都没开。”",0],[11050,"她看着我。",0],[11052,"她哭了。",0],[11054,"眼泪掉下来，她自己都不知道。",0],[11056,"“我为什么哭？”",0],[11058,"“我不知道。”我说，“也许你潜意识并没有忘记，只是现在在很深的底下。”",0],[11060,"“还上得来吗？”",0],[11062,"“上得来。”我说，“它吃过的东西，也许会慢慢长回来。感情也是。”",0],[11064,"“要是上不来呢？”",0],[11066,"“那我就每天跟你说一遍。”我说，“说到上来为止。”",0],[11068,"她脸红了，低下头，把那张画挡在面前。",0],[11070,"三十一张桌子。",0],[11072,"每一张桌子上，都有一个名字。",0],[11074,"“肖中。”她说。",0],[11076,"“嗯。”",0],[11078,"“我记不起来我喜欢你。”",0],[11080,"我的心沉了一下。",0],[11082,"“但是，”她说，“我知道你给我换了三年水。”",0],[11084,"“我记得红绿灯路口处，你总是在我后面……”",0],[11086,"“我看见你坐在我面前，一遍一遍告诉我我是谁。”",0],[11088,"“这些事我都记着。”她说，“这些……也算数吧？”",0],[11090,"“算数。”",0],[11092,"“那我们重来。”她说，“你不骗我，我就信你。”",0],[11094,"“我不骗你。”",0],[11096,"“我也不骗你。”她说，“我现在记不起来。也许明天，也许明年，也许一辈子都记不起来。我先告诉你，免得你以后怨我。”",0],[11098,"“我不怨你。”",0],[11100,"“你怎么知道？”",0],[11102,"“因为我知道你。”我说，“你这个人，从来不骗人。你忘了的事，你会说忘了。你不会装作记得。”",0],[11104,"她看着我。",0],[11106,"看了很久。",0],[11108,"“你这个人，”她说，“真傻。”",0],[11110,"“我知道。”",0],[11112,"“我喜欢傻的。”她说。",0],[11114,"她说这句话的时候，没有笑。",0],[11116,"她只是在陈述一件事。",0],[11118,"可是我知道，这是她回来之后，属于自己的第一句话。",0],[11120,"窗外天黑了。",0],[11122,"楼下有人放烟花。",0],[11124,"砰的一声，照亮了半条街。",0],[11126,"她转过头，看着窗外。",0],[11128,"“肖中。”",0],[11130,"“嗯。”",0],[11132,"她把那张画小心地卷起来。",0],[11134,"“你再说一遍。”她说，“我是谁。”",0],[11136,"“你叫成汐。”我说，“成功的成，潮汐的汐。”",0]]},{"t":"丹丹","k":"other","m":"none","d":"","f":0,"p":[[11144,"那张照片是高二下学期拍的，在操场边上那排香樟树前面。",0],[11146,"摄影师喊了三遍“看这里”，才把所有人的目光聚拢。快门按下去的时候，前排有个男生打了个哈欠，后排有两个女生在互相推搡。",0],[11148,"照片洗出来，一共三十一张。",0],[11150,"七班搬空那天，肖中从成汐的桌洞里把它收了起来，夹进自己书里。后来丹丹搬家，他把它递给她，说：“放你这儿。”",0],[11152,"三年后，陈丹丹整理旧物，把它从一本练习册里抖了出来。",0],[11154,"照片上的位置排得整整齐齐，四排，每一排都挨得紧紧的，没有空位，没有缝隙。",0],[11156,"但大多数她都叫不上名字，像有人在她脑子里放了一块橡皮，每次她的目光要落到那张脸上，橡皮就擦一下。她看得见，她不认识。",0],[11158,"丹丹把照片放下，去洗了把脸。",0],[11160,"她坐在椅子上，看着那张照片，看了很久，然后把照片翻过来，扣在桌上，怅然若失。",0],[11162,"抽屉里有一封信。",0],[11164,"信是一个男生写的，字很丑。信里只有一句话：",0],[11166,"“妈，我这次月考进步了十二名。你别哭。”",0],[11168,"信是肖中给她的。那天早上他从口袋里掏出来，说“这个，你替我送一下”，然后就走了。后来她才知道，那是李景写给他妈的信。信从李景桌洞最上面那本练习册里取出来的时候，一共有二十三封。肖中把二十二封交给了周秀兰，留下这一封，托给了她。",0],[11170,"收信的人住在邻县，是她同班同学的妈妈。可她怎么也想不起来那个同学长什么样。",0],[11172,"她把信寄了出去。",0],[11174,"第二年冬天，她在一个菜市场门口碰见过一个女人。女人瘦得厉害，拎着一袋土豆，站在摊位前面发呆。丹丹看了她很久，没敢上去。",0],[11176,"她不知道自己该说什么。",0],[11178,"她甚至不知道，那是不是李景的妈妈。",0],[11180,"高考后，肖中每天都去成汐家。有时候她开门，认得他。",0],[11182,"“肖中。”",0],[11184,"“嗯。”",0],[11186,"有时不认识。",0],[11188,"“你是谁？”",0],[11190,"“我叫肖中。”",0],[11192,"“肖中。”她念了一遍，“我记住了。”",0],[11194,"第二天她又忘了。",0],[11196,"肖中后来说，那段时间，他大概自我介绍了一千多次。",0],[11198,"“你不烦吗？”丹丹问他。",0],[11200,"“不烦。”他说。",0],[11202,"“为什么？”",0],[11204,"“因为她每次说‘我记住了’的时候，”肖中说，“都是真心的。”",0]]},{"t":"徐老师","k":"other","m":"none","d":"","f":0,"p":[[11208,"那一年，徐老师辞职了。",0],[11210,"她没有跟任何人告别。她交了一份辞职报告，收拾了东西，走了。",0],[11212,"几年后，她几番打听，到了成汐所在的城市。",0],[11214,"她站在门口，没有进去。",0],[11216,"她把一个本子放在门口，压在一块砖下面。",0],[11218,"本子是硬壳的，深蓝色，边角磨圆了。",0],[11220,"成汐后来发现了它，拿进屋。",0],[11222,"翻开。",0],[11224,"第一页上是别人的字，钢笔，很小，很整齐。",0],[11226,"三十一个名字。",0],[11228,"不是名单上那种名字。是座位表那种。第一排，第二排，第三排，一行一行，排得整整齐齐。",0],[11230,"每个名字后面，都有一行小字。",0],[11232,"“姜和。父亡。母在深圳。爱转笔。对不起。”",0],[11234,"“于韵。语文课代表。作文写得好。对不起。”",0],[11236,"“何雨。英语第一。心重。对不起。”",0],[11238,"“李景。母病。写字慢。对不起。”",0],[11240,"“赵克。父严。爱笑。对不起。”",0],[11242,"“张岚。无人记得。对不起。”",0],[11244,"一行一行，一共三十一行。",0],[11246,"最后一行的名字，是成汐。",0],[11248,"后面写着：",0],[11250,"“此子扛得住。此子不该扛。”",0],[11252,"成汐看着那行字，看了很久。",0],[11254,"然后她拿起笔，在下面写：",0],[11256,"“我扛得住。”",0],[11258,"写完，她把本子合上，抱在怀里。",0],[11260,"外面的天黑了。",0],[11262,"她坐在窗边，抱着那个本子，一动不动。",0],[11264,"肖中进来的时候，她已经睡着了。",0],[11266,"他把本子从她怀里抽出来，翻开看了一眼。",0],[11268,"他看了很久。",0],[11270,"然后他把本子合上，放回她怀里，替她盖上毯子。",0],[11272,"他走到窗边，把窗户关上。",0],[11274,"外面在下雪。",0],[11276,"徐老师走的那年，去了邻县一个镇上。",0],[11278,"她在那边的一个补习班教书，教语文。",0],[11280,"一个月三千八，管吃住。",0],[11282,"她走之前，把手机号换了。",0],[11284,"没有人知道她在哪儿。",0],[11286,"有一年冬天，我回家过年，在市里的一家面馆碰见她。",0],[11288,"她坐在角落里，吃一碗牛肉面。",0],[11290,"她瘦了很多，头发白了一半。",0],[11292,"我走过去。",0],[11294,"“徐老师。”",0],[11296,"她抬起头。",0],[11298,"她看了我一会儿。",0],[11300,"“肖中。”",0],[11302,"“嗯。”",0],[11304,"“你长高了。”",0],[11306,"“嗯。”",0],[11308,"我坐下。",0],[11310,"她低下头，继续吃面。",0],[11312,"吃了几口，她放下筷子。",0],[11314,"“成汐怎么样了？”",0],[11316,"“还行。”我说，“她已经不会忘了我了。”",0],[11318,"“那些事儿还记得多少？”",0],[11320,"“有的记得。但大多不记得了。”",0],[11322,"她点点头。",0],[11324,"“她会好的。”她说。",0],[11326,"“你怎么知道？”",0],[11328,"“因为她扛得住。”",0],[11330,"我没有说话。",0],[11332,"“肖中。”",0],[11334,"“嗯。”",0],[11336,"“我把你写进名单了。”",0],[11338,"“我知道。”",0],[11340,"“我划掉了。”",0],[11342,"“我知道。”",0],[11344,"“我划掉以后，写了成汐的名字。”",0],[11346,"我抬起头。",0],[11348,"“然后我把她的名字也划了。”她说，“我把整页都划了。”",0],[11350,"“为什么？”",0],[11352,"“因为我写不下去了。”她说，“我坐在那儿，看着那个本子，我一个字都写不出来。”",0],[11354,"她低下头。",0],[11356,"“我教了十七年书。”她说，“我从来没想过，我会亲手杀死自己的学生。”",0],[11358,"面馆里很吵。",0],[11360,"有人在喊“两碗牛肉面”。",0],[11362,"她端起碗，喝了一口汤。",0],[11364,"“你会告诉别人吗？”她问。",0],[11366,"“不会。”",0],[11368,"“为什么？”",0],[11370,"“都过去了。”我说，“它已经死了。”",0],[11372,"她点点头。",0],[11374,"“好。”",0],[11376,"“你害怕？”",0],[11378,"“怕。”她说，“可是怕了这么多年，也没用。”",0],[11380,"她站起来，从兜里掏出钱，放在桌上。",0],[11382,"她走了。",0],[11384,"我坐在面馆里，看着那碗没吃完的牛肉面。",0],[11386,"汤还在冒热气。",0],[11388,"崔校长是那年冬天退的。",0],[11390,"退之前，他做了一件事：把学校后院的井填了。",0],[11392,"填井的那天，他一个人去的。工人填完土，他站在老槐树底下，站了很久。",0],[11394,"后来有人问他，那口井里有什么。",0],[11396,"他说，什么都没有。",0],[11398,"“就是一口枯井。”",0]]},{"t":"张岚","k":"other","m":"none","d":"","f":0,"p":[[11402,"那年春节，张岚回了家。",0],[11404,"她站在自己家门口，站了很久。",0],[11406,"她没有钥匙。",0],[11408,"她敲了门。",0],[11410,"门开了。",0],[11412,"她妈站在门口，围着围裙，手里拿着一把菜刀。",0],[11414,"她妈看见她，愣了一下。",0],[11416,"然后她妈说：",0],[11418,"“你怎么这么晚才回来。”",0],[11420,"张岚站在门口。",0],[11422,"“路上堵车。”她说。",0],[11424,"她妈侧过身，让她进来。",0],[11426,"“饭在锅里。”她妈说，“自己盛。”",0],[11428,"张岚走进去。",0],[11430,"屋子跟她走的时候一样。沙发，电视，茶几上的一盘橘子。",0],[11432,"她换了鞋。",0],[11434,"她坐下来。",0],[11436,"她妈站在厨房门口，看着她。",0],[11438,"“你瘦了。”她妈说。",0],[11440,"“嗯。”",0],[11442,"“学校的饭不好吃？”",0],[11444,"“还行。”",0],[11446,"“我给你盛饭。”",0],[11448,"她妈转身进了厨房。",0],[11450,"张岚坐在沙发上，看着茶几上那盘橘子。",0],[11452,"橘子已经有点干了。",0],[11454,"她拿起一个，剥开。",0],[11456,"她妈端着饭出来。",0],[11458,"她把饭放在张岚面前。",0],[11460,"然后她坐下来。",0],[11462,"她就坐在对面，看着张岚吃。",0],[11464,"张岚吃了一口。",0],[11466,"“好吃。”她说。",0],[11468,"她妈的眼泪掉下来。",0],[11470,"掉在桌子上。",0],[11472,"张岚抬起头。",0],[11474,"“妈。”",0],[11476,"“你吃。”她妈说，“你吃完再说。”",0],[11478,"张岚低下头，继续吃。",0],[11480,"她吃了两碗。",0],[11482,"吃完，她把碗放下。",0],[11484,"她妈站起来，收碗。",0],[11486,"“妈。”张岚说。",0],[11488,"“嗯。”",0],[11490,"“我回来了。”",0],[11492,"她妈站在那儿，背对着她。",0],[11494,"她的肩膀抖了一下。",0],[11496,"“我知道。”她说。",0],[11498,"“妈，我……”",0],[11500,"“你别说了。”她妈说，“你别说了。”",0],[11502,"她转过身。",0],[11504,"“你回来就行。”她说，“你回来就行。”",0],[11506,"那天晚上，张岚睡在自己的房间里。",0],[11508,"房间跟她走的时候一样。",0],[11510,"她躺在床上，看着天花板。",0],[11512,"天花板上有一块水渍，形状像一只鸟。",0],[11514,"她小时候天天看这块水渍。",0],[11516,"她以为她再也看不见了。",0],[11518,"第二天，她妈带她去了派出所。",0],[11520,"恢复户口的手续，办了一个月。两年前销户，是学校和她爸一块儿办的，每一张纸上都有签名。",0],[11522,"派出所的人问了很多问题。",0],[11524,"她妈一句都答不上来。",0],[11526,"张岚自己答的。",0],[11528,"“我一直在学校。”她说。",0],[11530,"“哪个学校？”",0],[11532,"“屏城一中。”",0],[11534,"“你这两年住哪儿？”",0],[11536,"“宿舍。”",0],[11538,"“哪个宿舍？”",0],[11540,"“女生宿舍，三楼，三零七。”",0],[11542,"派出所的人看了她很久。",0],[11544,"然后他低下头，在表格上写了几笔。",0],[11546,"“行了。”他说，“回去等通知。”",0],[11548,"她们等了一个月。",0],[11550,"通知下来了。",0],[11552,"户口恢复了。",0],[11554,"学校赔的钱，退回去了。",0],[11556,"她妈把那笔钱存进银行，一分没动。",0],[11558,"“这钱不能花。”她说，“花了，就真当你不在了。”",0],[11560,"那年九月，张岚重新上了高三。",0],[11562,"她妈说，换个名字，好养活。",0],[11564,"她没换。",0],[11566,"她说，我就叫张岚。",0],[11568,"后来她们搬了家。搬到邻市，一个老小区，六楼，没有电梯。",0],[11570,"张岚重新上了高三，考了个专科，学会计。",0],[11572,"她毕业后在一家小公司做出纳，一个月四千二。",0],[11574,"她每年寄一张明信片。",0],[11576,"没有署名，没有地址。",0],[11578,"明信片上只有一句话：",0],[11580,"“我还记得。”",0],[11582,"第一年寄的是一张老槐树的照片。",0],[11584,"第二年寄的是一口井。",0],[11586,"第三年寄的是操场上的一排香樟树。",0],[11588,"丹丹每年都收到。",0],[11590,"她不知道是谁寄的。",0],[11592,"她把它们放在一个铁盒子里，收在床底下。",0],[11594,"有一次她问肖中。",0],[11596,"“你知道是谁吗？”",0],[11598,"肖中看着她。",0],[11600,"“不知道。”他说。",0],[11602,"“你骗我。”",0],[11604,"“我为什么骗你？”",0],[11606,"“因为你知道。”丹丹说，“你这个人，什么都知道。”",0],[11608,"肖中笑了一下。",0],[11610,"“我什么都不知道。”他说，“我连自己班上有几个人都数不清。”",0],[11612,"丹丹没有再问。",0],[11614,"她后来想，不知道也好。",0],[11616,"知道了，就要回信。",0],[11618,"回了信，就要见面。",0],[11620,"见了面，就要说很多话。",0],[11622,"而那些话，她一句都不想说了。",0]]},{"t":"卢依田","k":"other","m":"none","d":"","f":0,"p":[[11626,"大三那年，丹丹回过一次母校。",0],[11628,"学校已经拆了。老教学楼推倒了一半，操场上的跑道被挖开，堆着钢筋和水 ，只点得到二十九个。它从来数不到张岚。）",0],[12391,"（名册后附一行小字，是肖中的字：）",0],[12393,"“二〇二一年十月二十九日夜，高三七班应到三十一人，实到三十人，缺勤一人。”",0],[12395,"“缺勤者，肖中。”",0],[12397,"“——他后来到了。”",0]]}],"time":[[36,1285],[160,1290],[260,1295],[274,1304],[656,1318],[1064,1304],[1214,1320],[1242,1323],[1252,1304],[1254,1304],[1256,1304],[1258,1304],[1396,1325],[2198,1379],[2202,1380],[2416,1340],[2476,1360],[3048,1385],[3242,1390],[3314,1395],[3446,1430],[3626,1439],[3632,1439],[3826,30],[4202,40],[4522,60],[5100,95],[5172,105],[5222,115],[5234,117],[5260,120],[5911,163],[6019,170],[6087,170],[6159,180],[6615,182],[6651,185],[6709,185],[6915,205],[7127,210],[7143,210],[8033,240],[8411,290],[8705,310],[8855,315],[8885,320],[9293,330],[9299,330],[9375,350],[9383,358],[9389,360],[9541,365],[9575,368],[9587,372],[9633,374],[9927,1318],[10331,360],[10839,490]],"count":[[16,31],[670,30],[814,29],[1400,28],[3028,27],[4166,25],[4834,23],[6075,22],[6091,22],[6649,21],[6709,20],[6919,19],[8265,19],[8337,11],[8409,10],[8413,10],[8887,10]],"date":[[7533,"2014"],[7819,"2015"],[10027,"1985 · 三月"],[10041,"1985 · 四月"],[10053,"1985 · 五月"],[10063,"1986"],[10073,"1989"],[10079,"1997"],[10091,"2000"],[10097,"2005"],[10105,"2006"],[10119,"2010"],[10125,"2014"],[10167,"2015"],[10175,"2018"],[10193,"2019"],[10205,"2020"],[10223,"2020 · 十一月"],[10245,"2020 · 十二月"],[10257,"2020 · 十二月"],[10299,"2021 · 一月"],[11978,"2024"],[12103,"2026"]]};

/* =========================================================

   ========================================================= */
const book = document.getElementById('book');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

function splitTitle(t){
  const i = t.indexOf(' · ');
  if (i < 0) return ['', t];
  return [t.slice(0, i), t.slice(i + 3)];
}

let html = '';
DATA.sections.forEach((s, i) => {
  const [kick, name] = splitTitle(s.t);
  if (i === 25) html += '<div class="part">其他的事情</div>';

  html += '<section class="sec" id="sec-' + i + '">';
  html += '<div class="sec-head"><span class="sec-kicker">' + esc(kick || '　') + '</span>';
  html += '<h2>' + esc(name) + '</h2><div class="rule"></div></div>';
  html += '<div class="sec-body">';

  s.p.forEach(par => {
    const [l, text, q] = par;
    if (q){
      html += '<blockquote data-l="' + l + '">' + text.split('\n').map(t =>
        '<p>' + inline(t) + '</p>').join('') + '</blockquote>';
    } else if (s.t.indexOf('名册') >= 0 && /^\*\*(.+?)\*\*[\u3000 ]+(.+)$/.test(text)){
      const mm = text.match(/^\*\*(.+?)\*\*[\u3000 ]+(.+)$/);
      html += '<p class="rn" data-l="' + l + '"><strong>' + esc(mm[1]) + '</strong><span>' +
              inline(mm[2]) + '</span></p>';
    } else {
      html += '<p data-l="' + l + '">' + inline(text) + '</p>';
    }
  });

  html += '</div>';
  if (i === 24) html += '<div class="fin">完</div>';
  const prev = i > 0 ? DATA.sections[i-1].t : '';
  const next = i < DATA.sections.length - 1 ? DATA.sections[i+1].t : '';
  html += '<div class="sec-nav">';
  html += prev ? '<a href="#sec-' + (i-1) + '">‹ ' + esc(prev) + '</a>' : '<span></span>';
  html += next ? '<a href="#sec-' + (i+1) + '">' + esc(next) + ' ›</a>' : '<span></span>';
  html += '</div></section>';
});
book.innerHTML = html;

const elByLine = new Map();
book.querySelectorAll('[data-l]').forEach(el => {
  const k = +el.dataset.l;
  if (!elByLine.has(k)) elByLine.set(k, el);
});

const absTop = el => el.getBoundingClientRect().top + window.scrollY;

let TP = [], CP = [], DP = [], SP = [];
let secTime = [], secDate = [];

function layout(){
  const secEls = [...book.querySelectorAll('.sec')];
  SP = secEls.map((el, i) => ({ y: absTop(el), i }));

  TP = DATA.time.filter(a => elByLine.has(a[0]))
                .map(a => ({ y: absTop(elByLine.get(a[0])), m: a[1] }))
                .sort((x, y) => x.y - y.y);
  CP = DATA.count.filter(a => elByLine.has(a[0]))
                 .map(a => ({ y: absTop(elByLine.get(a[0])), n: a[1] }))
                 .sort((x, y) => x.y - y.y);
  DP = DATA.date.filter(a => elByLine.has(a[0]))
                .map(a => ({ y: absTop(elByLine.get(a[0])), s: a[1] }))
                .sort((x, y) => x.y - y.y);

  secTime = DATA.sections.map(() => []);
  secDate = DATA.sections.map(() => []);
  secEls.forEach((el, i) => {
    const top = absTop(el);
    const bot = i < secEls.length - 1 ? absTop(secEls[i+1]) : document.body.scrollHeight;
    TP.forEach(a => { if (a.y >= top - 2 && a.y < bot) secTime[i].push(a); });
    DP.forEach(a => { if (a.y >= top - 2 && a.y < bot) secDate[i].push(a); });
  });
}

function lastIdx(arr, y){
  let lo = 0, hi = arr.length - 1, r = -1;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    if (arr[mid].y <= y){ r = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return r;
}

function setCount(n, noteNull){
  if (n === lastCount) return;
  const dec = lastCount > 0 && n < lastCount;
  lastCount = n;
  if (n === null){
    hudCount.textContent = '—';
    hudCountBox.classList.add('dim');
    hudCountBox.querySelector('em').style.display = 'none';
    hudDots.style.display = 'none';
    hudCountNote.textContent = noteNull || '本节不在当夜';
    dotEls.forEach(d => d.classList.add('off'));
    mbC.textContent = '—';
    return;
  }
  hudCountBox.classList.remove('dim');
  hudCountBox.querySelector('em').style.display = '';
  hudDots.style.display = '';
  hudCount.textContent = n;
  hudCountNote.textContent = '名册三十一人 · 尚余 ' + n + ' 人';
  mbC.textContent = n;
  dotEls.forEach((d, i) => d.classList.toggle('off', i >= n));
  if (dec){
    hudCount.animate(
      [{ transform: 'translateY(6px)', opacity: .3 }, { transform: 'none', opacity: 1 }],
      { duration: 420, easing: 'cubic-bezier(.2,.8,.3,1)' }
    );
  }
}

function setTime(label, note, dim){
  const key = label + '|' + note;
  if (key === lastTime) return;
  lastTime = key;
  hudTime.textContent = label;
  hudTime.classList.toggle('sm', label.length > 7);
  hudTime.classList.toggle('dim', !!dim);
  hudTimeNote.textContent = note;
  mbT.textContent = label;
}

function onScroll(){
  const probe = window.scrollY + window.innerHeight * 0.32;

  // 当前节
  let si = lastIdx(SP, probe);
  if (si < 0) si = 0;
  const idx = SP[si].i;
  const sec = DATA.sections[idx];
  const secTop = SP[si].y;
  const secBot = si < SP.length - 1 ? SP[si+1].y : document.body.scrollHeight;

  const onCover = probe < SP[0].y;
  const secKey = idx + (onCover ? 'c' : '');
  if (secKey !== curKey){
    curKey = secKey; curSec = idx;
    hudSec.textContent = onCover ? '封面 · 开始阅读' : sec.t;
    const [kick, name] = splitTitle(sec.t);
    tbSec.textContent = onCover ? '遗忘的关系，如残月般' : name;
    tbKind.textContent = onCover ? '' : kick;
    document.querySelectorAll('.toc-item').forEach((el, i) =>
      el.classList.toggle('on', i === idx && !onCover));
    document.getElementById('btnPrev').disabled = idx === 0;
    document.getElementById('btnNext').disabled = idx === DATA.sections.length - 1;
  }

  // 时间 / 年代
  if (sec.m === 'clock'){
    const arr = secTime[idx];
    let t = null;
    if (arr.length){
      const j = lastIdx(arr, probe);
      t = j >= 0 ? arr[j] : arr[0];
    }
    if (t) setTime(hhmm(t.m), sec.f ? '文中最近一次报时 · 本节回溯' : '文中最近一次报时', false);
    else setTime('—', '本节未标时刻', true);
    // 人数（仅正文显示；插叙不计当夜人数）
    const jc = lastIdx(CP, probe);
    if (sec.k === 'main') setCount(jc >= 0 ? CP[jc].n : (CP.length ? CP[0].n : null));
    else setCount(null, '本节为插叙，不计当夜人数');
  } else if (sec.m === 'date'){
    const arr = secDate[idx];
    let lab = sec.d || '';
    if (arr.length){
      const j = lastIdx(arr, probe);
      lab = j >= 0 ? arr[j].s : arr[0].s;
    }
    setTime(lab || '—', '本节年代', !lab);
    setCount(null);
  } else {
    const lab = sec.t.indexOf('名册') >= 0 ? '名册'
      : (sec.k === 'inter' ? '插叙' : (sec.k === 'other' ? '旁支' : '—'));
    setTime(lab, '本节未标时刻', false);
    setCount(null);
  }

  // 进度
  const docH = document.body.scrollHeight - window.innerHeight;
  const gp = docH > 0 ? Math.min(1, Math.max(0, window.scrollY / docH)) : 0;
  topline.style.width = (gp * 100) + '%';
  tbPct.textContent = Math.round(gp * 100) + '%';

  const sp = Math.min(1, Math.max(0, (probe - secTop) / Math.max(1, secBot - secTop)));
  hudBar.style.width = (sp * 100) + '%';
  mbBar.style.width = (sp * 100) + '%';
  mbPct.textContent = Math.round(gp * 100) + '% 已读';
  hudFoot.textContent = (si + 1) + ' / ' + DATA.sections.length + ' 节 · 全书 ' + Math.round(gp * 100) + '%';
}

let raf = 0;
function requestUpdate(){
  if (raf) return;
  raf = requestAnimationFrame(() => { raf = 0; onScroll(); });
}

/* =========================================================
   目录
   ========================================================= */
const tocList = document.getElementById('tocList');
DATA.sections.forEach((s, i) => {
  const [kick, name] = splitTitle(s.t);
  const a = document.createElement('a');
  a.className = 'toc-item';
  a.href = '#sec-' + i;
  let tag = '';
  if (/^第.+章$/.test(kick)) tag = '';
  else if (kick === '插曲') tag = '插曲';
  else if (kick === '附录') tag = '附录';
  else if (kick === '引子') tag = '引子';
  else tag = '其他';
  a.innerHTML = '<span class="n">' + pad(i + 1) + '</span>' +
    '<span class="t">' + esc(name) + '</span>' +
    (tag ? '<span class="tag">' + esc(tag) + '</span>' : '');
  a.addEventListener('click', e => { e.preventDefault(); closeToc(); goTo(i); });
  tocList.appendChild(a);
});

function goTo(i){
  const el = document.getElementById('sec-' + i);
  if (!el) return;
  const y = absTop(el) - 70;
  window.scrollTo({ top: y, behavior: 'smooth' });
}

const toc = document.getElementById('toc');
const tocMask = document.getElementById('tocMask');
function openToc(){ toc.classList.add('on'); tocMask.classList.add('on'); }
function closeToc(){ toc.classList.remove('on'); tocMask.classList.remove('on'); }
document.getElementById('btnToc').onclick = openToc;
document.getElementById('btnTocClose').onclick = closeToc;
tocMask.onclick = closeToc;

document.getElementById('btnPrev').onclick = () => goTo(Math.max(0, curSec - 1));
document.getElementById('btnNext').onclick = () => goTo(Math.min(DATA.sections.length - 1, curSec + 1));

/* 字号 */
const FS = [15.5, 17, 18.5, 20];
let fsIdx = 1;
try { const v = localStorage.getItem('yx_fs'); if (v) fsIdx = Math.min(FS.length - 1, Math.max(0, +v)); } catch(e){}
function applyFS(){
  // 记住当前读到的那一段，重排后把它放回原位
  const probeY = window.innerHeight * 0.32;
  const hit = document.elementFromPoint(window.innerWidth / 2, probeY);
  const node = hit && hit.closest ? hit.closest('[data-l]') : null;
  const keep = node ? { el: node, off: node.getBoundingClientRect().top } : null;

  document.documentElement.style.setProperty('--fs', FS[fsIdx] + 'px');
  try { localStorage.setItem('yx_fs', fsIdx); } catch(e){}
  requestAnimationFrame(() => {
    layout();
    if (keep){
      const top = keep.el.getBoundingClientRect().top + window.scrollY;
      window.scrollTo({ top: Math.max(0, top - keep.off), behavior: 'instant' });
    }
    onScroll();
  });
}
document.getElementById('btnFont').onclick = () => {
  fsIdx = (fsIdx + 1) % FS.length;
  applyFS();
  const t = document.getElementById('toast');
  t.textContent = '字号 ' + FS[fsIdx] + 'px';
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('on'), 1200);
};
applyFS();

/* 键盘 */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') goTo(Math.min(DATA.sections.length - 1, curSec + 1));
  if (e.key === 'ArrowLeft') goTo(Math.max(0, curSec - 1));
  if (e.key === 'Escape') closeToc();
});

/* 启动 */
function boot(){
  layout();
  onScroll();
}
window.addEventListener('scroll', requestUpdate, { passive: true });
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(boot, 160); });
window.addEventListener('load', boot);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot);
boot();
</script>

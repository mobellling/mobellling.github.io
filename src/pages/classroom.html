<!DOCTYPE html>

<head>

<title>遗忘的关系，如残月般 · 在线阅读</title>
<style>
  :root{
    --paper:#f4f0e7;
    --paper-2:#efe9dc;
    --card:#fbf8f1;
    --ink:#221f1a;
    --ink-2:#4b453b;
    --muted:#857c6d;
    --line:#e2dacb;
    --line-2:#ece5d7;
    --accent:#a8322d;
    --accent-soft:#c4635c;
    --fs:17px;
    --lh:2.02;
    --top:54px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.7;
    -webkit-font-smoothing:antialiased;
    padding-top:var(--top);
  }
  .serif{font-family:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC",SimSun,serif;}

  /* ---------- 顶部栏 ---------- */
  #topbar{
    position:fixed;top:0;left:0;right:0;height:var(--top);z-index:60;
    display:flex;align-items:center;gap:12px;padding:0 18px;
    background:rgba(244,240,231,.92);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  #topbar .tb-title{
    font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;flex:1 1 auto;letter-spacing:.02em;
  }
  #topbar .tb-title b{font-weight:600;color:var(--ink);}
  #topbar .tb-title em{font-style:normal;color:var(--muted);margin-left:10px;font-size:12px;}
  .icon-btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink-2);
    height:32px;min-width:32px;padding:0 9px;border-radius:8px;cursor:pointer;
    font-family:inherit;font-size:12.5px;display:inline-flex;align-items:center;
    justify-content:center;gap:5px;transition:.16s;flex:0 0 auto;
  }
  .icon-btn:hover{border-color:var(--accent);color:var(--accent);}
  .icon-btn:disabled{opacity:.35;cursor:default;border-color:var(--line);color:var(--ink-2);}
  #tbPct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:38px;text-align:right;}

  /* 顶部进度线 */
  #topline{position:fixed;top:0;left:0;height:2px;background:var(--accent);z-index:61;width:0;transition:width .12s linear;}

  /* ---------- 封面 ---------- */
  .cover{
    max-width:660px;margin:0 auto;padding:96px 24px 72px;text-align:center;
    min-height:calc(100vh - var(--top));
    display:flex;flex-direction:column;justify-content:center;
  }
  .cover-mark{
    font-size:11.5px;letter-spacing:.34em;color:var(--accent);margin-bottom:28px;
  }
  .cover h1{
    font-size:clamp(30px,6vw,44px);line-height:1.35;margin:0 0 20px;font-weight:600;letter-spacing:.02em;
  }
  .cover-sub{
    color:var(--ink-2);font-size:14px;line-height:2;margin:0 auto;max-width:480px;
  }
  .cover-meta{
    margin-top:34px;font-size:12px;color:var(--muted);letter-spacing:.1em;
  }
  .cover-hint{
    margin-top:46px;font-size:12px;color:var(--muted);letter-spacing:.08em;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .cover-hint::after{
    content:"";width:1px;height:26px;background:linear-gradient(var(--muted),transparent);
    animation:drop 2.4s ease-in-out infinite;
  }
  @keyframes drop{0%,100%{opacity:.2;transform:translateY(-4px);}50%{opacity:.9;transform:translateY(4px);}}

  /* ---------- 正文 ---------- */
  #book{max-width:660px;margin:0 auto;padding:0 24px 140px;}

  .part{
    margin:96px 0 8px;text-align:center;font-size:11.5px;letter-spacing:.4em;
    color:var(--muted);
  }
  .part::before,.part::after{content:"";display:inline-block;width:36px;height:1px;background:var(--line);vertical-align:middle;margin:0 14px;}

  .fin{
    text-align:center;margin:88px 0;color:var(--muted);font-size:12px;letter-spacing:.5em;
  }

  .sec{scroll-margin-top:calc(var(--top) + 16px);}
  .sec-head{text-align:center;margin:110px 0 46px;}
  .sec-kicker{
    display:block;font-size:11.5px;letter-spacing:.34em;color:var(--accent);margin-bottom:14px;
  }
  .sec-head h2{
    font-family:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC",SimSun,serif;
    font-size:clamp(22px,3.4vw,27px);font-weight:600;margin:0;letter-spacing:.02em;line-height:1.5;
  }
  .sec-head .rule{
    width:34px;height:1px;background:var(--line);margin:24px auto 0;
  }
  .sec-body p{
    margin:0;text-indent:2em;font-size:var(--fs);line-height:var(--lh);
    letter-spacing:.012em;color:var(--ink);
    font-family:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC",SimSun,serif;
    text-align:justify;text-justify:inter-ideograph;
    word-break:break-word;
  }
  .sec-body p.blank{height:.9em;text-indent:0;}
  .sec-body blockquote{
    margin:26px 0;padding:18px 20px;background:var(--paper-2);
    border-left:2px solid var(--line);border-radius:0 6px 6px 0;
    font-size:calc(var(--fs) - 1.5px);line-height:1.95;color:var(--ink-2);
    text-indent:0;font-family:"Songti SC","STSong",SimSun,serif;
  }
  .sec-body blockquote p{text-indent:0;margin:0;font-size:inherit;line-height:inherit;color:inherit;text-align:left;}
  .sec-body strong{font-weight:700;color:var(--ink);}
  .sec-body .rn{
    display:flex;align-items:baseline;gap:.55em;margin:0 0 .15em;
    text-indent:0;font-size:calc(var(--fs) - 2px);line-height:1.95;
  }
  .sec-body .rn strong{
    flex:0 0 4.9em;color:var(--ink);font-weight:700;letter-spacing:.02em;
  }
  .sec-body .rn span{flex:1 1 auto;min-width:0;text-align:left;}
  .sec-nav{
    display:flex;justify-content:space-between;gap:14px;margin:64px 0 0;
    padding-top:22px;border-top:1px solid var(--line-2);
  }
  .sec-nav a{
    font-size:12.5px;color:var(--muted);text-decoration:none;max-width:46%;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .sec-nav a:hover{color:var(--accent);}

  /* ---------- 侧栏 HUD ---------- */
  #hud{
    position:fixed;top:calc(var(--top) + 34px);right:30px;width:212px;z-index:40;
    display:none;
  }
  .hud-sec{
    font-size:11.5px;color:var(--muted);letter-spacing:.1em;margin-bottom:22px;
    display:flex;gap:8px;align-items:baseline;
  }
  .hud-sec b{color:var(--ink-2);font-weight:600;font-size:12.5px;letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hud-block{margin-bottom:26px;}
  .hud-label{
    font-size:10.5px;letter-spacing:.22em;color:var(--muted);margin-bottom:6px;
  }
  .hud-time{
    font-family:"Songti SC","STSong",SimSun,serif;font-size:38px;line-height:1.1;
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
    transition:opacity .2s,color .2s;
  }
  .hud-time.sm{font-size:23px;letter-spacing:.02em;}
  .hud-time.dim{color:#b9b0a0;}
  .hud-count{
    font-family:"Songti SC","STSong",SimSun,serif;font-size:38px;line-height:1.1;
    font-variant-numeric:tabular-nums;color:var(--accent);
    display:flex;align-items:baseline;gap:4px;
  }
  .hud-count em{font-style:normal;font-size:12px;color:var(--muted);letter-spacing:.1em;}
  .hud-count.dim{color:#b9b0a0;}
  .hud-note{font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.03em;line-height:1.6;}
  .dots{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:12px;width:150px;}
  .dots i{
    width:100%;aspect-ratio:1;border-radius:50%;background:var(--accent);
    opacity:.85;transition:.45s cubic-bezier(.22,.7,.3,1);display:block;
  }
  .dots i.off{background:#ded5c4;opacity:1;transform:scale(.72);}
  .pbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px;}
  .pbar i{display:block;height:100%;width:0;background:var(--ink-2);transition:width .18s linear;}
  .hud-foot{font-size:10.5px;color:#a89e8d;letter-spacing:.06em;margin-top:14px;}

  /* ---------- 移动端底栏 ---------- */
  #mobar{
    position:fixed;left:0;right:0;bottom:0;z-index:55;
    display:flex;align-items:center;gap:14px;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(251,248,241,.94);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
  }
  #mobar .mb{display:flex;align-items:baseline;gap:4px;}
  #mobar .mb span{
    font-family:"Songti SC","STSong",SimSun,serif;font-size:20px;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  #mobar .mb small{font-size:10px;color:var(--muted);letter-spacing:.08em;}
  #mobar .mb.c span{color:var(--accent);}
  #mobar .mb-prog{flex:1 1 auto;min-width:0;}
  #mobar .mb-prog .pbar{margin-top:0;height:3px;}
  #mobar .mb-prog small{display:block;font-size:9.5px;color:var(--muted);margin-top:4px;letter-spacing:.08em;}

  /* ---------- 目录 ---------- */
  #tocMask{
    position:fixed;inset:0;background:rgba(34,31,26,.28);z-index:70;
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  #tocMask.on{opacity:1;pointer-events:auto;}
  #toc{
    position:fixed;top:0;left:0;bottom:0;width:330px;max-width:84vw;z-index:71;
    background:var(--card);border-right:1px solid var(--line);
    transform:translateX(-102%);transition:transform .3s cubic-bezier(.3,.8,.3,1);
    display:flex;flex-direction:column;
  }
  #toc.on{transform:none;}
  .toc-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px;border-bottom:1px solid var(--line-2);
  }
  .toc-head span{font-size:12px;letter-spacing:.2em;color:var(--muted);}
  .toc-list{overflow-y:auto;padding:8px 0 24px;flex:1;}
  .toc-item{
    display:flex;gap:10px;align-items:baseline;padding:8px 18px;cursor:pointer;
    font-size:13px;color:var(--ink-2);text-decoration:none;border-left:2px solid transparent;
  }
  .toc-item:hover{background:var(--paper-2);}
  .toc-item .n{
    font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;
    width:20px;flex:0 0 20px;text-align:right;
  }
  .toc-item .t{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .toc-item .tag{
    font-size:9.5px;color:var(--muted);border:1px solid var(--line);
    padding:0 5px;border-radius:99px;flex:0 0 auto;
  }
  .toc-item.on{color:var(--accent);border-left-color:var(--accent);background:var(--paper-2);}
  .toc-item.on .n{color:var(--accent);}
  .toc-sep{height:1px;background:var(--line-2);margin:8px 18px;}

  /* ---------- 提示 ---------- */
  #toast{
    position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);
    background:#241f1a;color:#f7f3ea;font-size:12px;padding:8px 14px;border-radius:8px;
    opacity:0;pointer-events:none;transition:.25s;z-index:80;white-space:nowrap;
  }
  #toast.on{opacity:1;transform:translate(-50%,0);}

  /* ---------- 响应式 ---------- */
  @media (min-width:1100px){
    #hud{display:block;}
    #mobar{display:none;}
    body{padding-right:216px;}
    #book{padding-bottom:120px;}
  }
  @media (max-width:1099px){
    #book{padding-bottom:110px;}
  }
  @media (max-width:680px){
    :root{--top:50px;--fs:16.5px;}
    .cover{padding:64px 20px 56px;}
    #book{padding:0 20px 110px;}
    .sec-head{margin:80px 0 34px;}
    #topbar{padding:0 12px;gap:8px;}
    #topbar .tb-title em{display:none;}
    #tbPct{display:none;}
    #topline{height:2px;}
    .sec-body blockquote{padding:14px 16px;margin:20px 0;}
    .sec-nav a{max-width:48%;}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>

<script>
const DATA = {"title":"遗忘的关系，如残月般","sections":[{"t":"引子 · 十月的最后一个星期五","k":"main","m":"clock","d":"","f":0,"p":[[8,"十月的最后一个星期五，晚自习。",0],[10,"黑板最下面一行是班主任徐老师的字，方方正正，一笔一画：",0],[12,"距高考 219 天。",0],[14,"晚自习从六点四十到十点整。这所学校的说法是，晚自习不算上课，所以不算补课，所以不收费，但是必须上。",0],[16,"十月的最后一个星期五，天已经冷下来了。教室的窗关着，三十一个人呼出来的气在玻璃上结了一层薄雾。",0],[18,"高三（七）班是这一届的重点班。三十一个人。",0],[20,"座位按上一次月考的名次排，每周换一次，往上爬一排，就是一次改命。",0],[22,"成汐坐在第三排中间。她的桌角永远摆着三样东西：一摞按科目分好的卷子，一支只剩半截的红笔，一个不锈钢保温杯。",0],[24,"杯子是她妈早上塞进她书包的。",0],[26,"“天凉了，别喝凉的。”",0],[28,"她一直没喝完。喝完了就得去走廊尽头接水，来回六分钟。六分钟够她做完一道解析几何。",0],[30,"她今年十七岁，当班长当了三年。高一开学第一天，徐老师在讲台上问“谁当过班长”，全班没有人举手，她举了。",0],[32,"举手的那一秒她其实在想中午食堂有没有糖醋排骨。",0],[34,"后来她才知道，很多事都是这样开始的：你只是随手举了一下手，然后就一直举了三年。",0],[36,"九点二十五分，笔尖擦过纸面的声音连成一片，像一场下不完的雨。",0],[38,"姜和坐在最后一排靠门的位置。",0],[40,"他爸三年前死了，他妈在深圳，一年回来一次。他脖子上挂着一根黑绳，绳头塞在校服领子里，露出一小块黄铜。",0],[42,"赵克在他旁边。他爸托了两个人情，请了两顿饭，才把他塞进这个班。他的名次永远在后面晃，人却活得比谁都自在。",0],[44,"他转笔的技术很好，一支笔在指间翻来覆去，从大拇指转到小拇指，再转回来，从来不掉。",0],[46,"姜和转得比他快。",0],[48,"笔掉了。",0],[50,"“操。”姜和骂了一句，弯腰去捡，捡起来，又掉。",0],[52,"赵克说：“你这手艺，别转了，丢人。”",0],[54,"“我这是快。”姜和说，“快你懂吗。”",0],[56,"“快有什么用。”",0],[58,"“………”",0],[60,"姜和没抬头。他把笔捡起来，在指间转了一圈，又掉了。",0],[62,"他脖子上挂着一根黑绳，绳头塞在校服领子里，露出指甲盖大小的一块黄铜。",0],[64,"赵克曾经笑过他，说一个大男生挂个铜片片，像老太太挂的护身符。",0],[66,"当时姜和把领子往下扯了扯，说：“这是我爷给的。弄丢了，我爷能从坟里爬出来打死我。”",0],[68,"“你爷不是去年冬天没的吗。”",0],[70,"“所以我说爬出来。”",0],[72,"当时赵克笑得趴在桌上。",0],[74,"成汐给姜和记过十二次检讨。这个数字她记得很清楚，因为她有一个本子，专门记这些：迟到四次，上课睡觉三次，晚自习讲话两次，翻墙出去买奶茶一次，在楼道里打球打碎了消防栓玻璃一次，还有一次是替赵克顶罪。",0],[76,"那次她没记。",0],[78,"那次姜和说：“班长，你就记我。他爸要知道了，能打死他。”",0],[80,"成汐问：“你爸知道了不打你？”",0],[82,"姜和愣了一下，笑：“我爸不在这。他打不着。”",0],[84,"她就把名字写成了姜和。",0],[86,"后来赵克还是知道了，跑到办公室门口堵她，脸红得像要打架，最后只说了一句：“班长，你这个人，不讲道理。”",0],[88,"成汐说：“我怎么不讲道理。”",0],[90,"赵克说：“你讲的是你的道理。”",0],[92,"她当时没听懂。现在想想，那大概是她听过的最准确的一句话。",0],[94,"靠窗第三排是李景。",0],[96,"他写字很慢，一笔一画，像在给什么人抄经。",0],[98,"上周他请了三天假。回来之后就更不爱说话了，眼下的青色深得像用铅笔涂过。",0],[100,"成汐给他打过一次电话。电话是他自己接的，背景里有一种持续的、很轻的响动，像医院的走廊。她问他在哪儿，他说在家。她问他要不要笔记，他说不用，他抄得完。",0],[102,"成汐后来才知道，那三天他是在医院。",0],[104,"何雨坐在第二排。",0],[106,"她的英语卷子永远第一个翻面。她做题的时候下巴微微抬着，那种笃定是从小被夸出来的，别人学不来。",0],[108,"她爸在教育局。这件事班里没几个人知道，成汐知道，因为开学交材料的时候，她看过何雨的档案。",0],[110,"何雨高一的时候跟成汐做过一学期同桌。那学期她们关系很好，好到一起去食堂、一起打水、一起在操场上绕圈背单词。",0],[112,"从那以后，她们还是同学，还是会在走廊上点头，还是会互相借橡皮。但那件事像一根刺，扎在两个人都够得着的地方，谁也不去拔。",0],[114,"于韵坐在何雨斜后方。",0],[116,"她是语文课代表，字写得很好看，作文常常被印出来。她不怎么说话，说话的时候声音很低，你要凑近一点才听得清。",0],[118,"她和姜和隔着两排，一个学期下来，两个人没说过一句话。",0],[120,"泽研坐在她旁边。周韩泽研，四个字的名字，班里有人叫她“周韩”，有人叫她“泽研”，她都应。她和于韵从高一同桌到现在，两个人好得像一个人。",0],[122,"成汐有一次看见她们在操场边上分一副耳机，一人一只，头靠得很近。她当时想，这样的朋友，一辈子大概能有一个就够了。",0],[124,"讲台边上，肖中正低头核对考勤表。",0],[126,"他个子高，坐在第一排显得委屈，背总是微微弓着，像随时准备站起来。",0],[128,"成汐和他搭班子三年，说过的话大概能装一抽屉，全是“作业收齐了吗”“值日表贴一下”“后门别锁”。",0],[130,"他叫她“班长”，从高一叫到高三，一次没改过口。",0],[132,"班里有人开过他们的玩笑，但被两人矢口否认。",0],[134,"上周的周测，最后一道大题答案是负二。肖中算成了二。\n\n成汐给他讲了三遍。第一遍他点头，第二遍他点头，第三遍他还是点头，然后在卷子上写了个“2”。\n\n成汐用红笔圈起来。\n\n他看了一眼，说：“差不多。”\n\n“差得多了。”\n\n“那我下次写负二。”\n\n他说这句话的时候语气很正经，像在答应一件了不得的大事。\n\n成汐低头改卷子，没让他看见自己在笑。",1],[150,"教室最后一排靠墙的位置坐着张岚。",0],[152,"她成绩中等，从不举手，从不出声。班里搞活动她永远负责看包。运动会她负责看衣服，春游她负责看车。",0],[154,"成汐记得她的座位，记得她的名字，记得她校服袖口总是洗得发白。",0],[156,"但她想不起来，上一次跟张岚说话是什么时候。",0],[158,"可能是因为，她从来没跟张岚说过话。",0],[160,"九点三十分，徐老师进来了。",0],[162,"她四十来岁，教语文，一年四季穿深色的外套。她走路很快，说话很快，总是自己编写一些举足轻重的资料。",0],[164,"她站在讲台上，把手里的保温杯放下。",0],[166,"“同学们，停一下。”",0],[168,"笔尖的声音慢慢停了。",0],[170,"“周末不放假了。”徐老师说，“这个周末，全部在校住宿。下周一模，时间紧。”",0],[172,"底下有人低低地“啊”了一声。",0],[174,"“啊什么。”徐老师说，“你们以为还有几个周末？二百一十九天。你们自己算算，还能过几个周末。”",0],[176,"她顿了顿。",0],[178,"“我们已经把安排发到家长群了。家长都支持。你们要理解，学校做的一切，都是为了你们的前途。”",0],[180,"前排有人小声说：“又是这句。”",0],[182,"徐老师听见了，没追究。",0],[184,"她拿起保温杯，拧开，喝了一口，然后目光在教室里扫了一圈。",0],[186,"扫到最后一排的时候，她停了一下。",0],[188,"停的时间不长，大概两秒。但那两秒里，她的表情变了一下，很轻，像水面被风吹皱又平了。",0],[190,"她看的是姜和。",0],[192,"姜和正低着头转笔，没看见。",0],[194,"“老师。”",0],[196,"前排有人举手。是蒋文。",0],[198,"“说。”",0],[200,"“那下一次什么时候放？”",0],[202,"“一模完了再说。”",0],[204,"底下有人叹气。",0],[206,"“叹什么气。”徐老师说，“你们算算，从现在到高考，一共二十六个周末。要复习三年的功课，你们觉得够吗？”",0],[208,"没有人回答。",0],[210,"“我知道你们累。”徐老师说，“我也累。我每天早上六点半到，晚上十点半走。我女儿今年上初二，她昨天跟我说，妈妈，我好像一个月没见你了。”",0],[212,"她停了一下。",0],[214,"“我跟她说，等这批学生考完，妈妈就陪你。”",0],[216,"教室里安静了。",0],[218,"“可是我带完你们，还有下一届。”徐老师说，“下一届带完，还有下下一届。”",0],[220,"她笑了笑。",0],[222,"“所以这话我不能说。说了就是骗人。”",0],[224,"底下有人笑了一声，很短。",0],[226,"徐老师说，“我只告诉你们一件事：这三年，是你们这辈子最公平的三年。”",0],[228,"“你们现在坐在这个教室里，三十一个人。你们家里有钱的，没钱的，爸妈当官的，打工的——在这儿都一样。你们考多少分，就是多少分。没有人能替你考。”",0],[230,"“出了这个门，就不一样了。”",0],[232,"她拿起粉笔，在黑板上写了两个字。",0],[234,"**阶层**",0],[236,"“为了这两个字，我们苦了半辈子。等你们四十岁，就懂了。”",0],[238,"她把粉笔放下。",0],[240,"“我不想说‘努力就有回报’。这话是骗人的。我只说一句：这三年，是你们唯一能自己说了算的三年。”",0],[242,"“你们自己掂量。”",0],[244,"教室里没有人说话。",0],[246,"成汐低头看着自己的卷子。",0],[248,"她想起她妈。",0],[250,"她妈在超市理货，一天站十个小时。她妈的手常年是肿的，晚上睡觉要垫一个枕头。",0],[252,"她妈从来没跟她说过“你要争气”。",0],[254,"她妈只说过“别喝凉的”。",0],[256,"“好了，继续。”徐老师说，“十点下课。下课以后直接回宿舍，不要在外面逗留。”",0],[258,"她走出去，门在身后合上。",0],[260,"九点三十五分，广播喇叭响了一声。",0],[262,"不是那种播通知的响。是一种电流的嘶鸣，尖细，断续，像有人拿一把锈了的锉刀，在耳膜上来回拉。",0],[264,"声音持续了十几秒，停了。",0],[266,"教室里有一半人抬了抬头，交换了一下眼神，嘴角浮起一点见怪不怪的笑。",0],[268,"这所学校的广播系统用了快二十年，线路老化，下雨天漏水，晴天落灰，出点毛病是常事。上个学期期末考试，英语听力放到一半，喇叭里突然开始放《运动员进行曲》。",0],[270,"“又来了。”赵克说。",0],[272,"大家低下头，继续写。",0],[274,"九点四十四分，那声音又起来了。",0],[276,"这一次更长，更尖，像有什么东西被卡在管道里，拼命往外挤。",0],[278,"肖中站起来。",0],[280,"他是纪律委员，负责这种时候去办公室找人。他把笔往桌上一放，绕过后排，推开了后门。",0],[282,"走廊里的声控灯应声亮起，把他的影子拉得很长，一直铺到教室的地面上。",0],[284,"成汐抬头看了一眼。",0],[286,"她看见肖中的背影，看见他校服后背上那块洗不掉的墨水印，看见他走出门去。",0],[288,"门在他身后合上。",0],[290,"“咔哒。”",0],[292,"一声很轻的响动。",0],[294,"轻得像有人在外面，替他把门锁上了。",0],[296,"成汐的笔尖停在纸上。",0],[298,"她抬起头。",0],[300,"紧接着，整栋教学楼的灯，同时灭了。",0]]},{"t":"第一章 · 落子","k":"main","m":"clock","d":"","f":0,"p":[[304,"黑暗来得太整齐了。",0],[306,"不是跳闸那种一间间熄过去的黑，是“唰”一下，从窗户到走廊到讲台，所有的光在同一秒被收走，像有人掀掉了一块盖在整座学校上的布。",0],[308,"“靠，什么情况？”",0],[310,"赵克的声音在黑暗里显得特别响。他推了把椅子站起来，椅子腿在水泥地上刮出难听的一声。",0],[312,"“都别动。”成汐说。",0],[314,"她听见自己的声音比平时紧。",0],[316,"“别乱走，等电来。”",0],[318,"有人在黑暗里摸索着找手机，屏幕亮起一小块，又灭了。学校规定晚自习不许带手机，被抓到就是违纪，带的人本就不多，但总有一两个。有人翻出课桌里的手电筒，光柱扫过一张张脸，白得发青，谁都不太敢看谁。",0],[320,"“肖中呢？”后排有人问。",0],[322,"“出去了。”成汐说，“去找老师了。”",0],[324,"“那门怎么关得那么响。”赵克嘟囔了一句，“跟锁上似的。”",0],[326,"没人接这句话。",0],[328,"所有人都听见了。",0],[330,"十分钟。",0],[332,"黑暗中的十分钟很长。长到能听见隔壁班的动静——没有动静。能听见走廊尽头的声控灯该亮没亮，能听见楼下自行车棚的铁皮在风里轻轻碰了一下，然后连风也停了。",0],[334,"“老师呢？”何雨的声音从右边传来，“这么大的事，老师不来？”",0],[336,"“可能在查线路。”成汐说。",0],[338,"“查线路要查十分钟？”",0],[340,"成汐没说话。",0],[342,"她心里那根弦也在一点点绷紧。这栋楼是老楼，线路三天两头出问题，可从来没有一次停电停得这么彻底——连应急灯都没亮。走廊尽头的安全出口指示灯是自带蓄电池的，绿色的那种，只要还有电，它就会亮。可现在，从门缝底下看出去，什么都没有。",0],[344,"她站起来，摸到自己的座位边上，把保温杯拧开喝了一口。",0],[346,"水已经温了。",0],[348,"她把杯子放回桌上，转身朝前门走。",0],[350,"讲台在黑暗里像一个隆起的坟包。她绕过它，手掌贴上门板，一点一点往下摸，摸到那个冰凉的金属把手。",0],[352,"拧。",0],[354,"不动。",0],[356,"她用了点力。锁舌在锁孔里卡得很死，一丝缝隙都没有。",0],[358,"“成汐？”陈丹丹在她身后小声叫。",0],[360,"“门锁了。”成汐说。",0],[362,"她听见自己的心跳。",0],[364,"“后门呢？”",0],[366,"她沿着墙一路摸过去，绕过讲台，绕过第一排的桌子，绕过后排的垃圾桶。黑暗里走这段路要花很久，因为每一个凸起都可能是别人的腿。",0],[368,"有人伸手扶了她一把，手掌是湿的。",0],[370,"后门的把手也一样。她两只手一起上，掌心压着往下摁，金属的边缘硌进肉里。门板纹丝不动，连一点晃动的余地都没有。",0],[372,"她退了一步，抬手拍了拍门。",0],[374,"“有人吗？”",0],[376,"没有回声。",0],[378,"走廊应该是个天然的回音腔，喊一声能荡出很远。可她的声音像被一面墙吞掉了，出去就没了。",0],[380,"“外面有人吗——”赵克也挤过来，抡起拳头砸门，“开门！里面还有人！”",0],[382,"拳头砸在门板上，一声一声，闷得像砸在土里。",0],[384,"门没有回应。",0],[386,"“让开。”",0],[388,"赵克从后排拖了一把椅子过来。",0],[390,"“你干什么？”成汐说。",0],[392,"“砸。”",0],[394,"“砸不开。”",0],[396,"“不砸怎么知道。”",0],[398,"他把椅子举起来，抡圆了，砸在后门上。",0],[400,"“咣。”",0],[402,"椅子腿断了一根。",0],[404,"门板上留了一道白印。",0],[406,"“再来。”",0],[408,"他又砸了一下。",0],[410,"第二根椅子腿断了。",0],[412,"“赵克。”",0],[414,"“再来！”",0],[416,"第三下。",0],[418,"椅子散了。",0],[420,"赵克站在那儿，手里攥着半截椅子腿，喘着气。",0],[422,"“这他妈什么门。”他说。",0],[424,"没有人回答。",0],[426,"“窗户。”姜和说。",0],[428,"他跑到窗边，举起椅子腿，砸玻璃。",0],[430,"“当。”",0],[432,"一声很脆的响。",0],[434,"玻璃上什么都没有。",0],[436,"连一道划痕都没有。",0],[438,"姜和愣了一下。",0],[440,"他又砸了一下。",0],[442,"“当。”",0],[444,"还是什么都没有。",0],[446,"“这不可能。”他说，“这是玻璃。”",0],[448,"他伸手摸了摸。",0],[450,"“是玻璃。”他说，“但是为什么……”",0],[452,"他又砸了一下。",0],[454,"椅子腿断了。",0],[456,"姜和站在窗边，手里攥着一小截木头。",0],[458,"“班长。”他说。",0],[460,"“嗯。”",0],[462,"姜和看着她。",0],[464,"“你这个人。”他说。",0],[466,"“我这个人怎么了？”",0],[468,"“没什么。”姜和说，“你这个人，挺烦的。”",0],[470,"他把那截木头扔在地上。",0],[472,"“行了。”他说，“我不砸了。”",0],[474,"他走回座位，坐下。",0],[476,"坐下之后，他把两只手放在桌面上，看着黑板。",0],[478,"黑板上的“219”在黑暗里看不清楚。",0],[480,"可他一直看着。",0],[482,"第十四分钟的时候，有人开始哭。哭声很轻，压在喉咙里，怕被人听见。",0],[484,"成汐站在门口，把手收回来。她的手在抖，她用另一只手把它按住。",0],[486,"“先别慌。”她说，“可能只是门锁的机械故障，加上停电。老师发现我们没出去，会来找的。”",0],[488,"“那要多久？”姜和的声音从后排传过来，他已经站起来了，“等老师来？等到明天早上？”",0],[490,"“姜和，坐下。”",0],[492,"“我不坐。”",0],[494,"“坐下。”成汐说，“现在谁都别乱。”",0],[496,"她的语气比自己想象的稳。",0],[498,"这是她当了三年班长练出来的东西——她知道一屋子人都在等她。",0],[500,"就在这时，头顶的灯管发出一声短促的爆鸣。",0],[502,"“啪。”",0],[504,"惨白的光瞬间灌满整个空间。",0],[506,"所有人都下意识地闭眼，成汐也是，生理性的泪水在眼眶里打转。等她再睁开，教室里的东西一样都没少：黑板上的公式，倒计时牌上的“219”，讲台上摊开的教案，空气里浮着的粉笔灰，一粒一粒，看得清清楚楚。",0],[508,"只是有什么地方不对。",0],[510,"那种不对说不上来。就像你在自己家里醒来，家具都在原位，可你知道这不是你家。",0],[512,"“……外面怎么黑成这样？”李景说。",0],[514,"他的声音打着颤，尾音往下掉。",0],[516,"所有人几乎是同时扑向窗边。",0],[518,"成汐跑到自己座位旁，手掌按在玻璃上。",0],[520,"窗外本该是操场，操场尽头是围墙，围墙外面是马路，马路边上是居民楼。这个点，居民楼的窗户应该一格一格亮着，像一块被点亮的电路板。操场的路灯也该亮着，光是暖黄色的，会把银杏树的影子投在跑道上。",0],[522,"现在什么都没有。",0],[524,"没有路灯，没有楼，没有星星，没有远处高架桥上连成一条线的车灯。窗框之外是一整片浓稠的黑，不是夜的那种黑——夜是有层次的，有远近，有天和地的分界。这片黑是平的，像有人把一块浸了墨的布，从窗框外面整个糊了上来。",0],[526,"成汐把额头抵在玻璃上，往极近的地方看。",0],[528,"玻璃上有她的倒影——脸，头发，身后黑压压的一片人影。",0],[530,"倒影之外，什么都没有。",0],[532,"就像这间教室被从世界上剪了下来，贴在一块黑纸上。",0],[534,"“别看了。”赵克后退了一步，撞翻了一把椅子，“都别看了。”",0],[536,"没有人听他的。所有人都贴在窗边，像一群趴在鱼缸壁上的鱼，看着缸外那片什么都没有的水。",0],[538,"“都回来。”",0],[540,"成汐转过身。",0],[542,"“回到座位上。”",0],[544,"“回座位干什么？”何雨说。",0],[546,"“因为我们现在什么都不知道。”成汐说，“什么都不知道的时候，先坐下来。站着的人容易慌。”",0],[548,"她自己先走回座位，坐下。",0],[550,"有人跟着坐下了，然后是第二个，第三个。椅子腿刮过地面的声音稀稀拉拉，像一场下不完的雨。",0],[552,"“成汐。”",0],[554,"何雨转过头。",0],[556,"“你有没有想过，”她说，“我们现在在哪儿？”",0],[558,"“在教室。”",0],[560,"“可教室外面什么都没有。”",0],[562,"“我知道。”",0],[564,"“那我们是在哪儿？”",0],[566,"成汐没有回答。",0],[568,"“我算过了。”何雨说，“放学是十点。现在九点五十。如果停电，最多停到明天早上。可是外面连路灯都没有。路灯是单独的线路，跟学校不是一条线。”",0],[570,"她说得很快，像在背一道公式。",0],[572,"“还有手机。手机没信号，这很正常，这栋楼厚。可是刚才有人试了打110，打不通。110不是靠信号的，它有专门的线路。”",0],[574,"“你想说什么？”",0],[576,"“我想说，”何雨说，“我们不在原来的地方了。”",0],[578,"教室里安静了一下。",0],[580,"“那我们在哪儿？”赵克说。",0],[582,"“我不知道。”何雨说。",0],[584,"“操。”他说。",0],[586,"他转身走回座位，走得很快，撞了一下桌角，骂了一句。",0],[588,"“都别砸窗户。”成汐说，“都别碰门。都坐下。”",0],[590,"“坐下等什么？”姜和在后排说。",0],[592,"“等。”",0],[594,"“等到什么时候？”",0],[596,"“等到有动静。”",0],[598,"“要是一直没动静呢？”",0],[600,"成汐看着他。",0],[602,"“那就等到天亮。”",0],[604,"姜和笑了一下。",0],[606,"“班长，”他说，“你这话跟没说一样。”",0],[608,"“我知道。”成汐说，“可现在我只能说这个。”",0],[610,"她坐下了。",0],[612,"教室里安静下来。",0],[614,"安静了大概五分钟。",0],[616,"那五分钟里，成汐听见了很多声音。",0],[618,"她听见有人在哭，很轻。她听见有人在念经，不知道是谁。她听见赵克在转笔，笔掉了一次，他捡起来，又掉。她听见李景的呼吸，很慢，很深，像在使劲压着什么。",0],[620,"她还听见一个声音。",0],[622,"很轻，很远。",0],[624,"像水。",0],[626,"“你们听见了吗？”她问。",0],[628,"“听见什么？”丹丹说。",0],[630,"“水声。”",0],[632,"所有人都安静下来。",0],[634,"没有人说话。",0],[636,"“没有啊。”丹丹说。",0],[638,"“有。”成汐说，“很轻。像地下水。”",0],[640,"“可能是暖气管。”何雨说。",0],[642,"“暖气管没有这个声音。”",0],[644,"“那是什么？”",0],[646,"成汐没有回答。",0],[648,"她听了一会儿。",0],[650,"那个声音一直在。",0],[652,"很轻，很远，很稳。",0],[654,"像有什么东西，在这栋楼底下，慢慢地流。",0],[656,"九点五十八分。",0],[658,"教室里的广播响了。",0],[660,"这一次没有嘶鸣。它响得很干净，很清晰，像有人调试了很久，终于满意了。",0],[662,"那是一个男人的声音。",0],[664,"不快，不慢，中间有停顿，停顿的位置很奇怪，像是在念一份写好的稿子，又像是在从什么地方一个一个地捡字。",0],[666,"“高三二班。”",0],[668,"教室里没有人动。",0],[670,"“应到三十人，实到二十九人。缺勤一人。”",0],[672,"成汐的手指在桌面上收紧了。",0],[674,"应到三十人。",0],[676,"她抬起头，数了一遍。",0],[678,"第一排六个，第二排六个，第三排六个，第四排六个，第五排六个，最后一排靠墙还有一个。",0],[680,"三十，不算肖中。",0],[682,"她又数了一遍。",0],[684,"三十。",0],[686,"“晚自习继续。”广播说，“现在，回到座位上。”",0],[688,"所有人本来就坐着。",0],[690,"“起立。”",0],[692,"没有人动。",0],[694,"“起立。”广播又说了一遍。",0],[696,"那两个字说出来的时候，成汐的腿自己动了。",0],[698,"不是害怕，是习惯。三年了，一千多节课，每一节课开始，都是这两个字。身体比脑子快。",0],[700,"她站起来的时候，教室里已经站起来一片。",0],[702,"站起来之后，她才反应过来自己在干什么。",0],[704,"她的后背一下子全是汗。",0],[706,"“坐下。”",0],[708,"大家又坐下了。",0],[710,"成汐听见自己的呼吸声。",0],[712,"它没有用任何威胁。它只是说了两个字，一屋子十七岁的人就自己站起来了。三年训练出来的东西，比恐惧还深。",0],[714,"“现在，点名。”广播说，“点到名字的，答‘到’。”",0],[716,"“成汐。”",0],[718,"成汐的喉咙动了一下。",0],[720,"“到。”",0],[722,"“陈丹丹。”",0],[724,"“到。”丹丹的声音很小。",0],[726,"“何雨。”",0],[728,"“到。”",0],[730,"“李景。”",0],[732,"“……到。”",0],[734,"一个名字，一个“到”。",0],[736,"点名的顺序是乱的，不是按座位，也不是按学号。它念得很慢，每一个名字之间隔两三秒，像是在等，又像是在听。",0],[738,"念到一半的时候，成汐发现了一件事。",0],[740,"它的名单上，没有张岚。",0],[742,"她转过头。",0],[744,"张岚坐在最后一排靠墙的位置，背挺得很直，两只手放在桌面上，眼睛看着前方。",0],[746,"广播念到了“卢依田”，念到了“王策”，念到了“杨枭”，念到了“袁冰”。",0],[748,"念到“姜和”的时候，它停了一下。",0],[750,"“姜和。”",0],[752,"教室里没有人答。",0],[754,"姜和坐在最后一排靠门的位置，一只手撑着桌子，一条腿伸在过道里。他抬起头，看着天花板上的喇叭。",0],[756,"“姜和。”广播又念了一遍。",0],[758,"姜和笑了一下。",0],[760,"“我不答。”他说。",0],[762,"教室里有人倒抽了一口气。",0],[764,"“姜和。”成汐压着声音说，“你答一声。”",0],[766,"“答什么？”姜和说，“答了就是我认了。我不认。”",0],[768,"“你先答一声。”",0],[770,"“班长，”姜和看着她，“你还没看明白吗？它点名，是为了知道谁在。它知道谁在，就好办了。我不答，它就不算我在。”",0],[772,"“它已经算你在了。”成汐说，“它都念到你了。”",0],[774,"姜和愣了一下。",0],[776,"他大概没想过这个。",0],[778,"他低下头，看了看自己的手，又抬起头，看着那个喇叭。",0],[780,"“姜和。”广播念了第三遍。",0],[782,"姜和站起来。",0],[784,"他把椅子往后一推，椅子腿在地上刮出一声长响。",0],[786,"“到。”他说。",0],[788,"他的声音很大，大到在教室里撞了一圈才落下来。",0],[790,"广播安静了两秒。",0],[792,"“迟到。”它说，“记过一次。”",0],[794,"姜和笑了。",0],[796,"“记呗。”他说，“记大过，记小过，随便记。反正我也考不上。”",0],[798,"他坐下去，把腿又伸到过道里。",0],[800,"点名继续。",0],[802,"念到最后一个名字的时候，广播停了很久。久到成汐以为它坏了。",0],[804,"然后它说：",0],[806,"“点名完毕。三十人，到二十九人。”",0],[808,"成汐的手指又开始数。",0],[810,"三十。",0],[812,"她坐在那儿，看着黑板上那个“219”，脑子里有一件事在慢慢地转。",0],[814,"应到三十，实到二十九。",0],[816,"可她数出来的是三十。",0],[818,"那少的人是谁？",0],[820,"她还没来得及想下去，广播又响了。",0],[822,"“现在，第一节课。”",0],[824,"“闭眼。”",0],[826,"没有人动。",0],[828,"“闭眼。”广播说，“睁眼的，按违纪处理。”",0],[830,"“违纪”两个字说出来的时候，成汐的眼睛自己闭上了。",0],[832,"她恨自己这一点。",0],[834,"她闭着眼，听见教室里一片窸窸窣窣的声音，是所有人都闭上了眼。",0],[836,"“两分钟。”广播说，“两分钟以后，开始上课。”",0],[838,"黑暗在眼皮后面变得更黑。",0],[840,"成汐能听见左边的丹丹在发抖，抖得桌椅都在轻轻响。她伸手过去，握住她的手。丹丹的手冰凉，回握得很用力。",0],[842,"她数着自己的心跳。",0],[844,"一，二，三……",0],[846,"数到一百二十的时候，广播响了。",0],[848,"“很好。”",0],[850,"“现在，睁开眼。”",0],[852,"成汐睁开眼。",0],[854,"她第一眼就看向后门。",0],[856,"那一瞬间，她的心脏像被一只冰冷的手攥住了，连跳都忘了怎么跳。",0],[858,"姜和坐在后门边上，背靠着门板，头歪向一侧。",0],[860,"他的眼睛睁着。",0],[862,"睁得极大，瞳孔里凝固着一种成汐从没在活人脸上见过的神情。",0],[864,"他脖子上的青筋鼓起来，扭曲着，像几条挣不脱的绳子。",0],[866,"“姜和？”赵克离他最近，他站起来，椅子被带倒了也没管，“姜和，你别吓我。”",0],[868,"没有回应。",0],[870,"“哥们？”赵克的声音在抖，“你他妈说话啊。”",0],[872,"他蹲下去，伸出手，碰了一下姜和的肩膀。",0],[874,"那只手停在半空。",0],[876,"赵克的脸一点一点白下去。他把手收回来，看了看自己的指尖，又看了看姜和，突然像被烫了一样往后跌，一屁股坐在地上，手脚并用地往后退，一直退到讲台边才停住。",0],[878,"“他好像死了。”赵克说。",0],[880,"他的声音很轻，轻得像在说一件跟自己无关的事。",0],[882,"教室里没有人叫。",0],[884,"所有人都在看那具靠着门板坐着的身体。灯还亮着，白得刺眼，把每一个细节都照得清清楚楚——姜和校服的第二颗扣子崩开了，露出里面灰白的T恤；那根黑绳从领口滑了出来，铜牌贴在他的锁骨上，被灯照得发亮；他的右手还攥着，攥着半截粉笔，是刚才砸门的时候从讲台上抓的。",0],[886,"成汐站在原地，听见自己的血在耳朵里流动。",0],[888,"她想起来，刚才闭眼之前，姜和的椅子是朝着讲台的。",0],[890,"他坐下了。",0],[892,"可是现在，他是背靠着后门坐着的。",0],[894,"在这两分钟里，有人——或者有什么东西——把他挪到了门口。",0],[896,"而他们二十九个人，全都闭着眼睛。",0],[898,"赵克爬回去了。",0],[900,"他跪着爬过去，爬到姜和旁边，一屁股坐在地上，靠着墙。",0],[902,"他坐在姜和旁边，肩膀挨着肩膀。",0],[904,"“哥们。”他说。",0],[906,"没有人应。",0],[908,"“哥们。”他又说了一遍，“你别装了。”",0],[910,"他伸出手，去合姜和的眼睛。",0],[912,"合不上。",0],[914,"他又试了一次。",0],[916,"还是合不上。",0],[918,"“你怎么这么犟。”赵克说。",0],[920,"他的手停在姜和的脸旁边。",0],[922,"“你不是说，等你有工作了，请我吃一顿好的吗。”",0],[924,"教室里很安静。",0],[926,"“你不是说，你妈在深圳，一个月给你打两千。你说你要攒钱，攒够了请我吃火锅。”",0],[928,"他的声音开始抖。",0],[930,"“你说你要点三盘毛肚。”",0],[932,"“你说你没吃过，就是觉得名字好听。”",0],[934,"成汐站在那儿，听着。",0],[936,"“你还欠我二十块钱。”赵克说，“你还没还。”",0],[938,"他低下头。",0],[940,"“你他妈还欠我二十块钱。”",0],[942,"他把脸埋在膝盖里。",0],[944,"肩膀一抽一抽的。",0],[946,"成汐走过去。",0],[948,"“赵克。”",0],[950,"“别碰我。”",0],[952,"“赵克，起来。”",0],[954,"“我说了别碰我。”",0],[956,"成汐蹲下去。",0],[958,"她伸手，放在他的肩膀上。",0],[960,"赵克猛地抬起头。",0],[962,"他的眼睛是红的，脸上全是泪。",0],[964,"“他还有半瓶水在我这儿。”他说。",0],[966,"“什么？”",0],[968,"“矿泉水。”赵克说，“他昨天放我桌上的。他说他喝不完，让我帮他放着。”",0],[970,"他伸手在兜里摸。",0],[972,"摸出来半瓶矿泉水。",0],[974,"瓶身已经被攥得变形了。",0],[976,"“还热着。”赵克说。",0],[978,"他把那瓶水举起来，看了看。",0],[980,"然后他把瓶子放在姜和的手边。",0],[982,"“你拿着。”他说，“你渴了喝。”",0],[984,"他站起来。",0],[986,"他站起来的时候，扶了一下墙。",0],[988,"“行了。”他说。",0],[990,"“赵克。”",0],[992,"“我没事。”他说，“我这个人，心大。”",0],[994,"他转过身，走回自己的座位。",0],[996,"走了两步，他停下来。",0],[998,"“班长。”",0],[1000,"“嗯。”",0],[1002,"“没事”",0],[1004,"成汐愣住了，“为什么？”",0],[1006,"“……”",0],[1008,"他坐下了。",0],[1010,"坐下以后，他一直看着自己的手。",0],[1012,"广播响了。",0],[1014,"“姜和。”",0],[1016,"那个声音很平静，像在念一份表格。",0],[1018,"“迟到，记大过。不听指令，记大过。”",0],[1020,"“累计三次，劝退。”",0],[1022,"“劝退。”",0],[1024,"它念完这两个字，停了一下。",0],[1026,"然后，喇叭里传出一个很轻的声音。",0],[1028,"那个声音很年轻，有点哑，尾音往上挑，说话带着一股浑不吝的劲儿。",0],[1030,"“到。”",0],[1032,"是姜和的声音。",0],[1034,"成汐的膝盖软了一下。",0],[1036,"她扶住桌沿，看着门口那具身体。",0],[1038,"那具身体的嘴没有动。",0],[1040,"可整个教室的人都听见了。那个声音从天花板的喇叭里出来，绕着教室走了一圈，落在每一个人的耳朵里。",0],[1042,"赵克还坐在地上。他抬起头，看着喇叭，嘴张着，眼泪一颗一颗地往下掉。",0],[1044,"“哎。”他说，“哎，你他妈——”",0],[1046,"他说不下去了。",0],[1048,"广播里那个声音又响了一次。",0],[1050,"“到。”",0],[1052,"这一次更轻，像是从很远的地方传过来的。",0],[1054,"然后，喇叭里恢复了那个平静的男声。",0],[1056,"“第一节课，现在开始。”",0]]},{"t":"第二章 · 门外","k":"main","m":"clock","d":"","f":0,"p":[[1060,"我姓肖，单名一个中字。",0],[1062,"那天夜里，我在高三（二）班的门外站了很久。后来有人问我那是什么感觉，我想了很久，只能说：像是站在一列已经开走的火车旁边，车窗还亮着，可你伸手过去，摸到的只是一片玻璃。",0],[1064,"二十一点四十四分，我推门出去的时候，走廊的声控灯亮了。",0],[1066,"我回头看了一眼。",0],[1068,"隔着后门那块小玻璃，能看见里面一片白花花的灯光，看见成汐低着头写字，看见赵克在转笔，看见最后一排那个总把笔转掉的人趴在桌上笑。",0],[1070,"一切都很正常。",0],[1072,"正常得让我后来每一次回想都觉得难受。",0],[1074,"门在我身后合上，锁舌弹出一声轻响。",0],[1076,"我没有在意。那扇门的锁是老式的，弹簧松了，关门稍用些力就会自己落锁，平日里我们都拿一张对折的纸片卡着，防止被风带上。",0],[1078,"那天没有人卡纸片。",0],[1080,"我往办公室走了大约十步，身后的光就没了。",0],[1082,"像有人从墙上把那一块明亮整个剜走，连边缘都没有留下。",0],[1084,"我回头。",0],[1086,"整条走廊陷进黑暗里。",0],[1088,"停电的那种黑是有层次的：窗外总有路灯，应急灯总会亮起一角绿光，人的眼睛过一会儿也能适应。那天什么都没有。走廊尽头朝南的那扇窗，外面本该是操场，操场上该有灯。",0],[1090,"没有。",0],[1092,"我有些发怵，跑回去，摸到门把手，动不了，拍门。",0],[1094,"“开一下门！”我喊，“班长！开门！”",0],[1096,"门里没有声音。",0],[1098,"不是无人应答，是根本没有声音。我把耳朵贴在门板上，连三十个人呼吸的动静都听不见。",0],[1100,"那扇门在那一刻变成了一块实心的木头，后面是空的。",0],[1102,"我拍了大约两分钟，掌心拍麻了，才想起该去找老师。",0],[1104,"办公室在走廊尽头拐角。我跑过去的时候，徐老师正拎着保温杯出来，准备去班里看看。",0],[1106,"她看见我，愣了一下。",0],[1108,"“你怎么出来了？”",0],[1110,"“广播坏了。”我说，“响了两回。然后停电了，班里门锁上了，我拍不开。”",0],[1112,"她没多问，跟我一起跑了回来。",0],[1114,"她比我冷静。她先试了门把手，然后蹲下去，把手电筒贴着地面，从门缝往里照。",0],[1116,"门缝大约三毫米宽。",0],[1118,"“看不见。”她说，“一点光都透不进去。”",0],[1120,"“里面有人。”我说，“三十个人。”",0],[1122,"徐老师站起来，又试了一次门把手，然后掏出手机。",0],[1124,"“马主任，二班这边出了点情况，您过来一趟。”",0],[1126,"她挂了电话，站在门口，一动不动。",0],[1128,"我那时候还想说点什么，比如“要不要报警”，比如“要不要砸门”。可我看见她的侧脸，就把话咽回去了。",0],[1130,"她在看那扇门，眼神很专注。",0],[1132,"马主任三分钟后到了。",0],[1134,"他是级部主任，四十来岁，走路很快，最不喜欢学生在他面前大呼小叫。他来的路上还在打电话，谈的是下周的月考安排。",0],[1136,"“怎么回事？”他问。",0],[1138,"徐老师把情况说了。说得很简短，也很准确，把“广播响了两回”和“停电”和“门锁了”按顺序说了一遍，一个字没多。",0],[1140,"马主任试了门，推了两下，又用肩膀撞了一下。",0],[1142,"门没有动。",0],[1144,"他又撞了一下。",0],[1146,"还是没有动。",0],[1148,"那扇门我熟。上周三李景迟到，被关在外面，一肩膀就把门撞开了，锁舌那时就有些松。我看着他撞的那一下，力气不小，门板连颤都没有颤。",0],[1150,"马主任退后一步，盯着门看了几秒。",0],[1152,"他的表情变了。",0],[1154,"“先不要声张。”他压低声音对徐老师说，“我上去调监控。你守在这里，有动静立刻给我打电话。”",0],[1156,"“主任，不报警吗？”我问。",0],[1158,"他看了我一眼。",0],[1160,"那一眼我记到今天。是一个人在心里算账时会有的神情——算这笔账该怎么平。",0],[1162,"“先按主任说的办。”徐老师从走廊尽头拖来两把椅子，“坐下等。这门大概是内部构件卡死了，等维修的人来。”",0],[1164,"“维修的人什么时候到？”",0],[1166,"“先等。”",0],[1168,"我和她坐在走廊里。",0],[1170,"走廊安静下来，不知何时，外面的灯已经亮了。",0],[1172,"楼下传来人声。高一高二放学了，学生成群地从楼梯口涌出来，书包甩在肩上，说笑着往校门走。有个男生在楼下喊了一声，另一个追着他跑，两个人的影子被路灯拉得很长。",0],[1174,"那盏路灯是亮的。",0],[1176,"我抬头看走廊的窗。窗朝南，能看见操场。操场的灯亮着，暖黄色的光铺在跑道上。更远处，居民楼的窗户一格一格亮起来。",0],[1178,"那一刻我脑子里冒出一个很荒唐的念头：同一个晚上，同一所学校，楼下的人在笑，我们在等一扇打不开的门。",0],[1180,"后来我才明白，那是这所学校本来的样子。",0],[1182,"她家在建设路。从学校过去，要过两个红绿灯。每天晚自习散场，我骑在她后面，隔着十几米，跟到第二个红绿灯就拐弯。\n\n她一直不知道。\n\n有一回她在路口回头看了一眼。我赶紧低头，假装在系鞋带。她在那儿站了一会儿，红灯变绿，她走了。\n\n我那时候想，等高考完，我就在第二个红绿灯那儿叫住她。想说的话在心里背过很多遍，开头永远是“班长”两个字。\n\n后面的部分，一直没想好。",1],[1192,"我回头，看我们班那扇门。",0],[1194,"门后什么都没有。",0],[1196,"我忽然生出一种极荒唐的感觉：这间教室被从世界上剪了下来，放到了别处。而我们站在剪纸的边缘，隔着一层纸，看着另一边的人间。",0],[1198,"我一拳砸在门板上。",0],[1200,"指节破了，血渗出来，黏在木头上。",0],[1202,"“为什么偏偏是今天。”我说，“为什么偏偏是我们班。”",0],[1204,"“别冲动。”徐老师叹了口气，“冷静些。”",0],[1206,"“冷静。”我靠着墙，“我什么都做不了。三十个人在里面，我什么都做不了。”",0],[1208,"徐老师没有说话。她从包里取出纸巾递给我，自己低头看手机。",0],[1210,"屏幕的光照在她脸上。",0],[1212,"她的神情很疲惫。我那时以为，那只是一个班主任加班到深夜时会有的疲惫。",0],[1214,"二十二点整，她在群里发了一条消息。我站在她旁边，看见了全文。",0],[1216,"“班主任”：各位家长，紧急通知：本周不再放周末，全部学生在校住宿，力求学习时间最大化。望理解，我们做的一切都是为了孩子的前途。谢谢配合！收到无须回复！",0],[1218,"发出去之后，她把手机扣在腿上，闭了一会儿眼。",0],[1220,"群里陆陆续续跳出“收到”。",0],[1222,"“李景妈妈”：收到。",0],[1224,"“何雨妈妈”：收到。",0],[1226,"“幸福一家人”：收到。",0],[1228,"“浮生半日闲”：@李景妈妈，无须回复，不用回“收到”。",0],[1230,"“卢依田姐姐”：老师也得考虑一下学生的身心健康，劳逸结合。",0],[1232,"“幸福一家人”：@卢依田姐姐，老师说什么咱配合就行，支持老师工作，都是为了孩子好。",0],[1234,"“卢依田姐姐”：😐",0],[1236,"我看了一眼，忽然想起在什么地方见过。卢依田的姐姐我见过一次，去年家长会，一个很瘦的女人，站在走廊里抽烟，被马主任说了两句。她把烟摁灭在花盆里，说了句“对不起啊老师”。",0],[1238,"我不知道她为什么偏要在这种时候说这个。",0],[1240,"我更不知道，她那句话发出去的时候，她的妹妹正坐在那扇门后面，听一个东西念名单。",0],[1242,"二十二点零三分，马主任回来了。",0],[1244,"他跑得很急，皮鞋在走廊里敲出一串响。手机屏幕的光照在他脸上，白得吓人。",0],[1246,"“看这个。”",0],[1248,"屏幕上是教室内监控回放。",0],[1250,"时间是二十一点四十四分。",0],[1252,"二十一点四十四分整：我从教室里出来。",0],[1254,"二十一点四十四分五十秒：我穿过走道。",0],[1256,"二十一点四十四分五十五秒：我拉开后门，踏进走廊。",0],[1258,"二十一点四十四分五十八秒：后门受惯性影响，合拢。",0],[1260,"然后画面定格。",0],[1262,"“看见了吗？”马主任的声音有些尖，“信号不是停电中断的。停电是二十一点四十五分零三秒，教室的摄像头在二十一点四十四分五十八秒就没了信号。”",0],[1264,"马主任把画面往前拖，停在我进门的那一帧，“你看这个时间戳。它停在这里。不是断线，不是黑屏，是画面不动了。后面所有的录像，都是这一帧。”",0],[1266,"我盯着那一帧看了很久。",0],[1268,"画面里的我，一只手扶着门，一条腿已经迈进了走廊，头微微偏着，像在看什么。",0],[1270,"我不记得我在看什么。",0],[1272,"“这说明什么？”徐老师问。",0],[1274,"马主任没有回答。他把手机收起来，抬头看着那扇门。",0],[1276,"走廊的灯在他头顶闪了一下。",0],[1278,"“我上去一趟。”他说，“校长在楼上。”",0],[1280,"他走了两步，又回头：“你守在这里。不要跟任何人说。”",0],[1282,"徐老师点头。",0],[1284,"我跟了上去。",0],[1286,"我至今不能确定当时为什么要跟上去。也许是因为待不住，也许是因为我害怕那扇门，怕它打开。",0],[1288,"校长室在四楼最里面。",0],[1290,"门开着，灯亮着。崔校长坐在办公桌后，面前摊着一份文件，手边放着一杯茶。",0],[1292,"他没有抬头。",0],[1294,"“来了。”他说。",0],[1296,"只有两个字，语气平得像在说今天有雨。",0],[1298,"马主任把手机递过去。",0],[1300,"校长看完那段录像，把手机放在桌上，端起茶杯喝了一口。",0],[1302,"“它刚刚出来了。”他说。",0],[1304,"办公室里静了几秒。",0],[1306,"“谁？”马主任问。",0],[1308,"校长看着窗玻璃，玻璃上映着他的脸，一层一层，像水里的倒影。",0],[1310,"“它没有名字。”",0],[1312,"他转过头，看向我。",0],[1314,"“肖中，你今年多大了？”",0],[1316,"“十七。”",0],[1318,"“十七。”他重复了一遍，像在称这个数字的分量，“你还记得你奶奶长什么样吗？”",0],[1320,"我愣了一下。",0],[1322,"“记得。”",0],[1324,"“她叫什么？”",0],[1326,"我说了。",0],[1328,"“她做的最后一顿饭，是什么？”",0],[1330,"我张开嘴。",0],[1332,"我记得她。我记得她坐在藤椅上，记得她的手背上有褐色的斑，记得她说话时嘴角会往一边歪，记得她给我剥过一整碗毛豆。",0],[1334,"可我想不起来她做过什么饭。",0],[1336,"“……想不起来了。”我说。",0],[1338,"校长点点头。",0],[1340,"“不是忘了。”他说，“是被吞噬过。”",0],[1342,"我的胃往上翻了一下。",0],[1344,"他从抽屉里取出一串钥匙放在桌上。钥匙很旧，黄铜的，穿在一个铁环上。其中一把比别的都长，齿很密，像是开保险柜的。",0],[1346,"“这串钥匙。”他说。",0],[1348,"我把它揣进了兜里。",0],[1350,"我那时以为他在说门。",0],[1352,"后来我才明白，他问的是另一件事：一个人能不能把一件事记到死，记到所有人都忘了，只剩下他还记得。",0],[1354,"“校长。”我说，“你知道发生什么了吗？”",0],[1356,"他看了我一会儿。",0],[1358,"“你知道这栋楼是什么时候盖的吗？”",0],[1360,"“五四年。”",0],[1362,"“五四年。”他说，“十二任校长。”",0],[1364,"他站起来，走到窗边，把窗帘拉开一条缝。",0],[1366,"楼下是操场，操场上的灯亮着，把跑道照成一圈一圈的橙黄色。",0],[1368,"“你下去吧。”他说，“守在门口。天亮之前，得把这件事了了。”",0],[1370,"“怎么做？”",0],[1372,"“等着。”",0],[1374,"“我不能就这么等。”我说，“里面三十个人。”",0],[1376,"“二十九个。”他说。",0],[1378,"我愣了一下。",0],[1380,"“什么？”",0],[1382,"“应到三十，实到二十九。”他说，“它已经点过名了。”",0],[1384,"我站在那儿，后背慢慢凉下来。",0],[1386,"“你怎么知道它会点名？”",0],[1388,"校长没有回答。",0],[1390,"他转过身，把窗帘放下了。",0],[1392,"“去吧，有个电台可以连接到里面，好长时间没用过了……”他说，“别在走廊上跑。跑起来，它会注意到你。”",0]]},{"t":"第三章 · 第一课：听写","k":"main","m":"clock","d":"","f":0,"p":[[1396,"二十二点零五分，一体机亮了。",0],[1398,"那台机器平时是用来放课件的，开机要一分多钟，风扇响得像拖拉机。现在它亮得毫无征兆，黑底白字，一行一行往下滚，像有人在屏幕后面打字。",0],[1400,"成汐盯着那行字，忽然发现自己在数：三十个人，除了门口那具身体，还有二十九个。可屏幕上写的是“二十八人”。",0],[1402,"她把这念头压下去了。",0],[1404,"“听写。”广播说。",0],[1406,"教室里没有人反应过来。",0],[1408,"“拿出纸。听写。”",0],[1410,"有人开始翻书包。纸张摩擦的声音在安静的教室里被放得很大。",0],[1412,"“二十个词。”广播说，“写完的，把笔放下。”",0],[1414,"“现在开始。”",0],[1416,"“第一个。abandon。”",0],[1418,"成汐的笔尖落在纸上。",0],[1420,"放弃。",0],[1422,"“第二个。subtle。”",0],[1424,"微妙的。",0],[142 154,"他停了停。",0],[2156,"“我回不去了。”",0],[2158,"成汐的喉咙紧了一下。",0],[2160,"“所以我算了算。”尹天高说，“我留下来，是十分钟的事。我出去，是几年的事。”",0],[2162,"“以后就没事了。”成汐说。",0],[2164,"“不会没事的。”尹天高说，“有些事，不管过了多长时间还是那个事。”",0],[2166,"他抬起头，看了看天花板上的灯管。",0],[2168,"“而且我这个人，运气一向差。”他说，“你们让我去赌，我赌不赢。这个不用赌。”",0],[2170,"他笑了一下。",0],[2172,"那个笑很难看，嘴角扯起来的时候，眼睛是往下垂的。",0],[2174,"“让一下。”他说。",0],[2176,"没有人拦他。",0],[2178,"他走过讲台，走过第一排，走到教室最前面那块空地上——那里本来放着一把备用的椅子，现在椅子不见了，只剩一块地砖，颜色比周围的深。",0],[2180,"他在那块地砖上站定，回过头。",0],[2182,"他看的是何雨。",0],[2184,"何雨坐在第二排，整个人缩在椅子里，脸埋在手里。",0],[2186,"“何雨。”尹天高说。",0],[2188,"何雨抬起头。",0],[2190,"“你不用觉得欠我。”尹天高说，“我不是替你去的。”",0],[2192,"何雨的眼泪一下子涌出来。",0],[2194,"“我是替我自己去的。”尹天高说，“我这个人，活了十七年，没做过一件自己选的事。今天这件，是我自己选的。”",0],[2196,"他转过头，面朝黑板，站直了。",0],[2198,"二十二点五十九分五十秒。",0],[2200,"挂钟的红色秒针跳到十二。",0],[2202,"二十三点整。",0],[2204,"教室里的灯开始闪。",0],[2206,"一闪，一暗，一闪。灯管里发出“嗡嗡”的电流声，越来越响，像有一群虫子从灯管里爬出来。所有人下意识地抬手挡眼。",0],[2208,"成汐在闪烁的光里看见尹天高的背影。",0],[2210,"他的肩膀塌了一下。",0],[2212,"然后灯灭了。",0],[2214,"黑暗持续了大概十秒。",0],[2216,"十秒里，成汐听见一个声音。",0],[2218,"很轻，像有人把一摞书放在桌上。",0],[2220,"然后是更长的一阵安静。",0],[2222,"十秒之后，灯重新亮起。",0],[2224,"教室变了。",0],[2226,"所有的课桌都被挪动了。三十一张桌子，围成一个“口”字，中间空出一大块。桌与桌之间对齐得整整齐齐，四条边笔直，像用尺子量过。",0],[2228,"成汐记得很清楚，停电之前，教室是六列五排，最后一排靠墙还加了一个位子，桌子和桌子之间挤得连腿都伸不开。要把三十一张桌子挪成这个形状，需要三十一个人，需要至少十分钟，需要很大的动静。",0],[2230,"刚才灯灭了十秒。",0],[2232,"“口”字的中间，地板上，躺着一个人。",0],[2234,"成汐往前走。",0],[2236,"绕过第一排桌子的时候，一股味道扑上来——铁锈味，混着一种更甜的、更腻的东西。她的胃往上翻了一下，被她硬压回去。",0],[2238,"她扶着桌沿，往里看。",0],[2240,"那是一个女生。长发散在地上，被一种暗红色的东西浸透了，黏成一绺一绺。校服的前襟全是湿的，颜色深得发黑。她的脸侧向一边，一半埋在头发里。",0],[2242,"成汐的心跳停了一拍。",0],[2244,"她猛地转头，在人群里找。",0],[2246,"陈丹丹站在第三排桌子后面，两只手捂在嘴上，眼睛瞪得很大，也在看那具尸体。",0],[2248,"成汐的腿软了一下。",0],[2250,"她扶住桌子，深呼吸，又深呼吸。",0],[2252,"不是丹丹。成汐心想，但随即又感觉自己有些自私。",0],[2254,"“小韵！”",0],[2256,"泽研的声音从人群里挤出来。她推开挡在前面的人，跌跌撞撞地跑到“口”字边上，双手撑住桌面，整个人探进去。",0],[2258,"“小韵！小韵你醒醒！”",0],[2260,"她翻过桌子，落地的时候膝盖磕在桌腿上，闷响一声，她像没听见，连滚带爬地扑到那具尸体旁边，跪下去。",0],[2262,"是于韵。",0],[2264,"成汐这才认出来。她左胸上别着一枚塑料校徽，被血浸过，颜色发暗。",0],[2266,"泽研跪在那里，肩膀剧烈地抖。她把于韵的头抱起来，放在自己膝盖上，一遍一遍地叫她的名字。",0],[2268,"所有人都以为她只是难过。",0],[2270,"成汐也这么以为。直到她看见泽研的手。",0],[2272,"那只手在抖，但不是那种失控的抖。它在动，在往于韵的校服口袋里探。一下，两下，很小心，很急，还时不时抬头看一眼周围的人。",0],[2274,"在死人身上翻东西。",0],[2276,"成汐的后背窜起一层鸡皮疙瘩。",0],[2278,"一般人不会这么干。就算再难过，也不会。",0],[2280,"除非她知道那里面有什么。",0],[2282,"成汐转过头，看向教室后面。",0],[2284,"于韵的座位空着。",0],[2286,"她是什么时候离开座位的？",0],[2288,"成汐想起来，二十二点五十分，所有人都在看尹天高。",0],[2290,"那个时候，于韵的座位就已经空了。",0],[2292,"“都回到自己的位置上。”成汐说。",0],[2294,"她的声音很稳，稳得连她自己都吃惊。",0],[2296,"“先都离开这儿。别看。”",0],[2298,"“成汐……”有人叫她。",0],[2300,"“退后。”",0],[2302,"人群往后退了一点。",0],[2304,"就在这时，一体机亮了。",0],[2306,"“请忽略这段不愉快的插曲。”",0],[2308,"“接下来的一个小时，是自习时间。请同学们坐在课桌前，像平时一样查缺补漏。”",0],[2310,"“禁止讨论，禁止商量问题。违者重罚。”",0],[2312,"屏幕上的倒计时跳出来：",0],[2314,"59:59。",0],[2316,"对着一具尸体自习。",0],[2318,"成汐听见身后有人发出一声很短的笑，笑到一半变成了哭。",0]]},{"t":"第四章 · 门外（二）","k":"main","m":"clock","d":"","f":1,"p":[[2322,"我下楼的时候，走廊里只剩徐老师一个人。",0],[2324,"她坐在那两把椅子上，膝上摊着一个本子，手里拿着笔。",0],[2326,"“校长说什么？”她问。",0],[2328,"“他让我守着。”",0],[2330,"“那就守着。”",0],[2332,"我坐到她旁边。",0],[2334,"门后传来声音。",0],[2336,"不是说话，是一种很平的、一个字一个字往外念的调子。隔着门板，听不清内容，只能听出节奏：念一句，停一下，再念一句。",0],[2338,"徐老师低下头，在本子上写字。",0],[2340,"我凑近看。",0],[2342,"她在记。",0],[2344,"成汐、李景……她写的是名字，写得很快，字迹潦草。",0],[2346,"“你记这个干什么？”",0],[2348,"“有用。”她说。",0],[2350,"“有什么用？”",0],[2352,"她没有回答。",0],[2354,"“徐老师。”我说，“为什么不报警？”",0],[2356,"她写完一个名字，把笔停下。",0],[2358,"“报了警，来的是警察。”她说，“警察进不去。就算进去了，看见的也不是他们能解释的东西。然后呢？”",0],[2360,"“然后怎么样？”",0],[2362,"“然后这所学校就完了。”她说，“三千个学生，一百多个老师，三十年的东西。”",0],[2364,"“三十个人在里面。”",0],[2366,"“二十九个。”她说。",0],[2368,"我看着她。",0],[2370,"“你也知道。”",0],[2372,"“我知道。”她说，“我教了二十九年书。这栋楼里的事，我比校长知道得早。”",0],[2374,"“那你还——”",0],[2376,"“我还什么？”她抬起头，“我还能怎么样？我把它填了？我把这栋楼拆了？我跟家长说，你们的孩子不能在这儿上学，因为有个脏东西？”",0],[2378,"她的声音很平，可她的手在抖。",0],[2380,"“肖中，你十七岁。”她说，“你觉得对的事，做就行了。我五十三岁。我知道对的事，可我做不了。”",0],[2382,"门后那个声音又念了一个词。",0],[2384,"徐老师低下头，继续记。",0],[2386,"我看着她的侧脸，忽然觉得很陌生。",0],[2388,"这个人教了我三年。她给我改过作文，给我写过评语，我发烧的时候她送我去过医院。她是我认识的、最像老师的一个老师。",0],[2390,"现在她坐在一扇打不开的门外面，记录里面的学生。",0],[2392,"“徐老师。”",0],[2394,"“嗯。”",0],[2396,"“你是不是早就知道，今天晚上会出事。”",0],[2398,"她的笔停了。",0],[2400,"停了很久。",0],[2402,"“我不知道是哪一天。”她说。",0],[2404,"“你知道会有这么一天。”",0],[2406,"“我知道。”",0],[2408,"“那你为什么不提前——”",0],[2410,"“提前什么？”她转过头，“提前把三十个人放走？放到哪儿去？他们还得回来。他们还得高考。他们跑了今天，明天呢？”",0],[2412,"她合上本子。",0],[2414,"“有些事，你只能等它来。”",0],[2416,"二十二点二十分，马主任下来了。",0],[2418,"他手里拎着一把消防斧。",0],[2420,"“让开。”",0],[2422,"他抡起斧子，砍在门锁上。",0],[2424,"“咣。”",0],[2426,"斧刃弹回来，震得他虎口发麻。",0],[2428,"“咣。”",0],[2430,"第二下。",0],[2432,"“咣。”",0],[2434,"第三下。",0],[2436,"门板上留下一道白印，很浅，像指甲划的。",0],[2438,"马主任停下来，喘着气，看着那道白印。",0],[2440,"“这他妈是什么木头。”他说。",0],[2442,"“主任。”徐老师说，“别砍了。”",0],[2444,"“不砍怎么办？等？”",0],[2446,"“等。”",0],[2448,"马主任把斧子扔在地上。",0],[2450,"他在走廊里来回走了两趟，然后掏出手机，走到楼梯口去打电话。",0],[2452,"我听见他的声音。",0],[2454,"“王局，是我……对，七班这边……不是，不是学生的事，是……您先听我说完……”",0],[2456,"他的声音越来越低，最后变成了一种讨好的、含混的调子。",0],[2458,"“是是是，我知道，我知道影响不好……对，先控制住……天亮之前……是，我明白。”",0],[2460,"他挂了电话，走回来。",0],[2462,"“教育局怎么说？”徐老师问。",0],[2464,"“让我们自己处理。”马主任说，“天亮之前处理完。不能上新闻。”",0],[2466,"“不能上新闻。”我重复了一遍。",0],[2468,"“你少用那种口气。”马主任说，“你以为我想？”",0],[2470,"他蹲下去，两只手抱着头。",0],[2472,"“我儿子今年高一。”他说，“他也在这所学校。”",0],[2474,"走廊里安静下来。",0],[2476,"二十二点四十分，楼梯口传来脚步声。",0],[2478,"是校长。",0],[2480,"他换了一件外套，深色的，手里拿着一个手电筒。",0],[2482,"“肖中。”他说，“跟我来。”",0],[2484,"“去哪儿？”",0],[2486,"“后院。”",0],[2488,"“人在教室里。”",0],[2490,"“教室里的东西，根在后院。”他说。",0],[2492,"我们走的是西侧的旧楼梯。台阶很窄，扶手是水泥的，摸上去有一层细灰。这栋楼是一九八五年盖的，比学校其他楼都老，平时只有高三用。",0],[2494,"“校长。”我在他身后说，“里面怎么样了。”",0],[2496,"“不容乐观。”",0],[2498,"他停下脚步。",0],[2500,"手电的光照在台阶上，照出一小片灰白。",0],[2502,"“于韵也在里面。”他说，“她是于敬堂的孙女。”",0],[2504,"“于韵？”我说，“为什么？她有什么……”",0],[2506,"我本想说，她有什么特别的，但是迎面撞上校长的目光，把话又收了回去。",0],[2508,"校长站在台阶上，看着我。",0],[2510,"他的脸在手电光里显得很老。",0],[2512,"校长没有说话。",0],[2514,"他转过身，继续往下走。",0],[2516,"“走。”",0],[2518,"后院在教学楼北面，平时锁着，堆着废旧的桌椅和几袋水泥。手电的光扫过去，能看见墙根下长着一片野草，草叶上全是露水。",0],[2520,"院子正中有一棵老槐树。树很粗，三个人合抱不过来，树皮裂开一道道深沟。树下有一块石碑，碑面朝南，上面刻着四个字：",0],[2522,"奠基。",0],[2524,"碑的下半截被土埋了，只露出上面一小块。校长蹲下去，用手把碑前的浮土扒开。",0],[2526,"土很松，像经常有人翻动。",0],[2528,"扒到一半，他的手指碰到一个硬东西。",0],[2530,"不是石头。",0],[2532,"是一个铁盒子。",0],[2534,"铁的，长方，锈得发红，跟一块砖差不多大。盒盖上用钉子钉了一块木牌，木牌上的字已经看不清了。",0],[2536,"“什么？”我问。",0],[2538,"校长把盒子拿起来，掂了掂。",0],[2540,"“他的。”",0],[2542,"“谁的？”",0],[2544,"“于敬堂。”",0],[2546,"他把盒子打开。",0],[2548,"里面是一本本子。",0],[2550,"牛皮纸封面，边角磨圆了，用一根麻绳捆着。",0],[2552,"校长把麻绳解开，翻了两页。",0],[2554,"“你看看吧。”他说。",0],[2556,"我接过去。",0],[2558,"本子很旧，纸是黄的，字是毛笔写的，很小。",0],[2560,"第一页上写着一行：",0],[2562,"“余兴者，宴罢之余也。席散人去，独坐待哺。”",0],[2564,"我看不懂。",0],[2566,"“什么意思？”",0],[2568,"“意思是，”校长说，“它不是鬼。它是剩下的一点东西。”",0],[2570,"他指了指那个“余兴”两个字。",0],[2572,"“人家办完事，桌子撤了，人都走了。它还坐在那儿，等一口。”",0],[2574,"我翻到后面。",0],[2576,"县里要在村东扩建中学。他们不能挖那井。\n\n……\n\n二〇二〇年，冬天。\n\n我把铜牌给了姜和。\n\n我知道我做错了。\n\n我应该给韵韵。她懂事，她记得住，她不会弄丢。\n\n可是她太懂事了。她要是知道了，她会去。\n\n她去了，就回不来。",1],[2592,"我停在这一页，看了很久。",0],[2594,"“他知道。”我说。",0],[2596,"“他知道。”校长说。",0],[2598,"“他知道他外孙会死。”",0],[2600,"“他不知道是哪一天。”校长说，“他只知道，早晚有这么一天。”",0],[2602,"我把本子合上。",0],[2604,"“这个本子，能给我吗？”",0],[2606,"“你要它干什么？”",0],[2608,"“我想留着。”",0],[2610,"校长看了我一会儿。",0],[2612,"“留着没用。”他说，“看完了，你也会忘。”",0],[2614,"“我不会。”",0],[2616,"“你会的。”他说，“所有人都这么说。”",0],[2618,"他把本子从我手里拿回去，放回铁盒，盖上，塞回土里。",0],[2620,"“别看了。”他说，“看多了，你就记住了。记住了，它就吃得到。”",0],[2622,"他把土重新扒回去，拍了拍。",0],[2624,"然后他把那串钥匙取出来，挑出最长的那一把，插进锁孔，转了两圈。铜盖发出一声闷响，往上弹了一线。",0],[2626,"他双手抠住边缘，把盖子掀开。",0],[2628,"一股气味冲上来。",0],[2630,"不是臭味，是一种很干净的、石头和深水才有的凉气。我探头往下看，什么都看不见，只有黑。",0],[2632,"“多深？”",0],[2634,"“三十七米。”校长说，“底下是暗河。”",0],[2636,"他把手电往下照。光柱落下去，在井壁上滑了一段，最后被黑暗吞掉。",0],[2638,"“一九八五年，这所学校动工。”他说，“之后要扩建，推土机推到这院子里，推不动了。挖开一看，是这口井。井口压着一个铜匣子，匣子上刻满了字。”",0],[2640,"“当时没人认得那些字。工头说不吉利，要填了。学校请院子的主人来看，就是于先生。”",0],[2642,"“他跟当时的校长说了一件事。”校长站起来，拍了拍手上的土，“这块地底下有个东西。不是鬼，不是神，是个灵。它没有身体，只能附在东西上；它没有名字，所以谁也喊不住它；它靠吃一样东西活着。”",0],[2644,"“吃什么？”",0],[2646,"“吃人和人之间的那点牵连。”",0],[2648,"他看着我。",0],[2650,"我的胃往上翻了一下。",0],[2652,"“它吃得很少。”校长说，“它很聪明，从来不吃干净。一个人对另一个人的记忆，它只吃一角。你少了那一角，不会觉得不对，只会觉得有点空。”",0],[2654,"“于老先生用铜匣子把它封在井里。铜是惰性的，不跟别的东西起反应，它附不上去。匣子上刻着字，是它的名字。名字是唯一能镇住它的东西。他每年回来描一次，描了三十年。”",0],[2656,"“后来呢？”",0],[2658,"“后来这里成了市区。地价涨了。教育局要拆井，老于家的人来闹过，说这块井不能动。没人听。他们说这是国有土地，说于家是老迷信。”",0],[2660,"校长笑了一下，那个笑很短。",0],[2662,"“于老先生拿了钱，走了。走之前，他把这件事告诉了当时的校长。他说，铜匣子会裂，裂了就补，补不了就换。他说，要是有一天它出来了，就找一个愿意把名字给它的人。”",0],[2664,"“给了会怎么样？”",0],[2666,"“它会安分二十年。”",0],[2668,"“那个人呢？”",0],[2670,"他没有说下去。",0]]},{"t":"插曲 · 于韵","k":"inter","m":"none","d":"","f":0,"p":[[2674,"去年冬天，外公病重。",0],[2676,"于韵每个周末都去看他。",0],[2678,"外公住在城西的老房子，一个院子，三间瓦房。院子中间有一口井，井口盖着一块青石板，石板上压着半块砖。",0],[2680,"她小时候问过，井里有什么。",0],[2682,"外公说，有水。",0],[2684,"她说，我想看看。",0],[2686,"外公说，不许看。",0],[2688,"她问为什么。",0],[2690,"外公说，看了要还。",0],[2692,"她那时候不懂。她以为“还”是还钱，还东西。",0],[2694,"后来，因为隔壁学校要扩建，他们一家被迫搬家。",0],[2696,"外公病倒以后，她把这井忘了。",0],[2698,"那年十二月，外公开始说胡话。",0],[2700,"不是那种乱七八糟的胡话。他说的每一句都很清楚，条理分明，像是在交代后事。",0],[2702,"他把她叫到床边。",0],[2704,"“韵韵。”",0],[2706,"“外公。”",0],[2708,"“你哥呢？”",0],[2710,"“他上学。”",0],[2712,"“叫他来。”",0],[2714,"“他下午才放学。”",0],[2716,"外公闭上眼睛，过了一会儿又睁开。",0],[2718,"“来不及了。”他说。",0],[2720,"于韵的心一沉。",0],[2722,"“外公，你别胡说。”",0],[2724,"“我不胡说。”外公说，“我自己知道。”",0],[2726,"他伸出手，从枕头底下摸出一样东西。",0],[2728,"那是一块铜牌。",0],[2730,"很小，正面是校徽的式样，边缘一圈麦穗，中间一个“屏”字。",0],[2732,"“这个，”外公说，“给你哥。”",0],[2734,"于韵愣住了。",0],[2736,"“为什么给他？”",0],[2738,"“因为他不会问。”",0],[2740,"“什么意思？”",0],[2742,"外公看着她。",0],[2744,"“你太会问了。”他说，“你会问为什么，会问怎么办，会问然后呢。你哥不问。你哥拿到东西，往脖子上一挂，就完了。”",0],[2746,"于韵握着那块铜牌。",0],[2748,"“外公。”她说，“我不明白。”",0],[2750,"“你不明白最好。”外公说，“明白了，你就得管。”",0],[2752,"那天下午，姜和来了。",0],[2754,"他是被于韵打电话叫来的。他不知道外公要干什么，来了以后站在床边，手插在兜里，有点不自在。",0],[2756,"外公把铜牌递给他。",0],[2758,"“戴着。”",0],[2760,"“这什么？”",0],[2762,"“别问。”",0],[2764,"“值钱吗？”",0],[2766,"“不值钱。”",0],[2768,"“那你给我干什么？”",0],[2770,"“你别弄丢了。”外公说。",0],[2772,"姜和接过去，看了看，挂在脖子上，塞进领子里。",0],[2774,"“行。”他说，“我戴着。”",0],[2776,"他站了一会儿，觉得没意思，就出去了。",0],[2778,"于韵站在床边，看着他的背影。",0],[2780,"“外公。”她说，“为什么不给我？”",0],[2782,"外公没有说话。",0],[2784,"“我才是那个信你的人。”于韵说，“你说的每一句话我都记着。我录了音。我知道井里有东西，我知道它吃什么，我知道那三条规矩。”",0],[2786,"“所以不能给你。”",0],[2788,"“为什么？”",0],[2790,"外公看着她。",0],[2792,"“因为你信。”他说，“你信，你就会去。你会去，你就回不来。”",0],[2794,"于韵的眼泪掉下来。",0],[2796,"“那我哥呢？”",0],[2798,"“你哥不信。”外公说，“他不信，他就不会去。他不会去，他就能活。”",0],[2800,"他停了停。",0],[2802,"“至少能活到我死。”",0],[2804,"于韵没有说话。",0],[2806,"“韵韵。”外公说，“你答应我一件事。”",0],[2808,"“什么？”",0],[2810,"“别跟你哥说。”",0],[2812,"“为什么？”",0],[2814,"“因为他知道了，就会去。”外公说，“他这个人，嘴上浑，心里软。你要是告诉他，他脖子上挂着一把钥匙，他会觉得自己了不起。他会拿去跟人显摆，会去试，会去开门。”",0],[2816,"“他不会的。”",0],[2818,"“他会的。”外公说。",0],[2820,"于韵低下头。",0],[2822,"“你答应我。”",0],[2824,"“我答应。”",0],[2826,"外公闭上眼睛。",0],[2828,"那年冬天，外公走了。",0],[2830,"走的那天晚上，于韵守在床边。",0],[2832,"他最后说的话，她录了下来。",0],[2834,"不是故意的。她只是习惯性地按了录音键，因为她想把外公说的每一句话都留住。",0],[2836,"他说的最后一句是：",0],[2838,"“韵韵，你别学爷爷。”",0],[2840,"葬礼办得很简单。",0],[2842,"姜和来了，穿着一件黑外套，站在人群后面，手里拿着一支烟，没点。",0],[2844,"他哭了吗？",0],[2846,"于韵看了他一眼。",0],[2848,"他没哭。",0],[2850,"他只是站在那儿，看着外公的遗像，看了很久。",0],[2852,"葬礼结束以后，于韵走过去。",0],[2854,"“哥。”",0],[2856,"“嗯。”",0],[2858,"“外公给你的那块牌子。”",0],[2860,"“怎么了？”",0],[2862,"“你戴着吗？”",0],[2864,"姜和把领子扯开，给她看。",0],[2866,"铜牌贴在他锁骨上，被体温焐得发亮。",0],[2868,"“戴着呢。”他说，“老爷子给的，不敢不戴。”",0],[2870,"于韵看着那块铜牌。",0],[2872,"她张了张嘴。",0],[2874,"“哥。”",0],[2876,"“嗯？”",0],[2878,"“你……”",0],[2880,"她想起外公的话。",0],[2882,"“你别弄丢了。”",0],[2884,"姜和笑了。",0],[2886,"“丢不了。”他说，“我洗澡都戴着。”",0],[2888,"于韵把话咽回去了。",0],[2890,"从那以后，她开始注意姜和。",0],[2892,"她注意他上课睡觉，注意他转笔，注意他跟赵克胡说八道。",0],[2894,"她也注意到别的事。",0],[2896,"她注意到他的作文越来越空。",0],[2898,"她注意到他记不住同学的名字，有时候要问两遍。",0],[2900,"她注意到他有一次在食堂，站在窗口前面，站了很久，最后说“我不饿”。",0],[2902,"他明明饿。",0],[2904,"她给他发微信。",0],[2906,"“哥，你吃饭了吗？”",0],[2908,"“吃了。”",0],[2910,"“吃的什么？”",0],[2912,"“忘了。”",0],[2914,"她盯着那两个字，看了很久。",0],[2916,"那天晚上，她翻出外公的录音，从头听到尾。",0],[2918,"听到第三遍的时候，她听见了一句话。",0],[2920,"不是外公说的。",0],[2922,"是背景里的。",0],[2924,"很轻，很远，像从地板底下传上来的。",0],[2926,"那是一个声音，在念一个名字。",0],[2928,"两个字。",0],[2930,"她听了十几遍，才听清。",0],[2932,"她听完，坐在床上，手脚冰凉。",0],[2934,"她终于明白外公为什么说“你太会问了”。",0],[2936,"因为会问的人，会一直问下去。",0],[2938,"会问到最后。",0],[2940,"第二天，她给姜和发了一条微信。",0],[2942,"“哥，你晚上别转笔了。”",0],[2944,"“为啥？”",0],[2946,"“吵。”",0],[2948,"“行。”",0],[2950,"那天晚上，姜和没有转笔。",0],[2952,"他坐在最后一排靠门的位置，两只手放在桌上，看着黑板。",0],[2954,"于韵回头看了一眼。",0],[2956,"她看见他脖子上的那根黑绳，绳头塞在校服领子里。",0],[2958,"她转回去，低下头，写作业。",0],[2960,"她写了很久。",0],[2962,"写完之后，她在草稿纸的角上，写了一行很小的字。",0],[2964,"“如果我回不来，别让泽研看见我这样。”",0],[2966,"她把那张纸撕下来，折好，伺机塞进成汐的书包里。",0],[2968,"然后她开始等。",0],[2970,"等一个她知道自己会等到的晚上。",0]]},{"t":"第五章 · 自习","k":"main","m":"clock","d":"","f":0,"p":[[2974,"“坐吧。”成汐说。",0],[2976,"没有人动。",0],[2978,"“坐下。”她转过头，“现在，坐下。不要说话。不要看中间。把书打开。”",0],[2980,"“……看什么书？”赵克的声音发飘，“我他妈现在连自己叫什么都快忘了。”",0],[2982,"“随便看什么。”成汐说，“坐下。”",0],[2984,"椅子腿刮过地面的声音此起彼伏，稀稀拉拉，像一场下不完的雨。",0],[2986,"成汐坐回自己的位置。",0],[2988,"她的桌子和丹丹的桌子挨着，都在“口”字的东边，面朝中间。",0],[2990,"她把一本数学卷子摊开，笔握在手里。",0],[2992,"笔尖在纸上抖，抖出一小团墨。",0],[2994,"丹丹在旁边坐下，把草稿纸推过来一点。纸上写着一行字，字迹很潦草：",0],[2996,"“怎么办”",0],[2998,"成汐在下面写：",0],[3000,"“先活着。别看中间。”",0],[3002,"丹丹写：",0],[3004,"“泽研还在里面”",0],[3006,"成汐抬头看了一眼。",0],[3008,"泽研还跪在那儿，抱着于韵，脸埋在她的头发里。",0],[3010,"成汐写：",0],[3012,"“让她待一会儿”",0],[3014,"她把纸推回去。",0],[3016,"教室里安静下来。",0],[3018,"安静得能听见血滴在地板上的声音。",0],[3020,"一滴。",0],[3022,"又一滴。",0],[3024,"成汐不敢抬头。她盯着卷子上的第一道选择题，看了很久，发现自己一个字都没读进去。",0],[3026,"她的脑子里在数。",0],[3028,"三十一，减肖中，三十。减姜和，二十九。减于韵，二十八。减尹天高，二十七。",0],[3030,"可屏幕上写的是二十六。",0],[3032,"她抬起头，飞快地数了一遍。",0],[3034,"第一排，五个。第二排，五个。第三排，四个。第四排，五个。第五排，四个。最后一排，四个。",0],[3036,"二十七。",0],[3038,"她又数了一遍。",0],[3040,"二十七。",0],[3042,"屏幕上写着二十六。",0],[3044,"她把笔握紧了。",0],[3046,"她知道有一天她会习惯这种不对。她只是希望那天晚一点来。",0],[3048,"二十三点零五分。",0],[3050,"“课间休息！”广播戛然而止。",0],[3052,"成汐站起来。",0],[3054,"她绕过“口”字，走到泽研旁边，蹲在桌子外面。",0],[3056,"“泽研。”",0],[3058,"没有回应。",0],[3060,"“泽研，你得出来。”",0],[3062,"“她死了。”泽研说。",0],[3064,"“我知道。”",0],[3066,"“她昨天晚上还跟我说，等考完试，我们去吃火锅。”泽研抬起头，眼睛红肿得几乎睁不开，“她说她要吃三盘毛肚。”",0],[3068,"“我知道。”",0],[3070,"“她说她从来没吃过。她说她就是觉得名字好听。”",0],[3072,"成汐伸出手，放在她的肩膀上。",0],[3074,"“泽研，你听我说。”",0],[3076,"“你别碰她。”",0],[3078,"成汐把手收回来。",0],[3080,"“我不碰她。”她说。",0],[3082,"泽研看着她。",0],[3084,"“你已经在这儿坐了好长时间了。”成汐说，“你得起来。”",0],[3086,"“我不起来。”",0],[3088,"“为什么？”",0],[3090,"“因为她一个人在这儿。”",0],[3092,"成汐看着她。",0],[3094,"“泽研。”她说，“她兜里有东西。”",0],[3096,"泽研的肩膀僵了一下。",0],[3098,"“什么？”",0],[3100,"“你摸过。”成汐说，“我刚才看见你摸了。”",0],[3102,"泽研没有说话。",0],[3104,"“她兜里有什么？”",0],[3106,"泽研低下头。",0],[3108,"“手机。”她说。",0],[3110,"“什么手机？”",0],[3112,"“她爷爷留给她的。”泽研说，“她一直带着。她说里面有一段录音。”",0],[3114,"“给我。”",0],[3116,"“为什么？”",0],[3118,"“……”",0],[3120,"“好吧，我知道。也许它在你手里价值更大。”泽研说。",0],[3122,"她把手伸进袖子里。",0],[3124,"泽研从袖子里滑出一部手机，塞进她手心。",0],[3126,"那是一部很旧的按键机，塑料外壳磨得发白，屏幕只有拇指盖那么大。开机之后，桌面是一张照片：一个老人坐在藤椅上，笑得很拘谨。",0],[3128,"“别让别人看见。”泽研说。",0],[3130,"成汐把手机塞进裤腰，拉下校服下摆盖住。",0],[3132,"“起来。”她说，“你不能一直待在里面。”",0],[3134,"泽研最后看了一眼于韵，伸手把她额前的头发拨到一边。",0],[3136,"“她怕黑。”泽研说，“她从小就怕黑。”",0],[3138,"“我知道。”",0],[3140,"泽研没有站起来，低下头，把脸贴回于韵的头发上。",0],[3142,"“我待一会儿。”她说。",0],[3144,"“泽研。”",0],[3146,"“就一会儿。”",0],[3148,"成汐蹲在那儿，看着她的后背。",0],[3150,"她没有再劝。",0],[3152,"她站起来，走回自己的位置。",0],[3154,"坐下之后，她把两只手放在桌面上，十指交叉，很用力地握着。",0],[3156,"成汐低下头，把卷子往前推了推，装作在算题。",0],[3158,"她的左手伸到桌子底下，摸到裤腰，把那部手机又往里塞了塞。",0],[3160,"就在这时，她看见地上有一张纸。",0],[3162,"在“口”字的西南角，靠近后门的位置，有一张折叠的纸，一半压在门缝下面。",0],[3164,"成汐的心脏重重跳了一下。",0],[3166,"门缝。",0],[3168,"那条三毫米的缝。",0],[3170,"她慢慢站起来，弯着腰，装作去捡掉在地上的笔，一步一步挪过去。",0],[3172,"广播没有响。",0],[3174,"她蹲下，手指捏住那张纸的边角，往外抽。",0],[3176,"纸抽出来的时候，带着一点湿。她展开。",0],[3178,"纸是从作业本上撕下来的，边缘毛毛糙糙。上面写满了字，字很小，很密，是女生的字迹，写得很急，后面几行几乎连在一起：",0],[3180,"如果你看到这行字，说明我没来得及。\n\n门缝不能过纸。纸一碰就化成灰，我试过两次。\n\n外面有人在。走廊的灯会动，你盯着门缝底下看。\n\n后门边那个旧对讲别乱按。它能看见。\n\n姜和身上有一块铜牌，在他领子里。那是钥匙。它拿不走钥匙，所以它把钥匙和人一起锁在这儿。\n\n我不敢过去拿。他就靠在门边上，我一蹲下去，就没有人看得见我了。\n\n它叫不出自己的名字。我爷爷说，它被关着的时候，每天数外面的人。\n\n它不吃肉。它吃“谁在乎谁”。\n\n它不数张岚。我注意到它点到张岚就跳过去了。张岚自己好像意识到了。\n\n别给它名字。除非你愿意被忘掉。\n\n它怕人看着。你看着它，它就不能动。所以它要你们闭眼。\n\n我去拿钥匙。如果我回不来——\n\n别让泽研看见我这样。\n\n——于韵",1],[3208,"成汐捏着那张纸，蹲在地上，很久没有动。",0],[3210,"她抬头看向“口”字中间。",0],[3212,"于韵躺在那里，左胸上别着一枚普通的塑料校徽，是学校发的那种。",0],[3214,"那张纸是在门边捡到的。",0],[3216,"她死的时候，应该正蹲在门后，伸手去够姜和的衣领。",0],[3218,"而她的尸体，被搬到了教室正中间，摆给所有人看。",0],[3220,"成汐慢慢站起来，回到座位，把那张纸折好，塞进袜子里。",0],[3222,"她坐下，摊开卷子，笔尖落在纸上。",0],[3224,"她发现自己在抖，抖得连一个数字都写不直。",0],[3226,"“怎么样？”丹丹的纸上写着。",0],[3228,"成汐写：",0],[3230,"“她在找手机。”",0],[3232,"“手机？”",0],[3234,"“对。于韵的。”",0],[3236,"“为什么？”",0],[3238,"成汐没有回答。",0],[3240,"她只是把纸揉了，塞进口袋。",0],[3242,"二十三点十分，成汐站起来。",0],[3244,"她没有说话。她只是站起来，走到自己的椅子后面，把搭在椅背上的校服外套拿起来。",0],[3246,"然后她走进“口”字中间。",0],[3248,"教室里所有人都抬起头。",0],[3250,"她走到于韵旁边，蹲下去。",0],[3252,"于韵的脸朝着一边，一半埋在头发里。她的眼睛是睁着的。",0],[3254,"成汐伸出手，把她的眼睛合上。",0],[3256,"合不上。",0],[3258,"她又试了一次。",0],[3260,"还是合不上。",0],[3262,"她只好把外套展开，盖在她脸上。",0],[3264,"外套是深蓝色的，左胸上绣着学校的校徽。",0],[3266,"盖上去的时候，外套的一角滑下来，露出于韵的下巴。",0],[3268,"成汐把那个角掖好。",0],[3270,"然后她站起来，往回走。",0],[3272,"她回到座位，坐下。",0],[3274,"教室里很安静。",0],[3276,"然后，第二个人站起来了。",0],[3278,"是丹丹。",0],[3280,"她走到自己的座位边上，拿起外套，走到“口”字中间，蹲下去，把外套盖在于韵身上，压在第一件外套上面。",0],[3282,"第三个人站起来。",0],[3284,"第四个人。",0],[3286,"第五个。",0],[3288,"没有人说话。",0],[3290,"他们一个接一个地站起来，走到中间，蹲下去，把外套、毛衣、围巾，盖在 0,"屏幕上，红色的数字跳了一下。",0],[4162,"剩余人数：24。",0],[4164,"成汐盯着那个数字。",0],[4166,"三十一，减肖中，三十。减姜和，二十九。减于韵，二十八。减尹天高，二十七。减郑一鸣，二十六。减何雨，二十五。",0],[4168,"应该是二十五。",0],[4170,"她抬起头，数了一遍教室里的人。",0],[4172,"二十五。",0],[4174,"数字是对的。",0],[4176,"可她盯着屏幕上那个“24”，",0],[4178,"它少数了一个人。",0],[4180,"它从一开头就少数了张岚。",0],[4182,"她低下头，从口袋里摸出那张揉皱的纸——她刚才写“何”又揉掉的那张。纸上有她自己的字。",0],[4184,"她想了想，从笔袋里拿出一支圆珠笔。",0],[4186,"她在纸上写下第一个名字。",0],[4188,"成汐。",0],[4190,"然后是：",0],[4192,"丹丹。李景。泽研。赵克。卢依田。",0],[4194,"她写得很用力，纸的背面微微凸起。",0],[4196,"写完之后，她看着自己写的名单。",0],[4198,"还不够。她要写更多人。她要把这个班所有人刻在自己脑中，一个一个，记得清清楚楚。",0],[4200,"因为如果连她都忘了，就再没有人记得他们来过。",0],[4202,"零点四十分，成汐蹲在后门边上。",0],[4204,"教室的灯灭了一下。",0],[4206,"不到一秒，又亮了。",0],[4208,"又灭了一下。",0],[4210,"她抬起头。",0],[4212,"灯管一根一根横在梁上，白得刺眼。灭的那一下，整间屋子黑到底，连自己的手都看不见。",0],[4214,"三下。",0],[4216,"外面有人在按开关。这栋楼老旧，走廊和教室是一条线。",0],[4218,"线路是通的？成汐想。",0],[4220,"后门边的墙上挂着一个铁盒子。没有人知道是干什么的，它自始至终在那。学校的广播线从门框上头穿过去，一直串到走廊。",0],[4222,"于韵的纸条上写着：别乱按，它看得见。",0],[4224,"铁盒子上的指示灯微弱地闪了一下。成汐注意到了。",0],[4226,"两下，三下……",0],[4228,"外面有人吗。",0],[4230,"机器的开口处递出一张纸条：",0],[4232,"```“有人吗？我是肖中。”```",0],[4234,"铁盒子没有响声。",0],[4236,"成汐捂住嘴。警惕地向四周望了望。",0],[4238,"广播没有反应。黑暗中没人注意到这里。",0],[4240,"“汐”她输入自己的名字。",0],[4242,"“别怕。”纸条继续延申，“线路内外是通的，因为用的是铜线。它暂时看不见你们，现在没时间解释，门打不开。我在想办法。里面几个人。都还好吗。”",0],[4244,"说到“几个人”的时候，后半句已经散了一半。",0],[4246,"“还剩二十五个。”她飞速输入，“死了五个。”",0],[4248,"“姜和死了。何雨死了。于韵死了。还有郑一鸣。尹天高。”",0],[4250,"她想不起来何雨今天中午跟她说的最后一句话是什么了。",0],[4252,"门缝底下滚进来一样东西。",0],[4254,"一枚一块钱的铜币。",0],[4256,"硬币的边缘有一道新划的口子，用钥匙尖划的，很深的两个字：",0],[4258,"成汐。",0],[4260,"她盯着那两个字，眼泪掉在硬币上。",0],[4262,"三年了，他一直叫她班长。",0],[4264,"又滚进来两枚。",0],[4266,"一枚硬币，一个字：铜。",0],[4268,"一枚硬币，两个字：能过。",0],[4270,"她把三枚硬币排在膝盖前面，一枚一枚摆正。",0],[4272,"铁盒子里又有光亮，断断续续的。",0],[4274,"“时间不够了。你要撑住。”",0],[4276,"成汐点头。点完才想起他看不见。",0],[4278,"“谢谢”",0],[4280,"成汐坐在地上，手里攥着那枚硬币。",0],[4282,"她从笔袋里摸出圆规，又摸到腰上那串钥匙。最小的一把是铜的，磨得发亮。",0],[4284,"针尖按在铜面上，划不动。她用了很大的力气，才划出一道白印。",0],[4286,"四个字，她划了很久。",0],[4288,"不记得了。",0],[4290,"她把钥匙从门缝底下推出去。",0],[4292,"钥匙在水泥地上响了半声，停了。",0],[4294,"门缝外面安静了。",0],[4296,"安静到她把耳朵贴在门上，也只听得见自己咽口水的声音。",0],[4298,"过了很久，铁盒子响了一下。",0],[4300,"是一下电流声，很轻，像叹气。",0],[4302,"门缝外面，很久没有回应。",0],[4304,"整个教室又亮起来了，它夺回了教室的控制。",0]]},{"t":"插曲 · 何雨","k":"inter","m":"none","d":"","f":0,"p":[[4308,"半年前，四月。",0],[4310,"那天下午第三节是自习，窗外的香樟树刚开始落叶，风一吹，叶子贴着玻璃滑下去。",0],[4312,"何雨坐在第二排，卷子摊在桌上，一个字也没写。",0],[4314,"她在想一件事。",0],[4316,"上周的家长会，她爸没来。她妈来了，坐在最后一排，穿了件新买的米色外套，头发烫过，很整齐。",0],[4318,"家长会结束，她妈走到讲台边上，跟徐老师聊了十分钟。",0],[4320,"何雨站在走廊里，隔着窗户看。",0],[4322,"她看见她妈笑，看见她妈点头，看见她妈从包里拿出一个小本子，记东西。",0],[4324,"回家的路上，她妈说：“你们徐老师说你最近状态不好。”",0],[4326,"“没有。”",0],[4328,"“她说你上次月考退了六名。”",0],[4330,"“题难。”",0],[4332,"“题难大家都难。”她妈说，“你为什么退？”",0],[4334,"何雨没有说话。",0],[4336,"她妈开着车，眼睛看着前面。",0],[4338,"“你爸今天本来要来的。”她说，“临时有个会。”",0],[4340,"“我知道。”",0],[4342,"“他说了，等你高考完，带你去趟重庆。”",0],[4344,"“嗯。”",0],[4346,"“你别嗯。”她妈说，“你爸这个人，嘴上不说，心里急。他那个位置，多少人看着。你要是考不好，他脸上挂不住。”",0],[4348,"何雨看着窗外。",0],[4350,"红灯。",0],[4352,"车停下来。",0],[4354,"“妈。”她说，“如果我真的考不好。”",0],[4356,"她妈转过头。",0],[4358,"“你说什么？”",0],[4360,"“我说如果。”",0],[4362,"“没有如果。”她妈说，“你这话以后别在你爸面前说。”",0],[4364,"绿灯。",0],[4366,"车开了。",0],[4368,"那天晚上，何雨躺在床上，把这句话在心里翻来覆去地想。",0],[4370,"没有如果。",0],[4372,"她从小听到大的就是这四个字。",0],[4374,"小学的时候，她想学画画。她妈说，学那个干什么，没有用，把数学学好。",0],[4376,"初中的时候，她想进校羽毛球队。她爸说，女孩子打什么球，耽误学习。",0],[4378,"高一的时候，她喜欢一个男生。那个男生成绩不好。她妈说，你跟他来往，我就去学校找老师。",0],[4380,"她没有再喜欢过成绩不好的男生。",0],[4382,"她把所有的时间都用来做题。她做得很好。她是年级前十，是英语课代表，是范文的作者，是家长会上被点名表扬的那一个。",0],[4384,"她是她爸的骄傲。",0],[4386,"她也是她爸的一个项目。",0],[4388,"有时候她半夜醒来，会觉得自己像一个被人精心养护的东西。浇水，施肥，修剪，打药。所有人都在夸这棵树长得好。",0],[4390,"没有人问过这棵树想不想长在这儿。",0],[4392,"四月的那个下午，她终于写了一行字。",0],[4394,"“我不想”。",0],[4396,"她盯着那三个字看了很久，然后把纸揉了，塞进抽屉最里面。",0],[4398,"第二天早上，她六点起床，背单词，吃早饭，去学校。",0],[4400,"她考了年级第五。",0],[4402,"她爸在饭桌上说了一句“还行”。",0],[4404,"她把那两个字咽下去，咽了很多年。",0],[4406,"后来她认识了成汐。",0],[4408,"高一开学，她们做同桌。成汐话不多，做事很稳，班里的杂事全是她管。她管得很细，细到谁的值日生忘了擦黑板，她都能记住。",0],[4410,"何雨那时候觉得，这个人有点傻。",0],[4412,"管那么多干什么。又不加分。",0],[4414,"有一次，何雨忘带饭卡，成汐把自己的卡给她，说“你先用”。",0],[4416,"何雨说：“那你呢？”",0],[4418,"成汐说：“我带了面包。”",0],[4420,"那天中午，何雨在食堂看见成汐坐在角落里，啃一个很干的面包，一边啃一边看错题本。",0],[4422,"她走过去，把自己的餐盘放在她面前。",0],[4424,"“一起吃。”",0],[4426,"成汐抬头看她，愣了一下，笑了。",0],[4428,"那个笑很短，但很真。",0],[4430,"从那以后，她们一起吃饭，一起打水，一起在操场上绕圈背单词。",0],[4432,"何雨背得快，成汐背得慢。何雨就停下来等她。",0],[4434,"那时候她觉得自己找到了一个人。",0],[4436,"一个不用她优秀也可以待在一起的人。",0],[4438,"后来期末，她借了成汐的错题本。",0],[4440,"那本本子整理得极好。立体几何那一部分，每一道题都画了图，每一种辅助线都标了颜色。",0],[4442,"何雨翻着翻着，心里冒出一个念头。",0],[4444,"如果这本本子只有我有就好了。",0],[4446,"她撕了两页。",0],[4448,"撕的时候手在抖。撕完她把本子还回去，说“谢谢”，然后走开。",0],[4450,"成汐没有问。",0],[4452,"何雨知道她发现了。",0],[4454,"因为那之后，成汐还是跟她一起吃饭，一起打水，一起背单词，但是有一件事变了——她不再把错题本放在桌角了。她把它收进书包，拉上拉链。",0],[4456,"就这一件事。",0],[4458,"何雨注意到了。",0],[4460,"她想过很多次道歉。每一次都张不开嘴。",0],[4462,"因为道歉就等于承认。",0],[4464,"而她从小到大，最不能做的事就是承认。",0],[4466,"她爸教过她一句话：在外面，永远别认错。认了错，别人就会一直拿这件事说你。",0],[4468,"她把这句话记了很多年。",0],[4470,"现在她坐在这间教室里，听着那个声音念她的名字，十六票。",0],[4472,"她忽然想，如果那天她把那两页还回去，会不会不一样。",0],[4474,"大概不会。",0],[4476,"因为那两页不是原因。",0],[4478,"它们证明她这个人，从头到尾，都只会做一件事：抓住所有能抓住的东西，然后假装自己没有伸手。",0],[4480,"何雨站在那块地砖上，灯光开始闪。",0],[4482,"她想起她妈。",0],[4484,"她想起她妈那件米色的外套，想起她妈在家长会上记笔记的样子，想起她妈说“你要是考不好，你爸脸上挂不住”。",0],[4486,"她想，妈，我这次真的考不好了。",0],[4488,"她又想起成汐。",0],[4490,"想起那个啃干面包的下午，想起成汐抬头看她时那个很短的笑。",0],[4492,"她想说对不起。",0],[4494,"可她知道，成汐已经听不见了。",0],[4496,"因为成汐正在看着她，眼睛里全是别的东西。",0],[4498,"那是一种很奇怪的眼神。",0],[4500,"不是恨，不是怕。",0],[4502,"是“我知道”。",0],[4504,"何雨忽然明白了。",0],[4506,"成汐早就知道她会死。成汐在写她名字的时候就知道。",0],[4508,"而成汐还是写了。",0],[4510,"何雨笑了一下。",0],[4512,"她想，这才是这个班里最像她的人。",0],[4514,"她们两个，其实是一样的。",0],[4516,"都只会做一件事：抓住所有能抓住的东西，然后假装自己没有伸手。",0],[4518,"唯一的区别是，成汐抓的时候，手是抖的。",0]]},{"t":"第七章 · 接线","k":"main","m":"clock","d":"","f":0,"p":[[4522,"一点整。",0],[4524,"一体机亮起来。",0],[4526,"【接线】",0],[4528,"屏幕上原来的字退下去，换成一块米黄色的面板。",0],[4530,"像很多年前的老总机，一格一格，每一格下面悬着一盏小灯。",0],[4532,"一共二十四格。",0],[4534,"“外面的电话，会打进来。”屏幕说。",0],[4536,"“每通三十秒。”",0],[4538,"“面板会给你们号码。”",0],[4540,"“认得，就拨出去。”",0],[4542,"“拨错的，算冒认，记大过。”",0],[4544,"“三十秒没有人拨，记一次过。”",0],[4546,"“一个人记满三次，清出这个班。”",0],[4548,"教室里没有人说话。",0],[4550,"赵克张了张嘴：“手机不是没信号……”",0],[4552,"“不是手机。”杨枭说。",0],[4554,"他说完，就不说了。",0],[4556,"成汐数了一遍教室里的人。",0],[4558,"二十五。",0],[4560,"她又数了一遍面板。",0],[4562,"二十四格。",0],[4564,"她抬头，看最后面靠墙的那个位子。",0],[4566,"那个位子上坐着一个人，正在把校服袖口上的一根线头，一点一点地拽掉。",0],[4568,"后墙上挂着一部旧电话。",0],[4570,"铁壳子，听筒上落了一层灰。学校装了新的以后，它一直没拆，因为拆了要补墙。",0],[4572,"它响了。",0],[4574,"那响声很旧，一声一声，像从很多年前传过来的。",0],[4576,"屏幕上的第一盏灯亮了。",0],[4578,"格子下面跳出来一串数字，七位。",0],[4580,"“我爸一点交班。”杨枭站起来，“他每天一点给我打一个。”",0],[4582,"“这个点他不会打。”",0],[4584,"“他会。”杨枭说。",0],[4586,"他走到后墙，拿起听筒。",0],[4588,"“喂？”",0],[4590,"“……”",0],[4592,"杨枭扶着墙，没说话。",0],[4594,"“……”",0],[4596,"“爸。”杨枭说，“我妈三年前就走了。”",0],[4598,"“……”",0],[4600,"长久的安静很。像一台机器在重新算一道题。",0],[4602,"“你不是我爸。”杨枭说。",0],[4604,"“……”",0],[4606,"三十秒到了。",0],[4608,"听筒里“咔”的一声，线断了。",0],[4610,"灯灭下去。格子底下慢慢浮出两个字：杨枭。",0],[4612,"杨枭举着听筒，站了一会儿，才把它挂回去。",0],[4614,"挂得很轻，像怕吵醒什么。",0],[4616,"他走回来，坐下。椅子腿在地上刮出一声很长的响。",0],[4618,"“我爸不会忘。”他喃喃自语。",0],[4620,"“我妈的忌日，他每年都要喝多。喝多了就坐在那儿，跟我妈说话。”",0],[4622,"“他不会忘。”",0],[4624,"第二盏灯亮的时候，教室里所有的人，眼睛都看着那串数字。",0],[4626,"没有人接。",0],[4628,"八位。",0],[4630,"成汐不认识。",0],[4632,"她听见后面有人小声念：“这是我家……”",0],[4634,"那个人念到一半，又停住了，像是自己也不敢信。",0],[4636,"没有人站起来。",0],[4638,"数字底下，三十秒的圈一格一格地少。",0],[4640,"“是座机。”王策说，“现在谁家还装座机。”",0],[4642,"十二秒。",0],[4644,"二十秒。",0],[4646,"“记一次过。”屏幕说。",0],[4648,"灯灭了。格子底下浮出两个字：蒋文。",0],[4650,"蒋文坐在靠门那排，头低着。",0],[4652,"“我家那个座机。”他说，“三年前就拆了。”",0],[4654,"“号码我一直记得。”",0],[4656,"“我还能背出来。”",0],[4658,"他说完，把脸埋进胳膊里。",0],[4660,"第三盏灯亮。",0],[4662,"数字出来的时候，卢依田站起来了。",0],[4664,"她走到后墙，拿起听筒，动作很快。",0],[4666,"“喂？”",0],[4668,"“……”",0],[4670,"卢依田愣了一下。",0],[4672,"“姐。”她说，“是我。依田。”",0],[4674,"“……”",0],[4676,"“你妹妹。”",0],[4678,"“……”",0],[4680,"卢依田站在那儿，手还握着听筒。",0],[4682,"“姐。”她说，“你别开玩笑。”",0],[4684,"“……”",0],[4686,"“你去年还给我买了双鞋。”卢依田说，“六百八。你说我长得快，买大一号。”",0],[4688,"“……”",0],[4690,"“你说等我考上大学，你带我去看海。”卢依田的声音开始抖，“你说你攒了钱。”",0],[4692,"“……”",0],[4694,"电话挂了。",0],[4696,"计时停在那儿，停在 00:11。",0],[4698,"灯灭下去。格子底下浮出两个字：卢依田。",0],[4700,"然后又浮出四个小字：弃线，记过。",0],[4702,"卢依田慢慢转过身。",0],[4704,"她脸上没有表情。",0],[4706,"“她是我姐。”卢依田低下头，强忍泪水，“但是好像不记得我了。”",0],[4708,"教室里没有人说话。",0],[4710,"她走回座位，坐下。",0],[4712,"坐下以后，她把两只手放在桌面上，十指交叉，很用力地握着。",0],[4714,"第四盏灯亮。",0],[4716,"这一回，灯亮得很慢，像有人在犹豫要不要打这个电话。",0],[4718,"数字出来，八位。",0],[4720,"孙澜站起来。",0],[4722,"她坐在靠窗第三排，头发扎得很紧，额角有一绺碎头发，一直在往下掉。",0],[4724,"她唱歌好听。班里有事，起头都是她。",0],[4726,"她这半年总跟人说她妈忘事。",0],[472 ,[6287,"成汐已经闻了一夜，闻不出来了。可她知道那是什么味道。",0],[6289,"她看着肖中的脸。",0],[6291,"他的脸一点一点地白下去。",0],[6293,"他的嘴唇动了动。",0],[6295,"“这是……”",0],[6297,"“他们——”",0],[6299,"他的手在抖。",0],[6301,"他站在门口，看着这间教室。",0],[6303,"然后他低下头。",0],[6305,"成汐看见他的肩膀在抖。",0],[6307,"“肖中。”",0],[6309,"“嗯。”",0],[6311,"“你听着。”她说，“你现在不能哭。”",0],[6313,"“我知道。”",0],[6315,"“你哭，我们就都完了。”",0],[6317,"“我知道。”他说。",0],[6319,"他抬起头。",0],[6321,"他的眼睛是红的，但他没有哭。",0],[6323,"“还剩几个？”他问。",0],[6325,"“二十二。”",0],[6327,"“死了多少？”",0],[6329,"“九个。”",0],[6331,"肖中的喉结又动了一下。",0],[6333,"“都有谁？”",0],[6335,"成汐张开嘴。",0],[6337,"她想说名字。",0],[6339,"可她发现，她说的时候，要想一下。",0],[6341,"“姜和。”她说，“于韵。尹天高。郑一鸣。何雨。孙澜。赵克。李景。傅小满。”",0],[6343,"她说完，愣了一下。",0],[6345,"九个名字，她说得很顺。",0],[6347,"顺得像在念一份名单。",0],[6349,"她忽然明白，它已经开始吃她了。不是从今天早上开始。是从她第一次写名字开始。",0],[6351,"她把名字写下来，就是为了不忘。",0],[6353,"可她每写一遍，那些名字就离她远一点。",0],[6355,"像一件东西，你反复地摸，摸到最后，就把表面的花纹摸平了。",0],[6357,"“成汐。”肖中说。",0],[6359,"“嗯。”",0],[6361,"“你别怕。”",0],[6363,"“我不怕。”",0],[6365,"“你在抖。”",0],[6367,"成汐低下头，看着自己的手。",0],[6369,"她的手在抖。",0],[6371,"“我没事。”她说。",0],[6373,"门外，肖中往前迈了一步。",0],[6375,"“别动。”成汐说。",0],[6377,"她看见了。",0],[6379,"门框里有一层东西。",0],[6381,"不是黑的，是透明的。像一层静止的水膜，从门框的顶端一直垂到地面。走廊的光穿过它的时候会暗一下，瓷砖的花纹在水膜后面微微弯曲。",0],[6383,"“你别过来。”成汐说，“门框里有东西。”",0],[6385,"肖中停住了。他伸出手，手电往前照。",0],[6387,"光柱碰到那层膜的时候，散开了，像照进一团雾里。",0],[6389,"“钥匙呢？”他问。",0],[6391,"成汐把铜牌举起来。",0],[6393,"肖中的眼睛亮了一下。",0],[6395,"“递过来。”他说，“从底下，门缝。”",0],[6397,"成汐蹲下去。",0],[6399,"门开了一条二十公分的缝，底下的缝隙也跟着变宽了。她把铜牌贴在门槛上，往前推。",0],[6401,"铜牌在水泥地上滑出一点声音。",0],[6403,"滑到一半，停住了。",0],[6405,"那层水膜在门槛的位置变得很稠，像糖浆。铜牌卡在那儿，前进不了，也退不回来。",0],[6407,"“推。”肖中说。",0],[6409,"成汐用两根手指顶着铜牌，往前送。",0],[6411,"指尖碰到了那层膜。",0],[6413,"一瞬间，她的手指失去了知觉。不是冷，是“没有”——像那两根手指从来没有长在她手上。",0],[6415,"她猛地缩回手。",0],[6417,"手指还在，能动，能动，可是没有感觉，摸自己的脸像摸别人的脸。",0],[6419,"“成汐！”丹丹在身后叫她。",0],[6421,"“我没事。”",0],[6423,"她把袖子拉下来，垫在手指上，重新去顶那块铜牌。",0],[6425,"铜牌还是不动。",0],[6427,"“用这个。”",0],[6429,"李景走过来。",0],[6431,"他手里拿着一张对折的纸。",0],[6433,"“夹在纸里推。”他说，“纸软，膜咬不住。”",0],[6435,"成汐看了他一眼。",0],[6437,"李景的脸很白，眼睛下面是两团很深的青。他这五个小时一直坐在那儿写字，成汐不知道他写了多少张。",0],[6439,"“你的纸……”",0],[6441,"“不重要。”李景把纸展开，把铜牌包在里面，重新折好，“推。”",0],[6443,"成汐把纸包往前推。",0],[6445,"纸角碰到水膜。",0],[6447,"没有凹。纸的黑边亮了一下，像被火从里面点着，一点一点地变成灰，灰往四边散，散到一半就散了。",0],[6449,"铜牌从灰里露出来，往前滑，滑过那道膜，滑到门槛外面，停住了。",0],[6451,"肖中的手够不着。",0],[6453,"李景蹲下去，把手伸进那道缝里。",0],[6455,"“别——”成汐说。",0],[6457,"他的指尖碰到铜牌，往前一推。",0],[6459,"铜牌滚到肖中脚边。",0],[6461,"然后他的手没有收回来。",0],[6463,"不是不收，是收不回来。",0],[6465,"那层膜在他手腕的位置变得很稠，像糖浆，像胶。他的小臂一点一点变白，从手腕到手肘，白得像蜡。",0],[6467,"他没有叫。",0],[6469,"他转过头，看了成汐一眼。",0],[6471,"“帮我寄了。”他说。",0],[6473,"“李景——”",0],[6475,"“信在我桌子里。”他说，“最上面那本练习册里。”",0],[6477,"“李景，你把手——”",0],[6479,"“班长。”他说，“我妈叫周秀兰。”",0],[6481,"成汐愣住了。",0],[6483,"“你别让她等。”他说，“你跟她说，我不回去了。”",0],[6485,"然后他的肩膀塌下去。",0],[6487,"成汐伸手去抓他，抓到的是一把空气。",0],[6489,"门槛上什么都没有。",0],[6491,"连血都没有。",0],[6493,"“李景！”",0],[6495,"教室里没有人应。",0],[6497,"成汐跪在门槛前，两只手撑在地上，喘气。",0],[6499,"她抬起头。",0],[6501,"肖中还蹲在门外，手里捏着那块铜牌。",0],[6503,"铜牌的边上粘着一小角纸，烧黑了，只剩下半个字。",0],[6505,"肖中低头看着那半个字。",0],[6507,"看了两秒。",0],[6509,"“拿到了。”他说，“我这就下去。”",0],[6511,"“肖中。”",0],[6513,"“嗯。”",0],[6515,"“井盖在槐树底下。”成汐说，“钥匙插进去，转两圈。转完以后，你要说话。”",0],[6517,"“说什么？”",0],[6519,"“说我的名字。”",0],[6521,"肖中愣住了。",0],[6523,"“你的名字？”",0],[6525,"“对。”成汐说。",0],[6527,"门缝外面安静了。",0],[6529,"肖中看着她，慢慢地，他的表情变了。",0],[6531,"“成汐。”",0],[6533,"“你听着。”成汐说，“它没有名字。没有名字的东西，谁也喊不住。你给它一个名字，它就被喊住了。它会被关回去，关二十年。”",0],[6535,"“那给名字的人呢？”",0],[6537,"成汐没有回答。",0],[6539,"“成汐。”肖中的声音开始抖，“你告诉我，给名字的人会怎么样。”",0],[6541,"“会没事的。”她说。",0],[6543,"“你骗我。”",0],[6545,"“我没骗你。”",0],[6547,"“你在骗我！”肖中往前冲了一步，撞在那层膜上。",0],[6549,"膜晃了一下，像水面被石头砸了一下。他的半张脸陷进去，五官扭曲，嘴巴张得很大，却发不出声音。",0],[6551,"成汐扑过去，隔着膜抓住他的衣领，把他往后推。",0],[6553,"“退回去！”",0],[6555,"肖中被推得后退了两步，跪在地上，大口喘气。他的左脸有一片皮肤变得很白，像被水泡过。",0],[6557,"“你别过来。”成汐说，“你听着，天亮之前，你必须在井边。”",0],[6559,"“为什么是你。”肖中说。",0],[6561,"“因为我是班长。”",0],[6563,"“这他妈算什么理由！”",0],[6565,"“因为剩下的人里，只有我知道该怎么做。”成汐说，“而且……”",0],[6567,"她回头看了一眼。",0],[6569,"丹丹站在三张桌子以外，看着她。",0],[6571,"“而且我已经把该断的都断了。”成汐说。",0],[6573,"她转回来。",0],[6575,"“肖中，三分钟快到了。”",0],[6577,"门开始合。",0],[6579,"“成汐！”",0],[6581,"“你听着。”她把脸贴在门缝上，“如果我出不去，你告诉丹丹——”",0],[6583,"门合到只剩十公分。",0],[6585,"“告诉她什么？”",0],[6587,"成汐张开嘴。",0],[6589,"她想了很久。",0],[6591,"她想到很多话。对不起。那三分钟是假的。还有——你每天跟在我后面骑到第二个红绿灯，我其实知道，我每次都故意在那儿多站一会儿。",0],[6593,"一句也说不出来。",0],[6595,"门合到只剩五公分。",0],[6597,"“对不起。”她说。",0],[6599,"肖中愣住了。",0],[6601,"“什么？”",0],[6603,"门合上了。",0],[6605,"走廊的光被切断。",0],[6607,"教室里重新只剩下白花花的灯管。",0],[6609,"成汐跪在门后，额头抵着门板。",0],[6611,"门外面，肖中的声音隔着门板传进来，很闷，听不清在说什么。",0],[6613,"她听见他砸门，砸了很久，越来越远。",0],[6615,"三点零二分，她站起来。",0],[6617,"她走到李景的座位旁边。",0],[6619,"桌子还在，椅子还在，桌上摊着他写了一整夜的纸。纸上的字迹密密麻麻，从第一行到最后一行，全是同一个开头：",0],[6621,"“妈。”",0],[6623,"成汐走过去，拿起最上面那张。",0],[6625,"“妈，我这次月考进步了十二名。你别哭。”",0],[6627,"她翻到第二张。",0],[6629,"“妈，你别哭。”",0],[6631,"第三张。",0],[6633,"“妈，你别哭。”",0],[6635,"她一张一张地翻。二十几张纸，每一张都是这三个字。",0],[6637,"最后一张的背面，写着两行小字，笔画很轻，像写的人已经没什么力气了：",0],[6639,"“我不知道该写什么。我其实没有什么想说的。我就是想让你知道，我这次进步了。”",0],[6641,"成汐把纸叠好，塞进衣服里。",0],[6643,"她抬起头。",0],[6645,"教室前方那块地砖上，多了一小片暗色的痕迹。",0],[6647,"屏幕上，红色的数字跳了一下。",0],[6649,"剩余人数：21。",0],[6651,"三点零五分，成汐在门边找到了傅小满。",0],[6653,"她趴在门槛前，右手伸得很直，五指张开，像要去够什么东西。",0],[6655,"她的姿势和姜和一模一样。",0],[6657,"成汐蹲下去，把她翻过来。",0],[6659,"她的眼睛睁着。脸上没有痛苦，只有一种很奇怪的表情——像是刚刚明白了一件事，还来不及害怕。",0],[6661,"她的手心是白的。",0],[6663,"不是皮肤白，是整只手掌都褪了色，白得像蜡，像被水泡了很久的纸。",0],[6665,"成汐把她的手从门槛上掰开。",0],[6667,"掰的时候，指节发出一点声音。",0],[6669,"她替她把眼睛合上。合不上。她又试了一次，还是合不上。",0],[6671,"她只好脱下校服外套，盖在她脸上。",0],[6673,"“班长。”",0],[6675,"王策走过来。",0],[6677,"他的手里拿着那个小本子，翻了翻。",0],[6679,"“我算了一下。”他说，“从停电到现在，六个小时。死了九个。”",0],[6681,"“我知道。”",0],[6683,"“还剩下二十个。”王策说，“天亮了，我们还能剩几个？”",0],[6685,"成汐看着他。",0],[6687,"“你想说什么？”",0],[6689,"“我想说，”王策说，“你得告诉我们。”",0],[6691,"“告诉你们什么？”",0],[6693,"“你在门那边跟他说的那些。”王策说，“钥匙，井，名字。你说了。我们听得见。”",0],[6695,"成汐站起来。",0],[6697,"“你想知道什么？”",0],[6699,"“全部。”",0],[6701,"成汐看着他，看了很久。",0],[6703,"然后她说：",0],[6705,"“坐下。我说。”",0]]},{"t":"第十章 · 说","k":"main","m":"clock","d":"","f":0,"p":[[6709,"三点零五分，二十个人围坐在“口”字形的桌子后面。",0],[6711,"成汐站在讲台边上。",0],[6713,"“我说。”她说，“你们听。听完了，想问什么问什么。”",0],[6715,"“第一，我们在什么地方。”",0],[6717,"她抬起头。",0],[6719,"“我们还在这间教室里。可这间教室，被从学校里拿出去了。”",0],[6721,"“什么意思？”蒋文说。",0],[6723,"“意思是，门外面不是走廊。”成汐说，“门外面是别的地方。昨天晚上肖中在走廊里，可他推不开这扇门。我在里面推，也推不开。我们两边都在推，谁都推不动。”",0],[6725,"“那刚才门怎么开了？”",0],[6727,"“不知道。”成汐说，“他一定在外面经历了许多。”",0],[6729,"教室里安静了一下。",0],[6731,"“第二，它是什么。”",0],[6733,"成汐把于韵的纸条从袜子里拿出来，展开。",0],[6735,"“它没有身体，没有行踪，没有名字。”",0],[6737,"“它住在这所学校底下一口井里。井是一九八五年建校的时候发现的。井口压着一个铜匣子。匣子上刻着它的名字。”",0],[6739,"“它吃人和人之间的东西。”",0],[6741,"“什么东西？”",0],[6743,"“记忆。”成汐说，“感情。你对一个人的印象。你想起他的时候，心里动的那一下。”",0],[6745,"“它吃得很少。”她说，“它从来不一次吃完。它吃一口，你就少一点。你不会觉得不对，你只会觉得有点空。”",0],[6747,"“姜和就是被它吃了三年。”成汐说，“所以你们记不住他。”",0],[6749,"教室里有人吸了一口气。",0],[6751,"“第三，它为什么要在今天晚上动手。”",0],[6753,"成汐把那张纸条折好，塞回袜子里。",0],[6755,"“因为钥匙。”",0],[6757,"“什么钥匙？”",0],[6759,"“姜和脖子上那块铜牌。”成汐说，“背面刻着两个字。敬堂。”",0],[6761,"“那是他外公的名字。他外公叫于敬堂，守了这口井三十年。铜牌是他外公留给他的，他戴了三年，不知道那是什么。”",0],[6763,"“铜是惰性的，它碰不了。所以它把姜和和钥匙一起锁在这儿，让谁也够不着。”",0],[6765,"“钥匙现在已经出去了。”成汐说，“在肖中手里。”",0],[6767,"“然后呢？”",0],[6769,"“然后他要下井。”成汐说，“把钥匙插进匣子，转两圈。”",0],[6771,"“转了会怎么样？”",0],[6773,"“匣子会开。”",0],[6775,"“开了以后呢？”",0],[6777,"成汐停了一下。",0],[6779,"“开了以后，要有人把名字给它。然后喊它的名字。”",0],[6781,"教室里没有人说话。",0],[6783,"“喊了会怎么样？”",0],[6785,"“喊了，它就被关回去。”成汐说，“关二十年。”",0],[6787,"“喊的人呢？”",0],[6789,"成汐没有回答。",0],[6791,"“那给名字的人呢？”",0],[6793,"“都会消失。”成汐说。",0],[6795,"“什么叫没了？”",0],[6797,"“不只是死。”成汐说，“是没人记得他。他妈妈不记得生过他。他同桌不记得跟他借过笔。他的名字会从名册上消失。”",0],[6799,"教室里安静得很久。",0],[6801,"然后袁冰站起来。",0],[6803,"“你早就知道这些。”",0],[6805,"“昨天晚上才知道。”",0],[6807,"“你怎么知道的？”",0],[6809,"“于韵的纸条。”成汐说，“我在门缝底下捡到的。”",0],[6811,"“那你为什么不告诉我们？”",0],[6813,"“我告诉了。”成汐说，“我告诉了肖中。我让他去井边。”",0],[6815,"“我是说告诉我们。”袁冰说，“告诉我们这些人。”",0],[6817,"“告诉了你们，你们能做什么？”",0],[6819,"“我们能想办法！”",0],[6821,"“什么办法？”",0],[6823,"袁冰张了张嘴。",0],[6825,"“我们人多。”他说，“我们可以一起想。”",0],[6827,"“想什么？”成汐说，“想怎么把门撬开？想怎么把它打死？它没有身体。”",0],[6829,"“那也不能什么都不说！”",0],[6831,"“我说了。”成汐说，“我现在就在说。”",0],[6833,"袁冰站在那儿，胸口起伏。",0],[6835,"“成汐。”卢依田开口了。",0],[6837,"“嗯。”",0],[6839,"“你算过吗？”",0],[6841,"“算什么？”",0],[6843,"“算我们还能活几个。”",0],[6845,"成汐看着她。",0],[6847,"“算过。”",0],[6849,"“几个？”",0],[6851,"“我不知道。”成汐说，“我只知道，天亮了，门会开。门开了，能给几个名额，它没说。”",0],[6853,"“那我们现在怎么办？”",0],[6855,"“等。”",0],[6857,"“等什么？”",0],[6859,"“等天亮。”成汐说，“等肖中下井。”",0],[6861,"“他要是不下呢？”",0],[6863,"“他会下。”",0],[6865,"“你怎么知道？”",0],[6867,"成汐想起那张纸条。",0],[6869,"“因为他说他会。”",0],[6871,"教室里没有人说话。",0],[6873,"“成汐。”王策说。",0],[6875,"“嗯。”",0],[6877,"“你刚才说，喊名字的人会没了。”",0],[6879,"“对。”",0],[6881,"“那肖中知道吗？”",0],[6883,"“知道。”",0],[6885,"“他还去？”",0],[6887,"“他去。”",0],[6889,"王策低下头。",0],[6891,"“我做不到。”他说。",0],[6893,"“我知道。”成汐说，“大部分人都做不到。”",0],[6895,"“那你呢？”王策抬起头，“你做得到吗？”",0],[6897,"成汐看着他。",0],[6899,"“我做得到。”",0],[6901,"“为什么？”",0],[6903,"“因为我是班长。”",0],[6905,"“这他妈算什么理由。”",0],[6907,"“这就是理由。”成汐说，“三年了，所有的事都是我最后签字。作业收齐了没有，我签。值日表贴了没有，我签。谁迟到了，我签。”",0],[6909,"她顿了顿。",0],[6911,"“最后这一件，也我签。”",0]]},{"t":"第十一章 · 账本","k":"main","m":"clock","d":"","f":0,"p":[[6915,"三点二十五分，王策把那个小本子摊在桌上。",0],[6917,"“我记了三年。”他说。",0],[6919,"教室里剩下十九个人，围坐在“口”字形的桌子后面。",0],[6921,"“记什么？”成汐问。",0],[6923,"“违纪。”王策说，“谁迟到，谁讲话，谁没交作业，谁上课睡觉。我都记。”",0],[6925,"他翻开第一页。",0],[6927,"“我一开始是想当班长。”他说，“高一开学，徐老师问谁当过班长，我没敢举手。你举了。我那时候不服气，我想，我要是把班里的事都记下来，老师就会知道我比你细心。”",0],[6929,"“后来呢？”",0],[6931,"“后来我就记上瘾了。”王策说，“我每天记，记完了心里舒服。我觉得我知道所有人的事，我比你们都高一等。”",0],[6933,"他翻着本子。",0],[6935,"“现在他们都死了。”",0],[6937,"教室里没有人说话。",0],[6939,"“我想烧了它。”王策说，“但是我不敢。”",0],[6941,"“为什么不敢？”",0],[6943,"“因为我烧了，就没人记得他们干过什么了。”他说，“我记的都是坏事。可坏事也是事。”",0],[6945,"成汐看着他。",0],[6947,"“念念。”她说。",0],[6949,"“什么？”",0],[6951,"“念念他们干过什么。”成汐说，“不管好事坏事。念出来。”",0],[6953,"王策看着她。",0],[6955,"“你确定？”",0],[6957,"“确定。”",0],[6959,"他低下头，翻到第一页。",0],[6961,"“九月十二日。”他念，“姜和迟到七分钟。理由：公交车晚点。”",0],[6963,"他停了停。",0],[6965,"“我查了公交时刻表。他没撒谎。”",0],[6967,"成汐闭上眼睛。",0],[6969,"“十月三日。”王策念，“于韵帮我把掉在地上的作业本捡起来。我没说谢谢。”",0],[6971,"“十月八日。何雨借我一支笔。我说不用还，她还是还了。她把笔放在我桌上，说‘你的笔好写’。”",0],[6973,"“十月十五日。赵克在楼道里打球，打碎了消防栓的玻璃。姜和替他顶了罪。我知道不是姜和干的，我没说。”",0],[6975,"王策的声音停了一下。",0],[6977,"他说，“因为我想看姜和被记过。他成绩差，他整天嘻嘻哈哈，我想看他倒霉。”",0],[6979,"他翻了一页。",0],[6981,"“十一月二日。李景请了三天假。我记了他旷课。后来徐老师把记录划了，说算病假。我不知道他为什么请假。我也没问。”",0],[6983,"“十一月十一日。郑一鸣上课偷吃辣条，被我发现。我记了他。他求我别记，说他胃不好，不吃东西会疼。我还是记了。”",0],[6985,"“十二月五日。孙澜唱歌，唱得很好。我在本子上写‘晚自习唱歌，影响纪律’。其实那天是课间。”",0],[6987,"他翻到后面。",0],[6989,"“三月十七日。尹天高的胳膊上有淤青。我看见了。我写在‘个人观察’那一栏。我写的是‘疑似打架，需关注’。”",0],[6991,"“我没写‘疑似家暴’。”王策说，“因为写家暴，我要报。报了，我要出面。我不想出面。”",0],[6993,"教室里很安静。",0],[6995,"“四月二十日。莫小北在厕所哭。我听见了。我在门口站了一会儿，走了。”",0],[6997,"“五月六日。傅小满的校服破了，她自己缝的，缝得很丑。我在本子上写‘仪容不整’。”",0],[6999,"他停下来。",0],[7001,"“五月十九日。杨枭的爸爸来送东西，站在校门口，等了两个小时。杨枭没下去。我问他为什么不去，他说‘他等一会儿就走了’。”",0],[7003,"“他爸等到天黑才走。”",0],[7005,"王策合上本子。",0],[7007,"“六月一日。张岚……”",0],[7009,"他停住了。",0],[7011,"“张岚什么？”",0],[7013,"“张岚没交作业。”王策说，“我记了她。第二天她又交了，我就划了。”",0],[7015,"他抬起头。",0],[7017,"“我记了她两年。”他说，“我一次都没跟她说过话。”",0],[7019,"成汐看着他。",0],[7021,"“王策。”",0],[7023,"“嗯。”",0],[7025,"“你记这些，是为了什么？”",0],[7027,"“为了证明我比你们强。”王策说。",0],[7029,"“现在呢？”",0],[7031,"“现在我知道了。”他说，“我记的不是你们。我记的是我自己。”",0],[7033,"他把本子推到桌子中间。",0],[7035,"“你们要看吗？”他问，“你们想知道自己在我本子上是什么样吗？”",0],[7037,"没有人说话。",0],[7039,"“看吧。”成汐说，“都看看。”",0],[7041,"本子在桌子上传了一圈。",0],[7043,"有人看了很久。有人只看了一页就合上。有人一边看一边哭。",0],[7045,"赵克已经死了，他的那一页被人念了出来。",0],[7047,"“赵克，上课睡觉，十七次。赵克，作业未交，二十三次。赵克，借钱不还，一次。”",0],[7049,"念到这里，蒋文停了下来。",0],[7051,"“他借我二十块钱。”蒋文说，“他上个月还了。他说‘哥们儿，我这人借钱不还，但是你的我肯定还’。”",0],[7053,"“他还了吗？”",0],[7055,"“还了。”蒋文说，“他分四次还的。五块，五块，五块，五块。”",0],[7057,"他把本子合上。",0],[7059,"“我那时候还嫌他烦。”他说，“我说你一次还完不行吗。他说他一次拿不出二十。”",0],[7061,"教室里没有人说话。",0],[7063,"“他爸不给他钱。”蒋文说，“他爸说，你要钱干什么，你又考不上大学。”",0],[7065,"成汐低下头。",0],[7067,"她想起赵克站在那块地砖前面，回过头，看了一眼最后一排靠门的位置。",0],[7069,"她想起他说“你替我记得”。",0],[7071,"“王策。”她说。",0],[7073,"“嗯。”",0],[7075,"“本子给我。”",0],[7077,"王策把本子递过来。",0],[7079,"成汐翻到最后。",0],[7081,"最后一页是空白的。",0],[7083,"她从笔袋里拿出笔，在空白页上写下第一行字。",0],[7085,"“姜和。会转笔。替赵克顶过一次罪。借过赵克二十块钱，赵克没还。”",0],[7087,"她停了一下。",0],[7089,"然后她写第二行。",0],[7091,"“于韵。语文课代表。字写得好。作文《故乡》满分。怕黑。”",0],[7093,"第三行。",0],[7095,"“尹天高。记性好，背单词快。胳膊上有淤青。他说他运气一向差。”",0],[7097,"第四行。",0],[7099,"“郑一鸣。胃不好。偷吃辣条。吐血的时候，看着墙上的灯。”",0],[7101,"第五行。",0],[7103,"“何雨。英语全班第一。作文被印成范文。念到一半笑场。抄过我的错题本，少还两页。”",0],[7105,"她写得很慢。",0],[7107,"每写一个，她都要停下来，想很久。",0],[7109,"“成汐。”丹丹在旁边说，“你写这个干什么？”",0],[7111,"“因为他们在王策的本子上只有坏事。”成汐说，“我得给他们补上好事。”",0],[7113,"她写到第十一行的时候，笔尖断了。",0],[7115,"她换了一支笔，继续写。",0],[7117,"写完最后一个字，她把本子合上。",0],[7119,"“这个本子，”她说，“谁也别烧。”",0],[7121,"“为什么？”王策问。",0],[7123,"“因为它是这个班里唯一一本真的东西。”成汐说，“你们的作业是抄的，你们的检讨是编的，你们的成绩是排名排出来的。只有这个本子，记的都是真事。”",0],[7125,"她把本子递给王策。",0],[7127,"三点三十分。",0],[7129,"成汐站起来，走到窗边。",0],[7131,"窗外那片黑，好像淡了一点。",0],[7133,"不是亮。是黑得不那么实了，像一块布，被水浸过，透出一点底下的颜色。",0],[7135,"“天快亮了。”她说。",0],[7137,"没有人回答。",0],[7139,"“还有两个半小时。”她说，“都别睡。”",0]]},{"t":"第十二章 · 名单（徐老师视角）","k":"main","m":"clock","d":"","f":0,"p":[[7143,"三点半，我坐在三楼走廊的窗台上。",0],[7145,"楼下什么都没有。不是黑，是空。操场、旗杆、围墙、路灯，全都还在，只是没有光。像一张曝光失败的照片。",0],[7147,"我把本子摊在膝盖上。",0],[7149,"那是我今晚带的第三个本子。前两个写满了，这一个还剩一半。第一页到第十七页，是这六年来的名字。每年五个，写得很整齐，一年一页，页脚标着年份。",0],[7151,"二〇一四：五个。",0],[7153,"二〇一五：五个。",0],[7155,"……",0],[7157,"二〇一九：五个。",0],[7159,"二〇二〇：五个。",0],[7161,"今年这一页，我写了四个。",0],[7163,"第五个还空着。",0],[7165,"我看着那个空，看了很久。",0],[7167,"“徐老师。”",0],[7169,"我抬起头。",0],[7171,"肖中站在楼梯口。",0],[7173,"他的脸上有一片白，像被水泡过。手里攥着那块铜牌。",0],[7175,"“你手里是什么？”我问。",0],[7177,"“钥匙。”他说，“李景递出来的。”",0],[7179,"我点点头。",0],[7181,"“李景呢？”",0],[7183,"他没有说话。",0],[7185,"“我知道了。”我说。",0],[7187,"他把手摊开，把那块铜牌托在掌心。",0],[7189,"“背面有字。”他说，“敬堂。”",0],[7191,"“我知道。”",0],[7193,"“你早就知道。”",0],[7195,"“我知道。”",0],[7197,"他走过来，站在我面前。",0],[7199,"“你手里那个本子是什么？”",0],[7201,"我没有藏。",0],[7203,"我把本子递给他。",0],[7205,"他接过去，翻开。",0],[7207,"他看得很慢。一页一页地翻。",0],[7209,"翻到第三页的时候，他的手开始抖。",0],[7211,"“这些名字。”他说。",0],[7213,"“都是我写的。”",0],[7215,"他抬起头。",0],[7217,"“什么？”",0],[7219,"“每年五个。”我说，“我写的。”",0],[7221,"他看着我，像看一个不认识的人。",0],[7223,"“为什么？”",0],[7225,"“你坐下。”我说。",0],[7227,"“我问你为什么！”",0],[7229,"“你坐下。”我说，“坐下，我告诉你。”",0],[7231,"他站着，胸口起伏。",0],[7233,"然后他坐下了。",0],[7235,"坐在我旁边的窗台上。",0],[7237,"“二〇一四年。”我说，“那年我刚带完第一届。学校要合并，高中部撤掉，改成职高的分校。三千个学生，学籍转到职高。”",0],[7239,"“职高也是学校。可那三千个孩子，有八百个能考上本科。转过去，一个都考不上。”",0],[7241,"我看着窗外那片空。",0],[7243,"“那年我在教务处帮忙。校长把一份文件放在我面前，说，只要签个字，学校就能保住。他说，只要五个孩子。”",0],[7245,"“五个孩子换三千个。”",0],[7247,"“对。”",0],[7249,"“你签了。”",0],[7251,"“我签了。”",0],[7253,"他低下头，看着本子。",0],[7255,"“第一个名字。”他说，“张建国。一九九八年生。”",0],[7257,"“那是我第一届的学生。”我说，“他复读了一年，还坐在我班里。他爸在外地打工，他妈改嫁了。他住校，一年回一次家。”",0],[7259,"“他后来呢？”",0],[7261,"“他考上了。”我说，“二本。毕业后去了南方。”",0],[7263,"“他还活着？”",0],[7265,"“活着。”我说，“他只是……不会再回来了。”",0],[7267,"肖中把本子合上。",0],[7269,"“所以你就一直写。”",0],[7271,"“一直写。”",0],[7273,"“写了六年。”",0],[7275,"“六年。”",0],[7277,"“三十个。”",0],[7279,"“三十个。”",0],[7281,"他抬起头。",0],[7283,"“你记得他们吗？”",0],[7285,"“记得。”我说，“每一个都记得。我记得他们的名字，记得他们的脸，记得他们坐在第几排。”",0],[7287,"“那你为什么——”",0],[7289,"“因为我怕忘了。”我说。",0],[7291,"他愣住了。",0],[7293,"“我怕我忘了他们。”我说，“我忘了，就真的没人记得了。”",0],[7295,"“你记得，”他说，“它就吃得到。”",0],[7297,"我看着他。",0],[7299,"“我知道。”",0],[7301,"他站起来。",0],[7303,"“你知道你还记？”",0],[7305,"“我记了六年。”我说，“我每天记。我每年在他们生日那天，在本子上写一遍他们的名字。我以为我在纪念他们。”",0],[7307,"我低下头，看着自己的手。",0],[7309,"“后来我才明白，我在喂它。”",0],[7311,"走廊里安静下来。",0],[7313,"“今年这一页。”肖中说，“第五个为什么空着？”",0],[7315,"“因为还没定。”",0],[7317,"“还要定？”",0],[7319,"“每年都要定。”我说，“不定，它就会自己挑。它自己挑，就不止五个。”",0],[7321,"他把本子翻开，翻到最后一页。",0],[7323,"“前四个是谁？”",0],[7325,"“你自己看。”",0],[7327,"他看。",0],[7329,"“姜和。”他念。",0],[7331,"“第一个。”",0],[7333,"“于韵。”",0],[7335,"“第二个。”",0],[7337,"他停住了。",0],[7339,"“于韵不在名单上。”我说，“于韵是后来补上去的。”",0],[7341,"“为什么？”",0],[7343,"“因为她哥哥在名单上。”我说，“它吃了姜和三年，吃不干净。它要一个添头。”",0],[7345,"肖中的手抖了一下。",0],[7347,"“第三个。”他念，“傅小满。”",0],[7349,"“她奶奶耳朵背。”我说，“她父母在国外，一年回来一次。”",0],[7351,"“第四个。”他念。",0],[7353,"他停住了。",0],[7355,"“王策。”",0],[7357,"“他爸妈天天吵架。”我说，“他爸不管他，他妈管不了他。”",0],[7359,"肖中把本子放下。",0],[7361,"“第五个呢？”",0],[7363,"我没有说话。",0],[7365,"“徐老师。”他说，“第五个是谁？”",0],[7367,"“我本来想写你。”我说。",0],[7369,"他愣住了。",0],[7371,"“你爸跑长途，你妈上夜班。你每天自己做饭，自己洗衣服。你不会有人找。”",0],[7373,"“那你为什么没写？”",0],[7375,"“因为你那天在办公室门口站着。”我说，“你等我下班，等了一个小时，就为了问我成汐的数学卷子能不能少扣两分。”",0],[7377,"他张了张嘴。",0],[7379,"“我那时候想，”我说，“这个孩子心里有个人。”",0],[7381,"“所以你就选了别人。”",0],[7383,"“我选了成汐。”",0],[7385,"走廊里安静了很久。",0],[7387,"久到我能听见自己的呼吸。",0],[7389,"“什么？”",0],[7391,"“我选了成汐。”",0],[7393,"他站起来。",0],[7395,"“你为什么——”",0],[7397,"“你听我说完。”",0],[7399,"“选她！”",0],[7401,"“我选她。”我说，“因为我想，这个孩子扛得住。”",0],[7403,"“扛得住？”他说，“你知不知道她今天晚上在干什么？全班同学都指望她！”",0],[7405,"他转过身，两只手撑在窗台上，肩膀剧烈地抖。",0],[7407,"“她今年十七。”他说，“她当了三年班长。她每天早上六点四十到学校，晚上十点半才走。她妈在校门口等她，她让她妈先回去。她说班里还有事。”",0],[7409,"“我知道。”",0],[7411,"“你知道你还写她？”",0],[7413,"“因为我需要一个扛得住的。”我说，“前面四个，都是扛不住的。他们一进去就散了，它吃不饱两三个月，又饿了。我要一个能撑住的，撑得久一点，让它慢一点饿。”",0],[7415,"我说完这句话，自己都觉得恶心。",0],[7417,"可这是实话。",0],[7419,"这六年来，我做的每一件事，都是这种实话。",0],[7421,"肖中转过身。",0],[7423,"他的眼睛是红的。",0],[7425,"“你跟她说过吗？”",0],[7427,"“没有。”",0],[7429,"“你打算说吗？”",0],[7431,"“不打算。”",0],[7433,"“为什么？”",0],[7435,"“因为说了，她也得死。”我说，“不说，她还能多活三年。”",0],[7437,"他看着我。",0],[7439,"“徐老师。”他说，“你不像坏人。”",0],[7441,"“你比坏人可怕。”",0],[7443,"我没有说话。",0],[7445,"因为他说的对。",0],[7447,"坏人知道自己坏。我不知道。我每天早上六点起床，七点到校，晚上十点回家。我改作业改到十二点。我给学生垫过学费，我送过学生去医院，我在家长会上替他们跟家长吵架。",0],[7449,"我是个好人。",0],[7451,"“肖中。”我说。",0],[7453,"“干什么。”",0],[7455,"“本子给你。”",0],[7457,"他看着我。",0],[7459,"“你拿着。”我说，“天亮之前，你要是能把它关回去，这个本子就没用了。你把它烧了。”",0],[7461,"“烧了，他们就真没了。”",0],[7463,"“对。”",0],[7465,"“那我不烧。”",0],[7467,"“你不烧，它就一直吃。”我说，“它吃得到就会变强。”",0],[7469,"他把本子拿起来。",0],[7471,"他拿着本子，站在走廊里，站了很久。",0],[7473,"“徐老师。”",0],[7475,"“嗯。”",0],[7477,"“姜和的名字，为什么排第一个？”",0],[7479,"“因为他家长会从来没有人来。”我说。",0],[7481,"“你不知道他是于敬堂的外孙？”",0],[7483,"“不知道。”",0],[7485,"他点点头。",0],[7487,"“我知道了。”",0],[7489,"他把本子塞进怀里。",0],[7491,"“我下去。”",0],[7493,"“肖中。”",0],[7495,"他停下来。",0],[7497,"“井边不管发生什么。”我说，“别回头。”",0],[7499,"“为什么？”",0],[7501,"“因为它只在你看不见的地方动。”我说，“你一回头，就看不见井了。”",0],[7503,"他走了。",0],[7505,"我坐在窗台上，看着他的背影消失在楼梯拐角。",0],[7507,"然后我从口袋里摸出那支红笔。",0],[7509,"我在今年那一页的第五个空上，写下两个字。",0],[7511,"成汐。",0],[7513,"写完，我把笔帽盖上。",0],[7515,"我盯着那两个字看了很久。",0],[7517,"然后我划掉了。",0],[7519,"划得很重，笔尖把纸划破了。",0],[7521,"我在旁边重新写了一个名字。",0],[7523,"肖中。",0],[7525,"我把本子合上，站起来，往楼下走。",0],[7527,"走了三步，我停下来。",0],[7529,"我站在走廊里，忽然发现自己对刚才的名字有些陌生。",0]]},{"t":"插曲 · 二〇一四","k":"inter","m":"date","d":"","f":0,"p":[[7533,"二〇一四年，徐老师二十七岁。",0],[7535,"那年她刚带完第一届，学生毕业，她哭了一场，然后被调到教务处帮忙。",0],[7537,"教务处在一楼，窗户对着操场。她每天坐在那儿整理学籍卡，一张一张地核对，核对到眼睛发酸。",0],[7539,"十一月的下午，崔校长把她叫到办公室。",0],[7541,"那时候他还是副校长，头发比现在黑，说话比现在慢。",0],[7543,"“小徐。”他说，“坐。”",0],[7545,"她坐下。",0],[7547,"他把一份文件推过来。",0],[7549,"“教育局的意思，高中部撤掉，改成职高分校。”他说，“三千个学生，学籍转过去。”",0],[7551,"她看着那份文件，看了很久。",0],[7553,"“转过去会怎么样？”",0],[7555,"“职高也能考大学。”崔校长说，“就是考上的少。”",0],[7557,"“少多少？”",0],[7559,"“去年职高本科上线率，百分之二十。”",0],[7561,"她抬起头。",0],[7563,"“那我们呢？”",0],[7565,"“百分之八十。”",0],[7567,"办公室里安静了一会儿。",0],[7569,"他站起来，走到窗边。",0],[7571,"“小徐，你教了三年书。你说，这相差的孩子，跟其他的，有什么区别？”",0],[7573,"她没有说话。",0],[7575,"“没有区别。”崔校长说，“区别是他们运气好一点，家里管得多一点，脑子转得快一点。就这一点。”",0],[7577,"他转过身。",0],[7579,"“现在有个办法，能保住这三千个孩子。”",0],[7581,"“什么办法？”",0],[7583,"“学校后头有口井。”他说。",0],[7585,"她愣住了。",0],[7587,"“什么？”",0],[7589,"“你听我说完。”崔校长说，“这口井，八五年建校的时候就在。井底下有个东西。它不吃人，它吃人和人之间关系。”",0],[7591,"“校长。”",0],[7593,"“你听我说完。”他说，“它吃得很少。一个人对另一个人的记忆，它只吃一角。被吃的人不会死，不会病，只是……他与世界就没有联系了。”",0],[7595,"“这不可能。”",0],[7597,"“我一开始也说不可能是。”崔校长说，“后来我信了。”",0],[7599,"他从抽屉里拿出一个本子。",0],[7601,"那个本子很旧，牛皮纸的封面，边角磨圆了。",0],[7603,"“这是于敬堂留下的。”他说，“他从八五年开始记，记到二〇一〇年。二十五年。”",0],[7605,"他把本子推过来。",0],[7607,"“你翻翻。”",0],[7609,"她翻开。",0],[7611,"第一页上写着一行字，毛笔，字很小：",0],[7613,"“余兴者，宴罢之余也。席散人去，独坐待哺。”",0],[7615,"她看得懂。",0],[7617,"“什么意思？”但是她还是想问。",0],[7619,"“意思是，它不是鬼。”崔校长说，“它是剩下的一点东西。人家办完事，桌子撤了，它还坐在那儿，等一口。”",0],[7621,"她合上本子。",0],[7623,"“校长。”她说，“我是个老师。”",0],[7625,"“我知道。”",0],[7627,"“我教语文的。”",0],[7629,"“我知道。”",0],[7631,"“你想让我拿孩子去喂一个……”",0],[7633,"“我没让你喂。”崔校长说，“我让你写五个名字。”",0],[7635,"他看着她。",0],[7637,"“小徐，你可以不写。你现在站起来，走出这个门，回去教你的书。明年学校合并，你调到职高，接着教。这三千个孩子，跟你没关系。”",0],[7639,"她坐着，没有动。",0],[7641,"“可是你写了，”崔校长说，“这三千个孩子，就还能在这儿念书。他们的学籍在这儿，他们的老师在这儿，他们的高考在这儿。”",0],[7643,"“那五个孩子呢？”",0],[7645,"“他们还活着。”崔校长说，“我说过了，但是没人记得他们。”",0],[7647,"她坐在那儿，看着桌上那份文件。",0],[7649,"窗外有学生在打球，球砸在地上，砰砰砰的。",0],[7651,"“为什么是我？”她问。",0],[7653,"“因为你是新来的。”崔校长说，“对学校的感情浅，最客观。”",0],[7655,"那天晚上，她回了家。",0],[7657,"她丈夫已经睡了。她坐在客厅里，把那个本子从头看到尾。",0],[7659,"本子上记着二十五个名字。每一年五个，一年一页。",0],[7661,"每一个名字后面，都有一行小字。",0],[7663,"“李某某，父亡，母改嫁，随祖母生活。”",0],[7665,"“王某某，父母在外地打工，三年未归。”",0],[7667,"“赵某某，母精神病，父服刑。”",0],[7669,"她看着那些字，看了很久。",0],[7671,"然后她拿出一支笔。",0],[7673,"她在最后一页上，写下了第一个名字。",0],[7675,"张建国。",0],[7677,"她写完，看着那三个字。",0],[7679,"她的手在抖。",0],[7681,"第二天，她把那张纸折好，装进信封，交给了崔校长。",0],[7683,"崔校长接过去，没有看。",0],[7685,"“冬至那天晚上，”他说，“你到后院来。”",0],[7687,"冬至。",0],[7689,"那天很冷。她穿了两件毛衣，还是冷。",0],[7691,"后院的老槐树落光了叶子，枝桠在月光底下像一只手。",0],[7693,"崔校长站在井边，手里拿着那个信封。",0],[7695,"“你念。”他说。",0],[7697,"“我念？”",0],[7699,"“你写的，你念。”",0],[7701,"她把信封打开。",0],[7703,"纸在风里抖。",0],[7705,"“张建国。”",0],[7707,"她念出这个名字的时候，声音很小。",0],[7709,"“大点声。”崔校长说。",0],[7711,"“张建国。”",0],[7713,"风停了。",0],[7715,"井底下有声音。",0],[7717,"不是水声。",0],[7719,"是一种很轻的、像呼吸一样的声音。",0],[7721,"她站在那儿，腿在抖。",0],[7723,"“念完。”崔校长说。",0],[7725,"她把纸上的五个名字念完。",0],[7727,"念完最后一个，井底下的声音停了。",0],[7729,"“行了。”崔校长说，“回去吧。”
